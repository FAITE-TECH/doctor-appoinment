<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Service Details</title>
  <link rel="icon" type="image/png" href="https://spchospital.com/Frontend/public/assets/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    
    <!-- Safari and Cross-browser compatibility -->
  <script src="https://spchospital.com/Frontend/public/js/browser-compat.js"></script>
  <script src="https://spchospital.com/Frontend/public/js/cross-platform-utils.js"></script>
  </head>
  <body class="bg-gray-50" style="min-height: 100vh; display: flex; flex-direction: column;">


    <!--  Import Header -->

    <div id="header"></div>
    <script>
      // Safari-compatible navigation loading
      function loadNavigation() {
        var headerEl = document.getElementById("header");
        if (!headerEl) {
          console.error('Header element not found');
          return;
        }
        
  fetch('https://spchospital.com/Frontend/pages/shared-nav.html?v=' + Date.now(), {
          method: 'GET',
          cache: 'no-cache',
          headers: {
            'Accept': 'text/html',
            'Cache-Control': 'no-cache, no-store, must-revalidate'
          }
        })
        .then(function(res) {
          if (!res.ok) {
            throw new Error('HTTP error! status: ' + res.status);
          }
          return res.text();
        })
        .then(function(data) {
          headerEl.innerHTML = data;
          // Small delay to ensure DOM is ready
          setTimeout(function() {
            if (window.initNavigationAfterLoad) {
              window.initNavigationAfterLoad();
            }
          }, 100);
        })
        .catch(function(error) {
          console.warn('Failed to load navigation:', error.message);
          // Minimal fallback nav
          headerEl.innerHTML = '<header class="bg-white shadow-md w-full"><div class="max-w-6xl mx-auto flex items-center justify-between px-4 py-3"><a href="index.html" class="flex items-center space-x-2"><img src="../public/assets/logo.png" alt="SPC Hospital Logo" class="h-8 w-auto" /><span class="font-bold text-blue-600">SPC Hospital</span></a><nav class="hidden md:flex items-center space-x-6 text-gray-600"><a href="home.html">Home</a><a href="doctors.html">Doctors</a><a href="departments.html">Departments</a><a href="services.html">Services</a><a href="gallery.html">Gallery</a><a href="events.html">Events</a><a href="contact.html">Contact</a></nav></div></header>';
        });
      }
      
      // Safari-compatible DOM ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadNavigation);
      } else {
        loadNavigation();
      }
    </script>
    </script>

    <main style="flex: 1 0 auto;">
      <div class="container mx-auto p-6">
        <div
          id="serviceDetail"
          class="flex flex-col mt-6 justify-center align-center"
        ></div>
      </div>

      <!-- Related Services -->
      <section id="services">
        <div class="text-center my-10 container mx-auto max-w-6xl px-4">
          <h2 class="text-3xl font-bold text-gray-800 mb-8">Other Services</h2>
          
          <!-- Cards Grid -->
          <div
            id="serviceContainer"
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-6 lg:gap-8 transition-all duration-500"
          >
            <!-- Cards will be injected by JS -->
          </div>
        </div>
      </section>
    </main>

    <script>
      // Global variables
      let services = [];
      let currentService = null;

      // Fetch services from API
      async function fetchServices() {
        try {
          const response = await fetch(
            window.buildApiUrl
              ? window.buildApiUrl('services.php?action=public')
              : (window.APP_API_FOLDER ? window.APP_API_FOLDER + 'services.php?action=public' : 'https://spchospital.com/Backend/api/services.php?action=public')
          );
          const data = await response.json();
          
          if (data.status === 'success') {
            services = data.data;
            loadServiceDetails();
            renderRelatedServices();
          } else {
            console.error('Failed to fetch services:', data.message);
            document.getElementById("serviceDetail").innerHTML = '<p class="text-center text-red-500">Failed to load service data: ' + (data.message || 'Unknown error') + '</p>';
          }
        } catch (error) {
          console.error('Error fetching services:', error);
          document.getElementById("serviceDetail").innerHTML = '<p class="text-center text-gray-500">Unable to load service details. Please try again later.</p>';
        }
      }

      function loadServiceDetails() {
        // Get service id from URL
        const params = new URLSearchParams(window.location.search);
        const serviceId = parseInt(params.get("id"));

        if (!serviceId || isNaN(serviceId)) {
          document.getElementById("serviceDetail").innerHTML = '<p class="text-center text-red-500 font-semibold">Invalid service ID. Please select a service from the services page.</p>';
          return;
        }

        // Check if services data is loaded
        if (!services || services.length === 0) {
          document.getElementById("serviceDetail").innerHTML = '<p class="text-center text-yellow-500">Loading service data...</p>';
          return;
        }

        // Find service by id
        currentService = services.find((s) => parseInt(s.id) === serviceId);

        if (currentService) {
          // Use the image from database or fallback to default
          // Normalize image path: extract the filename to avoid duplicate '/uploads/services' segments
          let serviceImage = "https://spchospital.com/Frontend/public/assets/eyecare.jpg";
          if (currentService.image_path) {
            const imgName = String(currentService.image_path).split('/').pop();
            if (imgName && !imgName.startsWith('http')) {
              serviceImage = window.buildUploadUrl ? window.buildUploadUrl(`services/${imgName}`) : 'https://spchospital.com/uploads/services/' + imgName;
            } else if (String(currentService.image_path).startsWith('http')) {
              serviceImage = currentService.image_path;
            } else if (String(currentService.image_path).startsWith('/')) {
              serviceImage = currentService.image_path;
            }
          }
          
          const serviceName = currentService.name || "Service";
          const serviceDescription = currentService.description || "Quality healthcare service provided by our experienced team.";
          const servicePrice = currentService.price ? parseFloat(currentService.price) : 0;

          document.getElementById("serviceDetail").innerHTML = `
            <div class="flex text-gray-600 mb-6 leading-relaxed space-x-1 text-sm justify-center max-w-6xl">
                <a href="home.html#services" class="text-blue-600 hover:underline">Home</a>
                <span>&gt;</span>
                <a href="services.html" class="text-blue-600 hover:underline">Services</a>
                <span>&gt;</span>
                <span class="text-gray-800 font-medium">${serviceName}</span>
            </div>

            <div class="bg-white p-6 flex flex-col justify-between max-w-6xl mx-auto md:flex-row gap-6">
              <img src="${serviceImage}" alt="${serviceName}" class="w-60 h-60 object-cover rounded-lg shadow-md">
              
              <div class="md:w-2/3">
                <h2 class="text-3xl font-bold text-gray-800 mb-2">${serviceName}</h2>
                
                <div class="mb-6">
                  <span class="text-3xl font-bold text-green-600">Rs ${servicePrice.toFixed(2)}</span>
                  <span class="text-gray-500 ml-2">per session</span>
                </div>
                
                <p class="text-gray-600 leading-relaxed mb-4">${serviceDescription}</p>
                
                <div class="mt-6">
                  <h3 class="text-xl font-bold text-gray-800 mb-4">What's Included</h3>
                  <ul class="list-disc list-inside space-y-2 text-gray-600">
                    <li>Professional consultation and assessment</li>
                    <li>Comprehensive treatment plan</li>
                    <li>Follow-up care and monitoring</li>
                    <li>24/7 support and assistance</li>
                    <li>Quality guarantee on all services</li>
                  </ul>
                </div>

              </div>
            </div>
          `;
        } else {
          document.getElementById("serviceDetail").innerHTML = '<p class="text-red-500 font-semibold">Service not found. The service with ID ' + serviceId + ' does not exist.</p>';
        }
      }

      function renderRelatedServices() {
        const serviceContainer = document.getElementById("serviceContainer");
        if (!serviceContainer) return;

        // Filter out current service
        const relatedServices = services.filter((s) => 
          parseInt(s.id) !== parseInt(currentService?.id || 0)
        );

        if (relatedServices.length === 0) {
          serviceContainer.innerHTML = '<p class="text-center text-gray-500 col-span-full">No other services available.</p>';
          return;
        }

        // Show only first 4 related services
        const displayServices = relatedServices.slice(0, 4);

        serviceContainer.innerHTML = displayServices
          .map((service) => {
            // Normalize related service image path
            let serviceImage = "../public/assets/eyecare.jpg";
            if (service.image_path) {
              const imgName = String(service.image_path).split('/').pop();
              if (imgName && !imgName.startsWith('http')) {
                serviceImage = window.buildUploadUrl ? window.buildUploadUrl(`services/${imgName}`) : 'https://spchospital.com/uploads/services/' + imgName;
              } else if (String(service.image_path).startsWith('http')) {
                serviceImage = service.image_path;
              } else if (String(service.image_path).startsWith('/')) {
                serviceImage = service.image_path;
              }
            }

            const servicePrice = service.price ? parseFloat(service.price) : 0;

            return `
              <div class="bg-white border border-gray-200 overflow-hidden shadow-sm hover:shadow-lg transition flex flex-col">
                <a href="service-details.html?id=${service.id}">
                  <div class="relative h-56 w-full overflow-hidden group">
                    <img src="${serviceImage}" alt="${service.name}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                  </div>
                </a>

                <div class="p-4 sm:p-6 flex flex-col flex-grow">
                  <div class="text-right mb-2">
                    <span class="text-base sm:text-lg font-bold text-green-600">Rs ${servicePrice.toFixed(2)}</span>
                  </div>
                  <h3 class="text-lg sm:text-xl font-semibold text-blue-800 mb-2 text-start">${service.name}</h3>
                  <p class="text-gray-600 text-sm sm:text-md mb-4 clamp-4 text-start leading-relaxed">${service.description || "Quality healthcare service provided by our experienced team."}</p>
                </div>
              </div>
            `;
          })
          .join("");
      }

      // Initialize when page loads
      document.addEventListener('DOMContentLoaded', function() {
        fetchServices();
      });
    </script>

    <style>
      /* Simple fade-in animation */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-fadeIn {
        animation: fadeIn 0.5s ease forwards;
      }
    </style>

    <!-- Footer -->
    <div id="footer"></div>
    <script>
      // Safari-compatible footer loading
      function loadFooter() {
        var footerEl = document.getElementById("footer");
        if (!footerEl) {
          console.error('Footer element not found');
          return;
        }
        
  fetch('https://spchospital.com/Frontend/pages/footer.html?v=' + Date.now(), {
          method: 'GET',
          cache: 'no-cache',
          headers: {
            'Accept': 'text/html',
            'Cache-Control': 'no-cache, no-store, must-revalidate'
          }
        })
        .then(function(res) {
          if (!res.ok) {
            throw new Error('HTTP error! status: ' + res.status);
          }
          return res.text();
        })
        .then(function(data) {
          footerEl.innerHTML = data;
          // Add proper styling to footer without affecting body layout
          var footer = footerEl.querySelector('footer');
          if (footer) {
            footer.style.marginTop = 'auto';
            footer.style.flexShrink = '0';
          }
        })
        .catch(function(error) {
          console.warn('Failed to load footer:', error.message);
          // Minimal fallback footer with proper styling
          footerEl.innerHTML = '<footer class="bg-gray-700 text-white py-6" style="margin-top: auto; flex-shrink: 0;"><div class="container mx-auto px-4 text-center"><p>&copy; 2025 SPC Hospital. All rights reserved.</p></div></footer>';
        });
      }
      
      // Load footer immediately on DOM ready to prevent layout issues
      loadFooter();
    </script>

    <!-- Placeholder for spinner -->
    <div id="spinner"></div>

    <script>
      // Load spinner markup
  fetch('https://spchospital.com/Frontend/pages/spinner.html')
        .then(res => res.text())
        .then(data => {
          document.getElementById("spinner").innerHTML = data;

          // Now spinner is in DOM -> attach JS logic
          const spinner = document.getElementById("spinner-overlay");

          function showSpinner() {
            spinner.classList.remove("hidden");
          }
          function hideSpinner() {
            spinner.classList.add("hidden");
          }

          // Show on links
          document.querySelectorAll("a").forEach(link => {
            link.addEventListener("click", () => {
              if (link.getAttribute("href") !== "#" && !link.getAttribute("href")?.startsWith("javascript")) {
                showSpinner();
                setTimeout(hideSpinner, 10000);
              }
            });
          });

          // Show on .show-spinner buttons
          document.querySelectorAll("button.show-spinner").forEach(btn => {
            btn.addEventListener("click", () => {
              showSpinner();
              setTimeout(hideSpinner, 10000);
            });
          });

          // Show on form submit
          document.querySelectorAll("form").forEach(form => {
            form.addEventListener("submit", () => {
              showSpinner();
              setTimeout(hideSpinner, 10000);
            });
          });

          // Optional: hide spinner after page load (auto)
          setTimeout(() => hideSpinner(), 10000);
        });
    </script>

  <script src="https://spchospital.com/Frontend/public/js/config.js"></script>
  <script src="https://spchospital.com/Frontend/public/js/script.js"></script>
    <script src="shared-nav.js"></script>
  </body>
</html>
