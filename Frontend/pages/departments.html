<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

  <link rel="stylesheet" href="https://spchospital.com/Frontend/public/css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  <link rel="icon" type="image/png" href="https://spchospital.com/Frontend/public/assets/logo.png" />
  <script src="https://spchospital.com/Frontend/public/js/config.js"></script>
  <script src="https://spchospital.com/Frontend/public/js/script.js"></script>
    <title>Departments</title>
  </head>
  <body>
    <div id="header"></div>
    <script>
      fetch('https://spchospital.com/Frontend/pages/shared-nav.html?v=' + Date.now())
        .then((res) => res.text())
        .then((data) => {
          document.getElementById('header').innerHTML = data;
          if (window.initNavigationAfterLoad) {
            window.initNavigationAfterLoad();
          }
        }).catch(e => console.warn('Failed to load nav:', e));
    </script>

    <div class="relative w-full h-32 sm:h-40 max-w-6xl mx-auto mx-4 sm:mx-auto">
            <img src="https://spchospital.com/Frontend/public/assets/eyecare.jpg" alt="services" class="w-full h-full object-cover rounded-lg">
            <h1 class="absolute bottom-2 left-2 text-lg sm:text-xl font-bold text-white bg-black/50 px-2 py-1 rounded">
                 Departments
            </h1>
        </div>


        <div class="flex text-gray-600 my-6 sm:my-10 leading-relaxed space-x-1 text-xs sm:text-sm mx-auto justify-center max-w-6xl px-4">
            <a href="home.html#doctors" class="text-blue-600 hover:underline">Home</a>
            <span>&gt;</span>
            <a href="doctors.html" class="text-blue-600 hover:underline">Departments</a>
            <span>&gt;</span>
        </div>


  <section id="services">
      <div class="text-center my-6 sm:my-10 container mx-auto max-w-6xl px-4">
       

        <!-- Services Cards Grid -->
        <div
          id="serviceContainer"
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-6 lg:gap-8 mt-6 sm:mt-10"
        >
          <!-- Cards will be injected by JS -->
        </div>

       
      </div>
    </section>
    <script>
      // Global variable to store departments data
      let departments = [];

      // Fetch departments from API
      async function fetchDepartments() {
        try {
          // Use buildApiUrl if available, otherwise fall back to APP_API_FOLDER or production URL
          const apiEndpoint = (typeof window.buildApiUrl === 'function')
            ? window.buildApiUrl('departments.php?action=public')
            : ((window.APP_API_FOLDER ? (window.APP_API_FOLDER + 'departments.php?action=public') : 'https://spchospital.com/Backend/api/departments.php?action=public'));

          const response = await fetch(apiEndpoint, { credentials: 'include' });
          const data = await response.json();
          
          if (data.status === 'success') {
            departments = data.data;
            renderDepartments();
          } else {
            console.error('Failed to fetch departments:', data.message);
            // Fallback to empty state
            const serviceContainer = document.getElementById("serviceContainer");
            serviceContainer.innerHTML = '<p class="text-center text-gray-500 col-span-full">No departments available at the moment.</p>';
          }
        } catch (error) {
          console.error('Error fetching departments:', error);
          // Fallback to empty state
          const serviceContainer = document.getElementById("serviceContainer");
          serviceContainer.innerHTML = '<p class="text-center text-gray-500 col-span-full">Unable to load departments. Please try again later.</p>';
        }
      }

      // Render departments on the page
      function renderDepartments() {
        const serviceContainer = document.getElementById("serviceContainer");
        serviceContainer.innerHTML = ''; // Clear existing content

        if (departments.length === 0) {
          serviceContainer.innerHTML = '<p class="text-center text-gray-500 col-span-full">No departments available at the moment.</p>';
          return;
        }

          departments.forEach((department) => {
          const departmentCard = document.createElement("div");
          departmentCard.className =
            "bg-white border border-gray-200 overflow-hidden shadow-sm hover:shadow-lg transition flex flex-col";

          // Resolve department image intelligently:
          // - If API returns a full URL, use it
          // - If it returns a leading-slash path (/uploads/...), make it absolute against origin
          // - If it returns 'uploads/departments/...' avoid duplicating segments
          // - Otherwise prefer window.buildUploadUrl(filename) when available, or fallback to known uploads URL
          function resolveDepartmentImage(path) {
            const fallback = "https://spchospital.com/Frontend/public/assets/nephrology.jpg";
            if (!path) return fallback;
            const p = String(path || '').trim();
            if (!p) return fallback;
            // Full URL?
            if (/^https?:\/\//i.test(p)) return p;
            // Leading slash -> absolute path
            if (p.startsWith('/')) return window.location.origin.replace(/\/+$|$/, '') + p;
            // If the path already contains uploads/ (e.g. 'uploads/departments/..' or 'uploads/...'), make absolute
            if (p.indexOf('uploads/') !== -1) {
              return window.location.origin.replace(/\/+$|$/, '') + '/' + p.replace(/^\/+/, '');
            }
            // Otherwise, p is likely a bare filename or relative path. Use buildUploadUrl if available
            const filename = p.split('/').pop();
            if (typeof window.buildUploadUrl === 'function') {
              try { return window.buildUploadUrl('departments/' + filename); } catch (e) {}
            }
            return 'https://spchospital.com/uploads/departments/' + filename;
          }

          const departmentImage = resolveDepartmentImage(department.image_path);
          const departmentName = department.name || "Department";
          const departmentDescription = department.description || "Specialized medical department providing quality healthcare services.";

          departmentCard.innerHTML = `
        <!-- Department Image Wrapper -->
        <a href="department-details.html?id=${department.id}">
          <div class="relative h-56 w-full overflow-hidden group">
            <img src="${departmentImage}" alt="${departmentName}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
          </div>
        </a>

        <!-- Department Content -->
        <div class="p-6 flex flex-col flex-grow department-card-content">
          <h3 class="text-xl font-semibold text-blue-800 text-start mb-2">${departmentName}</h3>
          <p class="text-gray-600 text-md clamp-4 text-start department-description">${departmentDescription}</p>
        </div>
      `;

          serviceContainer.appendChild(departmentCard);
        });
      }

      // Initialize when page loads
      document.addEventListener("DOMContentLoaded", () => {
        fetchDepartments();
      });
    </script>

    <!-- Footer -->
    <div id="footer"></div>
    <script>
      fetch('https://spchospital.com/Frontend/pages/footer.html')
        .then((res) => res.text())
        .then((data) => {
          document.getElementById('footer').innerHTML = data;
        }).catch(e => console.warn('Failed to load footer:', e));
    </script>


 <!-- Placeholder for spinner -->
<div id="spinner"></div>

<script>
  // Load spinner markup
  fetch('https://spchospital.com/Frontend/pages/spinner.html')
    .then(res => res.text())
    .then(data => {
      document.getElementById("spinner").innerHTML = data;

      // Now spinner is in DOM -> attach JS logic
      const spinner = document.getElementById("spinner-overlay");

      function showSpinner() {
        spinner.classList.remove("hidden");
      }
      function hideSpinner() {
        spinner.classList.add("hidden");
      }

      // Show on links
    document.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", () => {
        if (link.getAttribute("href") !== "#" && !link.getAttribute("href")?.startsWith("javascript")) {
          showSpinner();
          setTimeout(hideSpinner, 10000); // works now
        }
      });
    });

    // Show on .show-spinner buttons
    document.querySelectorAll("button.show-spinner").forEach(btn => {
      btn.addEventListener("click", () => {
        showSpinner();
        setTimeout(hideSpinner, 10000); // works now
      });
    });

    // Show on form submit
    document.querySelectorAll("form").forEach(form => {
      form.addEventListener("submit", () => {
        showSpinner();
        setTimeout(hideSpinner, 10000); // works now
      });
    });

    // Optional: hide spinner after page load (auto)
    setTimeout(() => hideSpinner(), 10000);
    });
</script>

  <script src="https://spchospital.com/Frontend/public/js/config.js"></script>
  <script src="https://spchospital.com/Frontend/public/js/script.js"></script>
    <script src="shared-nav.js"></script>
    <!-- Footer -->
    <div id="footer"></div>
    <script>
      fetch("footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer").innerHTML = data;
        });
    </script>
  </body>
</html>
