<html lang="en">
  <head>
    <meta charset="UTF-8" />

      rel="stylesheet"

  <link rel="stylesheet" href="https://spchospital.com/Frontend/public/css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://spchospital.com/Frontend/public/css/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <title>Events</title>
  </head>
  <body>
    <div id="header"></div>
    <script>
  fetch('shared-nav.html?v=' + Date.now())
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("header").innerHTML = data;
          // Initialize navigation after it's loaded
          if (window.initNavigationAfterLoad) {
            window.initNavigationAfterLoad();
          }
        });
    </script>

    <div class="relative w-full h-32 sm:h-40 max-w-6xl mx-auto mx-4 sm:mx-auto">
            <img src="../public/assets/eyecare.jpg" alt="services" class="w-full h-full object-cover rounded-lg">
            <h1 class="absolute bottom-2 left-2 text-lg sm:text-xl font-bold text-white bg-black/50 px-2 py-1 rounded">
                 Events
            </h1>
        </div>


        <div class="flex text-gray-600 my-6 sm:my-10 leading-relaxed space-x-1 text-xs sm:text-sm justify-center max-w-6xl px-4">
            <a href="home.html#doctors" class="text-blue-600 hover:underline">Home</a>
            <span>&gt;</span>
            <a href="doctors.html" class="text-blue-600 hover:underline">Events</a>
            <span>&gt;</span>
        </div>


  <section id="services">
      <div class="text-center my-6 sm:my-10 container mx-auto max-w-6xl px-4">
       

        <!-- Services Cards Grid -->
        <div
          id="serviceContainer"
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-6 lg:gap-8 mt-6 sm:mt-10"
        >
          <!-- Cards will be injected by JS -->
        </div>

       
      </div>
    </section>
    <script>
      // Global variable to store events data
      let events = [];

      // Safe helper to build API URLs. Prefer window.buildApiUrl when available,
      // otherwise fall back to APP_API_FOLDER or a production URL. This mirrors
      // other pages in the project and prevents errors when the config script
      // didn't load or was blocked.
      function apiUrl(endpoint) {
        try {
          if (typeof window.buildApiUrl === 'function') return window.buildApiUrl(endpoint);
          var ep = endpoint || '';
          if (ep.startsWith('/')) ep = ep.substring(1);
          var folder = window.APP_API_FOLDER || 'https://spchospital.com/Backend/api/';
          if (!folder.endsWith('/')) folder = folder + '/';
          return folder + ep;
        } catch (e) {
          return 'https://spchospital.com/Backend/api/' + (endpoint || '');
        }
      }

      // Fetch events from API
      async function fetchEvents() {
        try {
          const response = await fetch(apiUrl('events.php?action=public'), { credentials: 'include' });
          const data = await response.json();

          if (data.status === 'success' || Array.isArray(data.data)) {
            // Some endpoints return { status: 'success', data: [...] }
            // while others may return { events: [...] }. Try to be flexible.
            events = data.data || data.events || data || [];
            renderEvents();
          } else {
            console.error('Failed to fetch events:', data.message || data);
            // Fallback to empty state
            const serviceContainer = document.getElementById('serviceContainer');
            serviceContainer.innerHTML = '<p class="text-center text-gray-500 col-span-full">No events available at the moment.</p>';
          }
        } catch (error) {
          console.error('Error fetching events:', error);
          // Fallback to empty state
          const serviceContainer = document.getElementById('serviceContainer');
          serviceContainer.innerHTML = '<p class="text-center text-gray-500 col-span-full">Unable to load events. Please try again later.</p>';
        }
      }

      // Helper to build event image URL. Accepts a filename, relative path, or absolute URL
      // and returns a usable image URL without duplicating path segments.
      function buildEventImageUrl(imagePath) {
        if (!imagePath) return null;
        const imgPath = String(imagePath || '');
        if (imgPath.startsWith('http')) return imgPath;
        // If it already contains the uploads path, normalize to origin + path
        if (imgPath.indexOf('/uploads/events/') !== -1) {
          // Remove duplicate leading slashes
          const cleaned = imgPath.replace(/\/\/+/, '/');
          if (cleaned.startsWith('/')) return window.location.origin + cleaned;
          return window.location.origin + '/' + cleaned;
        }

        // If it starts with a slash, treat as absolute path
        if (imgPath.startsWith('/')) return window.location.origin + imgPath;

        // Otherwise, try to use buildUploadUrl if available, or construct a path
        const imgName = imgPath.split('/').pop();
        if (!imgName) return null;
        if (typeof window.buildUploadUrl === 'function') {
          return window.buildUploadUrl('events/' + imgName);
        }
        // Attempt to construct a relative uploads path depending on app path
        const basePath = window.location.pathname.includes('/doctor-appoinment') ? window.location.pathname.split('/doctor-appoinment')[0] + '/doctor-appoinment' : '';
        return window.location.origin + basePath + '/uploads/events/' + imgName;
      }

      // Render events on the page
      function renderEvents() {
        const serviceContainer = document.getElementById("serviceContainer");
        serviceContainer.innerHTML = ''; // Clear existing content

        if (events.length === 0) {
          serviceContainer.innerHTML = '<p class="text-center text-gray-500 col-span-full">No events available at the moment.</p>';
          return;
        }

        events.forEach((event) => {
          const eventCard = document.createElement("div");
          eventCard.className =
            "bg-white border border-gray-200 overflow-hidden shadow-sm hover:shadow-lg transition flex flex-col";

          // Use the image from database or fallback to default. Use a helper
          // to normalize values that may already include paths or full URLs.
          const eventImage = buildEventImageUrl(event.image_path) || "https://spchospital.com/Frontend/public/assets/eyecare.jpg";
          const eventTitle = event.title || "Event";
          const eventDescription = event.description || "Join us for this special event.";
          const eventDate = event.event_date ? new Date(event.event_date).toLocaleDateString() : "TBA";

          eventCard.innerHTML = `
        <!-- Event Image Wrapper -->
        <a href="event-details.html?id=${event.id}">
          <div class="relative h-56 w-full overflow-hidden group">
            <img src="${eventImage}" alt="${eventTitle}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
          </div>
        </a>

        <!-- Event Content -->
        <div class="p-4 sm:p-6 flex flex-col justify-between flex-grow">
          <h3 class="text-lg sm:text-xl font-semibold text-blue-800 mb-1 text-start">${eventTitle}</h3>
          <p class="text-gray-600 text-sm sm:text-md mb-4 clamp-4 text-start leading-relaxed">${eventDescription}</p>
          <p class="text-gray-500 text-xs text-start">${eventDate}</p>
        </div>
      `;

          serviceContainer.appendChild(eventCard);
        });
      }

      // Initialize when page loads
      document.addEventListener("DOMContentLoaded", () => {
        fetchEvents();
      });
    </script>

    <!-- Footer -->
    <div id="footer"></div>
    <script>
  fetch('https://spchospital.com/Frontend/pages/footer.html?v=' + Date.now())
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("footer").innerHTML = data;
        });
    </script>
     <!-- Placeholder for spinner -->
<div id="spinner"></div>

<script>
  // Load spinner markup
  fetch('https://spchospital.com/Frontend/pages/spinner.html')
    .then(res => res.text())
    .then(data => {
      document.getElementById("spinner").innerHTML = data;

      // Now spinner is in DOM -> attach JS logic
      const spinner = document.getElementById("spinner-overlay");

      function showSpinner() {
        spinner.classList.remove("hidden");
      }
      function hideSpinner() {
        spinner.classList.add("hidden");
      }

      // Show on links
    document.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", () => {
        if (link.getAttribute("href") !== "#" && !link.getAttribute("href")?.startsWith("javascript")) {
          showSpinner();
          setTimeout(hideSpinner, 10000); // works now
        }
      });
    });

    // Show on .show-spinner buttons
    document.querySelectorAll("button.show-spinner").forEach(btn => {
      btn.addEventListener("click", () => {
        showSpinner();
        setTimeout(hideSpinner, 10000); // works now
      });
    });

    // Show on form submit
    document.querySelectorAll("form").forEach(form => {
      form.addEventListener("submit", () => {
        showSpinner();
        setTimeout(hideSpinner, 10000); // works now
      });
    });

    // Optional: hide spinner after page load (auto)
    setTimeout(() => hideSpinner(), 10000);
    });
</script>

  <script src="https://spchospital.com/Frontend/public/js/config.js"></script>
  <script src="https://spchospital.com/Frontend/public/js/script.js"></script>
