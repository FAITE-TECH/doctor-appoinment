    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />

    <title>Events</title>
  </head>
  <body>
    <div id="header"></div>
    <script>
      fetch("header.html")
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("header").innerHTML = data;

          // === Mobile menu toggle ===
          const mobileMenuToggle = document.getElementById("mobileMenuToggle");
          const mobileMenu = document.getElementById("mobileMenu");

          if (mobileMenuToggle && mobileMenu) {
            mobileMenuToggle.addEventListener("click", () => {
              mobileMenu.classList.toggle("hidden");
            });
          }

          // === Main Doctor dropdown ===
          document.querySelectorAll("[data-dropdown]").forEach((button) => {
            button.addEventListener("click", () => {
              const menu = button.nextElementSibling;
              menu.classList.toggle("hidden");
            });
          });

          // === Submenus ===
          document.querySelectorAll("[data-submenu]").forEach((button) => {
            button.addEventListener("click", () => {
              const submenu = button.nextElementSibling;

              // Close other submenus first
              document
                .querySelectorAll("[data-submenu-menu]")
                .forEach((menu) => {
                  if (menu !== submenu) menu.classList.add("hidden");
                });

              // Toggle clicked submenu
              submenu.classList.toggle("hidden");
            });
          });
        });
    </script>

    <div class="relative w-full h-40 max-w-6xl mx-auto">
      <img
        src="../public/assets/eyecare.jpg"
        alt="services"
        class="w-full h-full object-cover rounded-lg"
      />
      <h1
        class="absolute bottom-2 left-2 text-xl font-bold text-white bg-black/50 px-2 py-1 rounded"
      >
        Events
      </h1>
    </div>

    <div
      class="flex text-gray-600 my-10 leading-relaxed space-x-1 text-sm justify-center max-w-6xl"
    >
      <a href="home.html#doctors" class="text-blue-600 hover:underline">Home</a>
      <span>&gt;</span>
      <a href="doctors.html" class="text-blue-600 hover:underline">Events</a>
      <span>&gt;</span>
    </div>

    <section id="services" data-animate="fade-right" class="opacity-0 transition-all duration-[2000ms] ease-out">
      <div class="text-center my-10 container mx-auto max-w-6xl px-4">
        <!-- Services Cards Grid -->
        <div
          id="serviceContainer"
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 mt-10"
        >
          <!-- Cards will be injected by JS -->
        </div>
      </div>
    </section>
    <script src="services-data.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const serviceContainer = document.getElementById("serviceContainer");

        services.forEach((service) => {
          const serviceCard = document.createElement("div");
          serviceCard.className =
            "bg-white border border-gray-200  overflow-hidden shadow-sm hover:shadow-lg transition flex flex-col";

          serviceCard.innerHTML = `
        <!-- Service Image Wrapper -->
        <a  href="service-details.html?id=${service.id}">
        <div class="relative h-56 w-full overflow-hidden group">
          <img src="${service.img}" alt="${service.type}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
          
        </div>
        </a>

        <!-- Service Content -->
        <div class="p-6 flex flex-col justify-between flex-grow">
          <h3 class="text-xl font-semibold text-blue-800 mb-2 text-start">${service.type}</h3>
          

          <p class="text-gray-600 text-md mb-4 clamp-4 text-start leading-relaxed">${service.description}</p>

      
        </div>
      `;

          serviceContainer.appendChild(serviceCard);
        });
      });
    </script>

    <!-- Footer -->
    <div id="footer"></div>
    <script>
      fetch("footer.html")
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("footer").innerHTML = data;

          // Now the footer exists, so set the year
          const yearSpan = document.getElementById("currentYear");
          if (yearSpan) {
            yearSpan.textContent = new Date().getFullYear();
          }
        });
    </script>
    <!-- Placeholder for spinner -->
    <div id="spinner"></div>

    <script>
      // Load spinner markup
      fetch("spinner.html")
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("spinner").innerHTML = data;

          // Now spinner is in DOM -> attach JS logic
          const spinner = document.getElementById("spinner-overlay");

          function showSpinner() {
            spinner.classList.remove("hidden");
          }
          function hideSpinner() {
            spinner.classList.add("hidden");
          }

          // Show on links
          document.querySelectorAll("a").forEach((link) => {
            link.addEventListener("click", () => {
              if (
                link.getAttribute("href") !== "#" &&
                !link.getAttribute("href")?.startsWith("javascript")
              ) {
                showSpinner();
                setTimeout(hideSpinner, 10000); // works now
              }
            });
          });

          // Show on .show-spinner buttons
          document.querySelectorAll("button.show-spinner").forEach((btn) => {
            btn.addEventListener("click", () => {
              showSpinner();
              setTimeout(hideSpinner, 10000); // works now
            });
          });

          // Show on form submit
          document.querySelectorAll("form").forEach((form) => {
            form.addEventListener("submit", () => {
              showSpinner();
              setTimeout(hideSpinner, 10000); // works now
            });
          });

          // Optional: hide spinner after page load (auto)
          setTimeout(() => hideSpinner(), 10000);
        });
    </script>

        <!-- Scroll Animations -->
    <script>
      const elements = document.querySelectorAll("[data-animate]");

      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              const el = entry.target;
              const anim = el.dataset.animate;

              el.classList.remove("opacity-0");

              if (anim === "fade-up") {
                el.classList.add("opacity-100", "translate-y-0");
                el.classList.remove("translate-y-10");
              } else if (anim === "fade-left") {
                el.classList.add("opacity-100", "translate-x-0");
                el.classList.remove("-translate-x-10");
              } else if (anim === "fade-right") {
                el.classList.add("opacity-100", "translate-x-0");
                el.classList.remove("translate-x-10");
              } else if (anim === "fade-in") {
                el.classList.add("opacity-100");
              }

              observer.unobserve(el); // run animation once
            }
          });
        },
        { threshold: 0.2 } // trigger when 20% visible
      );

      // Initial positions before animation
      elements.forEach((el) => {
        const anim = el.dataset.animate;
        if (anim === "fade-up") el.classList.add("translate-y-10");
        if (anim === "fade-left") el.classList.add("-translate-x-10");
        if (anim === "fade-right") el.classList.add("translate-x-10");
        observer.observe(el);
      });
    </script>

    <script src="../public/js/script.js"></script>
  </body>
</html>
