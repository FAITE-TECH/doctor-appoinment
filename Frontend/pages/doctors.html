<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="https://spchospital.com/Frontend/public/assets/logo.png" />

    <title>Doctor Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <!-- Load config first so window.buildApiUrl is available -->
  <script src="https://spchospital.com/Frontend/public/js/config.js"></script>
  <script src="https://spchospital.com/Frontend/public/js/script.js"></script>
    <style>
      /* Ensure proper page structure */
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      main {
        flex: 1 0 auto;
      }
    </style>
  </head>
  <body>
    <div id="header"></div>
    <script>
      // Load navigation content (production absolute path)
  fetch('https://spchospital.com/Frontend/pages/shared-nav.html?v=' + Date.now())
        .then((res) => res.text())
        .then((data) => {
          document.getElementById('header').innerHTML = data;
          setTimeout(() => {
            if (typeof initMobileMenu === 'function') {
              initMobileMenu();
              setActiveNavLink();
            }
          }, 100);
        }).catch(e => console.warn('Failed to load nav:', e));
    </script>

    <div class="relative w-full h-32 sm:h-40 max-w-6xl mx-auto mx-4 sm:mx-auto">
      <img
  src="https://spchospital.com/Frontend/public/assets/eyecare.jpg"
        alt="services"
        class="w-full h-full object-cover rounded-lg"
      />
      <h1
        class="absolute bottom-2 left-2 text-lg sm:text-xl font-bold text-white bg-black/50 px-2 py-1 rounded"
      >
        Doctors
      </h1>
    </div>

    <div
      class="flex text-gray-600 my-6 sm:my-10 leading-relaxed space-x-1 text-xs sm:text-sm justify-center max-w-6xl px-4"
    >
      <a href="home.html#doctors" class="text-blue-600 hover:underline">Home</a>
      <span>&gt;</span>
      <a href="doctors.html" class="text-blue-600 hover:underline">Doctors</a>
      <span>&gt;</span>
    </div>



    <!-- Filter -->
    <section id="doctors">
      <div class="text-center my-6 sm:my-10 container mx-auto max-w-6xl px-4">
        <!-- Search Bar -->
        <div class="mb-6 sm:mb-8">
          <div class="relative max-w-md mx-auto">
            <input
              type="text"
              id="doctorSearch"
              placeholder="Search doctors by name, email, phone, or specialization..."
              class="w-full px-4 py-3 pl-12 pr-4 text-gray-700 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            />
            <div class="absolute inset-y-0 left-0 flex items-center pl-4">
              <i class="fas fa-search text-gray-400"></i>
            </div>
            <button
              id="clearSearch"
              class="absolute inset-y-0 right-0 flex items-center pr-4 text-gray-400 hover:text-gray-600 hidden"
            >
              <i class="fas fa-times"></i>
            </button>
          </div>
        </div>

        <!-- Filter Buttons -->
        <div
          id="doctorFilter"
          class="flex flex-wrap justify-center gap-2 sm:gap-4 mb-6 sm:mb-10"
        >
          <button
            class="filter-btn relative px-3 sm:px-4 py-1 sm:py-2 text-black transition text-sm sm:text-base"
            data-filter="All"
          >
            All
            <div
              class="underline w-full h-0.5 bg-red-400 absolute bottom-0 left-0"
            ></div>
          </button>
          <!-- Dynamic department buttons will be added here by JavaScript -->
        </div>

        <!-- Cards Grid -->
        <div
          id="doctorContainer"
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-6 lg:gap-8 transition-all duration-500"
        >
          <!-- Cards will be injected by JS -->
        </div>
      </div>
    </section>

    <script>
      // Global variable to store doctors data
      let doctors = [];
      let availableDepartments = new Set();
      let doctorContainer;
      let currentSearchTerm = '';
      let currentFilter = 'All';

      // Fetch doctors from API
      async function fetchDoctors(searchTerm = '') {
        try {
          let url = window.buildApiUrl
            ? window.buildApiUrl('doctors.php?action=doctors')
            : (window.APP_API_FOLDER ? window.APP_API_FOLDER + 'doctors.php?action=doctors' : 'https://spchospital.com/Backend/api/doctors.php?action=doctors');
          if (searchTerm) {
            url += '&search=' + encodeURIComponent(searchTerm);
          }
          
          const response = await fetch(url, { credentials: 'include' });
          const data = await response.json();
          
          if (data.status === 'success') {
            doctors = data.data;
            
            // Extract unique departments from doctors data
            availableDepartments.clear();
            doctors.forEach(doctor => {
              if (doctor.department_name) {
                availableDepartments.add(doctor.department_name);
              }
            });
            
            // Update filter buttons dynamically
            updateFilterButtons();
            
            // Apply current filter to the fetched doctors
            applyCurrentFilter();
          } else {
            console.error('Failed to fetch doctors:', data.message);
            // Fallback to empty state
            const doctorContainer = document.getElementById("doctorContainer");
            doctorContainer.innerHTML = '<p class="text-center text-gray-500 col-span-full">No doctors available at the moment.</p>';
          }
        } catch (error) {
          console.error('Error fetching doctors:', error);
          // Fallback to empty state
          const doctorContainer = document.getElementById("doctorContainer");
          doctorContainer.innerHTML = '<p class="text-center text-gray-500 col-span-full">Unable to load doctors. Please try again later.</p>';
        }
      }

      // Render doctors function (global scope)
      function renderDoctors(filteredDoctors) {
        // Clear container
        doctorContainer.innerHTML = "";

        if (filteredDoctors.length === 0) {
          doctorContainer.innerHTML = '<p class="text-center text-gray-500 col-span-full">No doctors found for the selected filter.</p>';
          return;
        }

        filteredDoctors.forEach((doctor) => {
          const doctorCard = document.createElement("div");
          doctorCard.className =
            "bg-white border border-gray-200 overflow-hidden shadow-sm hover:shadow-lg transition flex flex-col transform opacity-0 animate-fadeIn";

          // Use the image from database or fallback to default (prefer buildUploadUrl)
          let doctorImage = doctor.image_path ? (window.buildUploadUrl ? window.buildUploadUrl(`doctors/${doctor.image_path}`) : ('https://spchospital.com/uploads/doctors/' + doctor.image_path)) : "https://spchospital.com/Frontend/public/assets/doctor1.jpg";
          const doctorSpecialization = doctor.specialization || doctor.department_name || "General";
          const doctorDescription = doctor.description || "Experienced medical professional dedicated to providing quality healthcare services.";

          doctorCard.innerHTML = `
        <!-- Doctor Image Wrapper -->
        <a href="doctor-details.html?id=${doctor.id}">
          <div class="relative h-56 w-full overflow-hidden group">
            <img src="${doctorImage}" alt="${doctor.name}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
          </div>
        </a>

        <!-- Doctor Content -->
        <div class="p-4 sm:p-6 flex flex-col justify-between flex-grow">
          <h3 class="text-lg sm:text-xl font-sans-serif text-blue-800 mb-2 text-start">${doctor.name}</h3>
          <p class="bg-green-100 text-blue-500 text-xs font-[Roboto] px-2 sm:px-3 py-1 rounded-full uppercase w-fit mb-3">${doctorSpecialization}</p>
          <p class="text-gray-600 text-sm sm:text-md mb-4 clamp-4 text-start leading-relaxed">${doctorDescription}</p>
        </div>
      `;

          doctorContainer.appendChild(doctorCard);

          // Animate card fade in
          requestAnimationFrame(() => {
            doctorCard.classList.remove("opacity-0");
          });
        });
      }

      // Update filter buttons based on available departments
      function updateFilterButtons() {
        const filterContainer = document.getElementById("doctorFilter");
        
        // Keep the "All" button and remove others
        const allButton = filterContainer.querySelector('[data-filter="All"]');
        filterContainer.innerHTML = '';
        filterContainer.appendChild(allButton);
        
        // Add dynamic department buttons
        availableDepartments.forEach(department => {
          const button = document.createElement('button');
          button.className = 'filter-btn relative px-3 sm:px-4 py-1 sm:py-2 text-black transition text-sm sm:text-base';
          button.setAttribute('data-filter', department);
          button.innerHTML = `
            ${department}
            <div class="underline hidden w-full h-0.5 bg-red-400 absolute bottom-0 left-0"></div>
          `;
          filterContainer.appendChild(button);
        });
        
        // Re-attach event listeners to all filter buttons
        attachFilterListeners();
      }

      // Apply current filter to doctors
      function applyCurrentFilter() {
        let filteredDoctors = doctors;
        
        // Apply department filter if not "All"
        if (currentFilter !== 'All') {
          filteredDoctors = doctors.filter((d) => 
            d.department_name && d.department_name === currentFilter
          );
        }
        
        renderDoctors(filteredDoctors);
      }

      // Handle search functionality
      function setupSearchFunctionality() {
        const searchInput = document.getElementById('doctorSearch');
        const clearButton = document.getElementById('clearSearch');
        let searchTimeout;

        searchInput.addEventListener('input', (e) => {
          const searchTerm = e.target.value.trim();
          currentSearchTerm = searchTerm;
          
          // Show/hide clear button
          if (searchTerm) {
            clearButton.classList.remove('hidden');
          } else {
            clearButton.classList.add('hidden');
          }
          
          // Debounce search to avoid too many API calls
          clearTimeout(searchTimeout);
          searchTimeout = setTimeout(() => {
            fetchDoctors(searchTerm);
          }, 300);
        });

        clearButton.addEventListener('click', () => {
          searchInput.value = '';
          currentSearchTerm = '';
          clearButton.classList.add('hidden');
          fetchDoctors('');
        });
      }

      document.addEventListener("DOMContentLoaded", () => {
        doctorContainer = document.getElementById("doctorContainer");
        const filterButtons = document.querySelectorAll(".filter-btn");

        // Setup search functionality
        setupSearchFunctionality();

        // Fetch and render doctors
        fetchDoctors();
      });

      // Attach filter listeners to buttons
      function attachFilterListeners() {
        const filterButtons = document.querySelectorAll(".filter-btn");
        
        filterButtons.forEach((btn) => {
          btn.addEventListener("click", () => {
            const filter = btn.dataset.filter;
            currentFilter = filter;

            // Update visual state
            filterButtons.forEach((b) =>
              b.querySelector(".underline").classList.add("hidden")
            );
            btn.querySelector(".underline").classList.remove("hidden");

            // Apply the filter to current doctors
            applyCurrentFilter();
          });
        });
      }
    </script>


    <style>
      /* Simple fade-in animation */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-fadeIn {
        animation: fadeIn 1.5s ease forwards;
      }
    </style>

    <!-- Placeholder for spinner -->
    <div id="spinner"></div>

    <script>
      // Load spinner markup
  fetch('https://spchospital.com/Frontend/pages/spinner.html')
        .then(res => res.text())
        .then(data => {
          document.getElementById("spinner").innerHTML = data;

          // Now spinner is in DOM -> attach JS logic
          const spinner = document.getElementById("spinner-overlay");

          function showSpinner() {
            spinner.classList.remove("hidden");
          }
          function hideSpinner() {
            spinner.classList.add("hidden");
          }

          // Show on links
          document.querySelectorAll("a").forEach(link => {
            link.addEventListener("click", () => {
              if (link.getAttribute("href") !== "#" && !link.getAttribute("href")?.startsWith("javascript")) {
                showSpinner();
                setTimeout(hideSpinner, 10000);
              }
            });
          });

          // Show on .show-spinner buttons
          document.querySelectorAll("button.show-spinner").forEach(btn => {
            btn.addEventListener("click", () => {
              showSpinner();
              setTimeout(hideSpinner, 10000);
            });
          });

          // Show on form submit
          document.querySelectorAll("form").forEach(form => {
            form.addEventListener("submit", () => {
              showSpinner();
              setTimeout(hideSpinner, 10000);
            });
          });

          // Optional: hide spinner after page load (auto)
          setTimeout(() => hideSpinner(), 10000);
        });
    </script>

    <!-- Single footer element -->
    <div id="footer"></div>
  </body>
</html>
