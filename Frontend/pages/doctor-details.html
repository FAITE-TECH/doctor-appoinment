<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doctor Details</title>
  <link rel="icon" type="image/png" href="https://spchospital.com/Frontend/public/assets/logo.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    
    <!-- Safari and Cross-browser compatibility -->
  <script src="https://spchospital.com/Frontend/public/js/browser-compat.js"></script>
  <script src="https://spchospital.com/Frontend/public/js/cross-platform-utils.js"></script>
  </head>
  <body class="bg-gray-50" style="min-height: 100vh; display: flex; flex-direction: column;">


    <!--  Import Header -->

    <div id="header"></div>
    <script>
  fetch('https://spchospital.com/Frontend/pages/shared-nav.html?v=' + Date.now())
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("header").innerHTML = data;
          // Initialize navigation after it's loaded
          if (window.initNavigationAfterLoad) {
            window.initNavigationAfterLoad();
          }
        });
    </script>

    <main style="flex: 1 0 auto;">
      <div class="container mx-auto p-6">
        <div
          id="doctorDetail"
          class="flex flex-col mt-6 justify-center align-center"
        ></div>
      </div>

      <!-- Doctor Schedule Calendar -->
    <div class="max-w-6xl mx-auto p-6">
      <div class="bg-white rounded-lg shadow-lg p-6">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-2xl font-bold text-gray-800">Doctor Schedule</h2>
          <div class="flex items-center gap-4">
            <div class="text-sm text-gray-600">
              <i class="fas fa-info-circle mr-1"></i>
              Schedule rotates automatically with date changes
            </div>
            <div class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-medium">
              <i class="fas fa-sync-alt mr-1"></i>
              Auto-rotating
            </div>
          </div>
        </div>

        <!-- Calendar Header -->
        <div class="mb-4">
          <h3 id="calendarMonthYear" class="text-xl font-semibold text-gray-700 text-center"></h3>
        </div>

        <!-- Calendar Grid -->
        <div class="grid grid-cols-7 gap-2 mb-4">
          <!-- Day Headers -->
          <div class="text-center font-semibold text-gray-600 py-3 bg-gray-100 rounded-lg">Sun</div>
          <div class="text-center font-semibold text-gray-600 py-3 bg-gray-100 rounded-lg">Mon</div>
          <div class="text-center font-semibold text-gray-600 py-3 bg-gray-100 rounded-lg">Tue</div>
          <div class="text-center font-semibold text-gray-600 py-3 bg-gray-100 rounded-lg">Wed</div>
          <div class="text-center font-semibold text-gray-600 py-3 bg-gray-100 rounded-lg">Thu</div>
          <div class="text-center font-semibold text-gray-600 py-3 bg-gray-100 rounded-lg">Fri</div>
          <div class="text-center font-semibold text-gray-600 py-3 bg-gray-100 rounded-lg">Sat</div>
        </div>

        <!-- Calendar Days Container -->
        <div id="calendarDays" class="grid grid-cols-7 gap-2">
          <!-- Loading state -->
          <div id="calendarLoading" class="col-span-7 text-center py-8">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div>
            <p class="mt-2 text-gray-600">Loading schedule...</p>
          </div>
        </div>

        <!-- Time Slots Modal -->
        <div id="timeSlotsModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50">
          <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[80vh] overflow-y-auto">
              <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                <h3 id="modalTitle" class="text-lg font-semibold text-gray-800">Available Time Slots</h3>
                <button id="closeModal" class="text-gray-400 hover:text-gray-600 text-xl">
                  <i class="fas fa-times"></i>
                </button>
              </div>
              <div class="p-6">
                <div id="timeSlots" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                  <!-- Time slots will be populated here -->
                </div>
                <div id="noSlotsMessage" class="text-center text-gray-500 py-8 hidden">
                  <i class="fas fa-calendar-times text-4xl mb-2"></i>
                  <p>No available time slots for this day</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
 <!-- Filter -->

    <section id="doctors">
      <div class="text-center my-10 container mx-auto max-w-6xl px-4">
        <!-- Filter Buttons -->
        <div
          id="doctorFilter"
          class="flex flex-wrap justify-center gap-4 mb-10"
        >
          <button
            class="filter-btn relative px-4 py-2 text-black transition"
            data-filter="All"
          >
            All
            <div
              class="underline w-full h-0.5 bg-red-400 absolute bottom-0 left-0"
            ></div>
          </button>
          <!-- Dynamic department buttons will be added here by JavaScript -->
        </div>

        <!-- Cards Grid -->
        <div
          id="doctorContainer"
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 transition-all duration-500"
        >
          <!-- Cards will be injected by JS -->
        </div>
      </div>
    </section>

    <script>
      // Global variables
      let doctors = [];
      let availableDepartments = new Set();
      let doctorContainer;

      // Render doctors function (global scope)
      function renderDoctors(filteredDoctors) {
        // Clear container
        doctorContainer.innerHTML = "";

        if (filteredDoctors.length === 0) {
          doctorContainer.innerHTML = '<p class="text-center text-gray-500 col-span-full">No doctors found for the selected filter.</p>';
          return;
        }

        filteredDoctors.forEach((doctor) => {
          const doctorCard = document.createElement("div");
          doctorCard.className =
            "bg-white border border-gray-200 overflow-hidden shadow-sm hover:shadow-lg transition flex flex-col transform opacity-0 animate-fadeIn";

          // Use the image from database or fallback to default
          // Use stored image_path directly and let buildUploadUrl normalize it.
          let doctorImage = doctor.image_path ? (window.buildUploadUrl ? window.buildUploadUrl(doctor.image_path) : (doctor.image_path.indexOf('uploads/') !== -1 ? ('https://spchospital.com/' + doctor.image_path.replace(/^\//, '')) : 'https://spchospital.com/uploads/doctors/' + doctor.image_path)) : "https://spchospital.com/Frontend/public/assets/doctor1.jpg";
          // If image_path is absolute, use it as is, otherwise make it relative
          if (doctor.image_path && !doctor.image_path.startsWith('http') && !doctor.image_path.startsWith('/')) {
            doctorImage = "../" + doctor.image_path;
          } else if (doctor.image_path && doctor.image_path.startsWith('/')) {
            doctorImage = doctor.image_path;
          }
          const doctorSpecialization = doctor.specialization || doctor.department_name || "General";
          const doctorDescription = doctor.description || "Experienced medical professional dedicated to providing quality healthcare services.";

          doctorCard.innerHTML = `
            <!-- Doctor Image Wrapper -->
            <a href="doctor-details.html?id=${doctor.id}">
              <div class="relative h-56 w-full overflow-hidden group">
                <img src="${doctorImage}" alt="${doctor.name}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
              </div>
            </a>

            <!-- Doctor Content -->
            <div class="p-6 flex flex-col justify-between flex-grow">
              <h3 class="text-xl font-sans-serif text-blue-800 mb-2 text-start">${doctor.name}</h3>
              <p class="bg-green-100 text-blue-500 text-xs font-[Roboto] px-3 py-1 rounded-full uppercase w-fit mb-3">${doctorSpecialization}</p>
              <p class="text-gray-600 text-md mb-4 clamp-4 text-start leading-relaxed">${doctorDescription}</p>
            </div>
          `;

          doctorContainer.appendChild(doctorCard);

          // Animate card fade in
          requestAnimationFrame(() => {
            doctorCard.classList.remove("opacity-0");
          });
        });
      }

      // Update filter buttons based on available departments
      function updateFilterButtons() {
        const filterContainer = document.getElementById("doctorFilter");
        
        // Keep the "All" button and remove others
        const allButton = filterContainer.querySelector('[data-filter="All"]');
        filterContainer.innerHTML = '';
        filterContainer.appendChild(allButton);
        
        // Add dynamic department buttons
        availableDepartments.forEach(department => {
          const button = document.createElement('button');
          button.className = 'filter-btn relative px-4 py-2 text-black transition';
          button.setAttribute('data-filter', department);
          button.innerHTML = `
            ${department}
            <div class="underline hidden w-full h-0.5 bg-red-400 absolute bottom-0 left-0"></div>
          `;
          filterContainer.appendChild(button);
        });
        
        // Re-attach event listeners to all filter buttons
        attachFilterListeners();
      }

      document.addEventListener("DOMContentLoaded", () => {
        doctorContainer = document.getElementById("doctorContainer");

        // Fetch and render doctors
        fetchDoctors();
      });

      // Attach filter listeners to buttons
      function attachFilterListeners() {
        const filterButtons = document.querySelectorAll(".filter-btn");
        
        filterButtons.forEach((btn) => {
          btn.addEventListener("click", () => {
            const filter = btn.dataset.filter;

            // Update visual state
            filterButtons.forEach((b) =>
              b.querySelector(".underline").classList.add("hidden")
            );
            btn.querySelector(".underline").classList.remove("hidden");

            // Filter doctors
            if (filter === "All") {
              renderDoctors(doctors);
            } else {
              const filteredDoctors = doctors.filter((d) => 
                d.department_name && d.department_name === filter
              );
              renderDoctors(filteredDoctors);
            }
          });
        });
      }
    </script>


    <!-- Doctor Data -->
    <script>
      // Global variable to store current doctor
      let currentDoctor = null;

      // Fetch doctors from API
      async function fetchDoctors() {
        try {
          const response = await fetch(
            window.buildApiUrl
              ? window.buildApiUrl('doctors.php?action=doctors')
              : (window.APP_API_FOLDER ? window.APP_API_FOLDER + 'doctors.php?action=doctors' : 'https://spchospital.com/Backend/api/doctors.php?action=doctors')
          );
          const data = await response.json();
          
          if (data.status === 'success') {
            doctors = data.data;
            console.log('Doctors loaded:', doctors.length, 'doctors');
            console.log('First doctor:', doctors[0]);
            
            // Extract unique departments from doctors data
            availableDepartments.clear();
            doctors.forEach(doctor => {
              if (doctor.department_name) {
                availableDepartments.add(doctor.department_name);
              }
            });
            
            // Update filter buttons dynamically
            updateFilterButtons();
            
            // Load doctor details and render all doctors
            loadDoctorDetails();
            renderDoctors(doctors);
          } else {
            console.error('Failed to fetch doctors:', data.message);
            document.getElementById("doctorDetail").innerHTML = '<p class="text-center text-red-500">Failed to load doctors data: ' + (data.message || 'Unknown error') + '</p>';
          }
        } catch (error) {
          console.error('Error fetching doctors:', error);
          document.getElementById("doctorDetail").innerHTML = '<p class="text-center text-gray-500">Unable to load doctor details. Please try again later.</p>';
        }
      }

      function loadDoctorDetails() {
        // Get doctor id from URL
        const params = new URLSearchParams(window.location.search);
        const doctorId = parseInt(params.get("id"));

        if (!doctorId || isNaN(doctorId)) {
          document.getElementById("doctorDetail").innerHTML = '<p class="text-center text-red-500 font-semibold">Invalid doctor ID. Please select a doctor from the doctors page.</p>';
          return;
        }

        // Check if doctors data is loaded
        if (!doctors || doctors.length === 0) {
          document.getElementById("doctorDetail").innerHTML = '<p class="text-center text-yellow-500">Loading doctor data...</p>';
          return;
        }

        // Find doctor by id (convert to string for comparison since API returns string IDs)
        console.log('Looking for doctor ID:', doctorId, 'in', doctors.length, 'doctors');
        currentDoctor = doctors.find((d) => parseInt(d.id) === doctorId);
        console.log('Found doctor:', currentDoctor ? currentDoctor.name : 'NOT FOUND');

        if (currentDoctor) {
          // Use the image from database or fallback to default
          let doctorImage = currentDoctor.image_path ? (window.buildUploadUrl ? window.buildUploadUrl(currentDoctor.image_path) : (currentDoctor.image_path.indexOf('uploads/') !== -1 ? ('https://spchospital.com/' + currentDoctor.image_path.replace(/^\//, '')) : 'https://spchospital.com/uploads/doctors/' + currentDoctor.image_path)) : "https://spchospital.com/Frontend/public/assets/doctor1.jpg";
          // If image_path is absolute, use it as is, otherwise make it relative
          if (currentDoctor.image_path && !currentDoctor.image_path.startsWith('http') && !currentDoctor.image_path.startsWith('/')) {
            doctorImage = "../" + currentDoctor.image_path;
          } else if (currentDoctor.image_path && currentDoctor.image_path.startsWith('/')) {
            doctorImage = currentDoctor.image_path;
          }
          const doctorSpecialization = currentDoctor.specialization || currentDoctor.department_name || "General";
          const doctorDescription = currentDoctor.description || "Experienced medical professional dedicated to providing quality healthcare services.";

          document.getElementById("doctorDetail").innerHTML = `
        <div class="flex text-gray-600 my-10 leading-relaxed space-x-1 text-sm  justify-center max-w-6xl ">
            <a href="home.html#doctors" class="text-blue-600 hover:underline">Home</a>
            <span>&gt;</span>
            <a href="doctors.html" class="text-blue-600 hover:underline">Doctor</a>
            <span>&gt;</span>
            <span class="text-gray-800 font-medium">${currentDoctor.name}</span>
        </div>



        <div class="bg-white  p-6 flex flex-col justify-between max-w-6xl mx-auto md:flex-row gap-6">
          <img src="${doctorImage}" alt="${currentDoctor.name}" class="w-60 h-60 object-cover rounded-lg shadow-md">
          
          <div class="md:w-1/3">
            <h2 class="text-3xl font-bold text-gray-800 mb-2">${currentDoctor.name}</h2>
            <p class=" text-gray-600 text-sm px-3 py-1 font-italic w-fit mb-4">${doctorSpecialization}</p>
            <p class="text-gray-600 leading-relaxed mb-4">${doctorDescription}</p>
            <p class="text-gray-600 mb-1"><i class="fa-solid fa-envelope"></i>  <a href="mailto:${currentDoctor.email}" class="text-gray-500">${currentDoctor.email}</a></p>
            <p class="text-gray-600 mb-1"><i class="fa-solid fa-phone"></i> <a href="tel:${currentDoctor.phone}" class="text-gray-500">${currentDoctor.phone}</a></p>

            <div class="flex gap-2 mt-4">
              <button onclick="redirectToAppointment()" class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600">Book Appointment</button>
            </div>
          </div>

          <div class="mt-4 md:w-1/3 ">
            <h3 class="text-xl font-bold text-gray-800 mb-2  border-t border-gray-200">Other Doctors in ${doctorSpecialization}</h3>
           
           <ul id="other-doctors" class="divide-y divide-gray-200 border border-gray-200 rounded-lg"></ul>

          </div>
        </div>
      `;
          // Load other doctors in the same specialization
          loadOtherDoctors(doctorSpecialization);
          
          // Load schedule calendar
          loadScheduleCalendar();
        } else {
          document.getElementById("doctorDetail").innerHTML = '<p class="text-red-500 font-semibold">Doctor not found. The doctor with ID ' + doctorId + ' does not exist.</p>';
        }
      }

      function loadOtherDoctors(specialization) {
        const otherDoctorsContainer = document.querySelector("#other-doctors");
        if (!otherDoctorsContainer) return;

        const otherDoctors = doctors.filter((d) => 
          ((d.specialization && d.specialization.toLowerCase().includes(specialization.toLowerCase())) ||
           (d.department_name && d.department_name.toLowerCase().includes(specialization.toLowerCase()))) &&
          parseInt(d.id) !== parseInt(currentDoctor.id)
        );

        otherDoctorsContainer.innerHTML = otherDoctors
          .map((d) => `
            <li class="flex items-center gap-3 p-3 hover:bg-gray-50 transition">
              <div>
                <h4 class="text-gray-800 font-semibold text-sm">${d.name}</h4>
              </div>
            </li>
          `)
          .join("");
      }

      // Calendar functionality
      let currentStartDate = new Date();
      let scheduleData = {};
      let autoRotateInterval;
      let lastCheckedDate = new Date().toDateString();

      async function loadScheduleCalendar() {
        if (!currentDoctor) return;
        
        // Load initial calendar for current month
        await updateCalendar();
        
        // Start auto-rotation based on date changes
        startAutoRotate();
      }

      function startAutoRotate() {
        if (autoRotateInterval) {
          clearInterval(autoRotateInterval);
        }
        
        // Check for date changes every minute
        autoRotateInterval = setInterval(() => {
          const currentDate = new Date().toDateString();
          
          // If date has changed, update the calendar to show current month
          if (currentDate !== lastCheckedDate) {
            lastCheckedDate = currentDate;
            updateCalendar();
          }
        }, 60000); // Check every minute
        
        // Also check immediately on page focus (in case user left tab open)
        window.addEventListener('focus', () => {
          const currentDate = new Date().toDateString();
          if (currentDate !== lastCheckedDate) {
            lastCheckedDate = currentDate;
            updateCalendar();
          }
        });
      }

      async function updateCalendar() {
        try {
          // Update month/year display to show current two weeks
          const today = new Date();
          const startDate = new Date(today);
          startDate.setDate(startDate.getDate() - startDate.getDay());
          const endDate = new Date(startDate);
          endDate.setDate(endDate.getDate() + 13);
          
          const monthYearText = `${startDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} - ${endDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
          
          document.getElementById('calendarMonthYear').textContent = monthYearText;

          // Load schedule data for the two-week period
          await loadScheduleDataForTwoWeeks(startDate, endDate);

          // Render calendar for two weeks
          renderCalendarDays();
          
        } catch (error) {
          console.error('Error updating calendar:', error);
        }
      }

      async function loadScheduleDataForTwoWeeks(startDate, endDate) {
        try {
          // Get the month range for the two weeks
          const startMonth = startDate.toISOString().slice(0, 7);
          const endMonth = endDate.toISOString().slice(0, 7);
          
          // Load data for both months if they're different
          const monthsToLoad = [...new Set([startMonth, endMonth])];
          scheduleData = {};
          
          for (const month of monthsToLoad) {
            const response = await fetch(
              window.buildApiUrl
                ? window.buildApiUrl(`schedules.php?action=get_schedules&doctor_id=${currentDoctor.id}&month=${month}`)
                : (window.APP_API_FOLDER ? window.APP_API_FOLDER + `schedules.php?action=get_schedules&doctor_id=${currentDoctor.id}&month=${month}` : 'https://spchospital.com/Backend/api/schedules.php?action=get_schedules&doctor_id=${currentDoctor.id}&month=${month}')
            );
            const data = await response.json();
            
            if (data.status === 'success' && data.data) {
              data.data.forEach(day => {
                const dayDate = new Date(day.date);
                // Only include dates within our two-week range
                if (dayDate >= startDate && dayDate <= endDate) {
                  if (day.slots && Array.isArray(day.slots)) {
                    scheduleData[day.date] = day.slots.filter(slot => slot.is_available);
                  } else {
                    scheduleData[day.date] = [];
                  }
                }
              });
            }
          }
        } catch (error) {
          console.error('Error loading schedule data:', error);
          scheduleData = {};
        }
      }

      function renderCalendarDays() {
        const calendarDays = document.getElementById('calendarDays');
        if (!calendarDays) return;
        
        // Hide loading state
        const loadingElement = document.getElementById('calendarLoading');
        if (loadingElement) {
          loadingElement.style.display = 'none';
        }
        
        calendarDays.innerHTML = '';

        // Get current date and set to start of current week
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        
        // Start from Sunday of current week
        const startDate = new Date(today);
        startDate.setDate(startDate.getDate() - startDate.getDay());
        
        // End at Saturday of next week (14 days total)
        const endDate = new Date(startDate);
        endDate.setDate(endDate.getDate() + 13);

        // Create grid for 14 days (2 weeks)
        const currentDate = new Date(startDate);
        for (let i = 0; i < 14; i++) {
          const dateStr = currentDate.toISOString().split('T')[0];
          
          const availableSlots = scheduleData[dateStr] || [];
          const isAvailable = availableSlots.length > 0;
          const isPast = currentDate < today;
          const isToday = currentDate.toDateString() === today.toDateString();

          const dayElement = document.createElement('div');
          
          // Styling based on availability and date
          dayElement.className = `calendar-day border rounded-lg p-3 min-h-[80px] flex flex-col justify-center items-center transition-all duration-200 ${
            isPast ? 'bg-gray-100 text-gray-400' : 
            isToday ? 'bg-blue-50 border-blue-300 text-blue-700' :
            isAvailable ? 'bg-green-50 border-green-300 text-green-700 hover:bg-green-100 cursor-pointer' : 
            'bg-gray-50 border-gray-200 text-gray-500'
          }`;
          
          dayElement.innerHTML = `
            <div class="text-center">
              <div class="text-sm font-medium">${currentDate.toLocaleDateString('en-US', { weekday: 'short' })}</div>
              <div class="text-lg font-bold">${currentDate.getDate()}</div>
              ${isAvailable ? `<div class="text-xs text-green-600 font-medium">${availableSlots.length} slots</div>` : ''}
            </div>
          `;

          if (isAvailable && !isPast) {
            dayElement.addEventListener('click', () => showTimeSlotsModal(dateStr, availableSlots, currentDate));
          }

          calendarDays.appendChild(dayElement);
          currentDate.setDate(currentDate.getDate() + 1);
        }
      }

      function showTimeSlotsModal(date, slots, dateObj) {
        const modal = document.getElementById('timeSlotsModal');
        const modalTitle = document.getElementById('modalTitle');
        const timeSlots = document.getElementById('timeSlots');
        const noSlotsMessage = document.getElementById('noSlotsMessage');
        
        if (!modal || !modalTitle || !timeSlots || !noSlotsMessage) return;
        
        const dateStr = dateObj.toLocaleDateString('en-US', { 
          weekday: 'long',
          month: 'long',
          day: 'numeric',
          year: 'numeric'
        });

        modalTitle.textContent = `Available Time Slots - ${dateStr}`;

        if (slots && slots.length > 0) {
          timeSlots.innerHTML = slots.map(slot => `
            <div class="border border-green-200 rounded-lg p-4 bg-white hover:bg-green-50 cursor-pointer transition-all duration-200 shadow-sm">
              <div class="font-semibold text-green-800 text-lg">${convertTo12Hour(slot.start_time)} - ${convertTo12Hour(slot.end_time)}</div>
              <div class="text-sm text-green-600 mt-1">
                <i class="fas fa-check-circle mr-1"></i>
                Available time
              </div>
            </div>
          `).join('');
          noSlotsMessage.classList.add('hidden');
          timeSlots.classList.remove('hidden');
        } else {
          timeSlots.classList.add('hidden');
          noSlotsMessage.classList.remove('hidden');
        }
        
        modal.classList.remove('hidden');
      }

      // Modal event listeners
      document.addEventListener('DOMContentLoaded', function() {
        const modal = document.getElementById('timeSlotsModal');
        const closeModal = document.getElementById('closeModal');
        
        if (closeModal) {
          closeModal.addEventListener('click', () => {
            modal.classList.add('hidden');
          });
        }
        
        if (modal) {
          modal.addEventListener('click', (e) => {
            if (e.target === modal) {
              modal.classList.add('hidden');
            }
          });
        }
      });


      // Convert 24-hour time to 12-hour format
      function convertTo12Hour(time24) {
        const [hours, minutes] = time24.split(':');
        const hour = parseInt(hours);
        const ampm = hour >= 12 ? 'PM' : 'AM';
        const hour12 = hour % 12 || 12;
        return `${hour12}:${minutes} ${ampm}`;
      }

      // Initialize when page loads
      document.addEventListener('DOMContentLoaded', function() {
        fetchDoctors();
      });
    </script>


    <!-- Filter Underline -->

    <script>
      const filterButtons = document.querySelectorAll(".filter-btn");

      filterButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          // Hide underline for all buttons
          filterButtons.forEach((b) =>
            b.querySelector(".underline").classList.add("hidden")
          );

          // Show underline for clicked button

    <script>
      function redirectToAppointment() {
        if (currentDoctor) {
          const params = new URLSearchParams();
          params.set('doctor_id', currentDoctor.id);
          params.set('doctor_name', currentDoctor.name);
          if (currentDoctor.department_name) {
            params.set('department', currentDoctor.department_name);
          }
          // Force a URL change even if the base URL is the same
          const targetUrl = `./home.html#appointment-form?${params.toString()}`;
          if (window.location.href.includes('home.html')) {
            // If we're already on the home page, update the hash and trigger the change
            window.location.hash = `#appointment-form?${params.toString()}`;
          } else {
            // If we're on a different page, navigate to home
            window.location.href = targetUrl;
          }
        }
      }
    </script>

      function loadFooter() {

          return;

  fetch('https://spchospital.com/Frontend/pages/footer.html?v=' + Date.now(), {

          headers: {
            'Accept': 'text/html',
            'Cache-Control': 'no-cache, no-store, must-revalidate'
          }
        })
        .then(function(res) {
          if (!res.ok) {
            throw new Error('HTTP error! status: ' + res.status);
          }
          return res.text();
        })
        .then(function(data) {
          footerEl.innerHTML = data;
          // Add proper styling to footer without affecting body layout
          var footer = footerEl.querySelector('footer');
          if (footer) {
            footer.style.marginTop = 'auto';
            footer.style.flexShrink = '0';
