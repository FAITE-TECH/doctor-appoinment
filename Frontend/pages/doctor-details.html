<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doctor Details</title>
      <link rel="icon" type="image/png" href="../public/assets/logo.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body class="bg-gray-50">


    <!--  Import Header -->

    <div id="header"></div>
    <script>
      fetch("shared-nav.html")
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("header").innerHTML = data;
          // Initialize navigation after it's loaded
          if (window.initNavigationAfterLoad) {
            window.initNavigationAfterLoad();
          }
        });
    </script>

    <div class="container mx-auto p-6">
      <div
        id="doctorDetail"
        class="flex flex-col mt-6 justify-center align-center"
      ></div>
    </div>

    <!-- Schedule Table -->
    <div class="overflow-x-auto p-6 max-w-6xl mx-auto">
      <table
        id="scheduleTable"
        class="min-w-full border border-gray-300 text-sm"
      >
        <thead>
          <tr class="bg-gray-700 text-white h-20 text-center">
            <th class="border px-2 py-1">Doctor Name</th>
            <th class="border px-2 py-1">Sunday</th>
            <th class="border px-2 py-1">Monday</th>
            <th class="border px-2 py-1">Tuesday</th>
            <th class="border px-2 py-1">Wednesday</th>
            <th class="border px-2 py-1">Thursday</th>
            <th class="border px-2 py-1">Friday</th>
            <th class="border px-2 py-1">Saturday</th>
          </tr>
        </thead>
        <tbody class="p-5"></tbody>
      </table>
    </div>
 <!-- Filter -->

    <section id="doctors">
      <div class="text-center my-10 container mx-auto max-w-6xl px-4">
        <!-- Filter Buttons -->
        <div
          id="doctorFilter"
          class="flex flex-wrap justify-center gap-4 mb-10"
        >
          <button
            class="filter-btn relative px-4 py-2 text-black transition"
            data-filter="All"
          >
            All
            <div
              class="underline w-full h-0.5 bg-red-400 absolute bottom-0 left-0"
            ></div>
          </button>
          <!-- Dynamic department buttons will be added here by JavaScript -->
        </div>

        <!-- Cards Grid -->
        <div
          id="doctorContainer"
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 transition-all duration-500"
        >
          <!-- Cards will be injected by JS -->
        </div>
      </div>
    </section>

      <!-- Detailed Schedule Modal -->
    <div id="scheduleModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50">
      <div class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-5xl w-full max-h-[90vh] overflow-y-auto">
          <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
            <h3 class="text-lg font-semibold text-gray-800">Schedule - ${currentDoctor ? currentDoctor.name : 'Doctor'}</h3>
            <button onclick="closeScheduleModal()" class="text-gray-400 hover:text-gray-600">
              <i class="fas fa-times text-xl"></i>
            </button>
          </div>
          <div class="p-6">
            <!-- Calendar Navigation -->
            <div class="flex justify-between items-center mb-6">
              <div>
                <h4 class="text-lg font-medium text-gray-800" id="calendarMonthYear"></h4>
              </div>
              <div class="flex gap-4 items-center">
                <button id="prevTwoWeeks" class="bg-gray-100 p-2 rounded-lg hover:bg-gray-200 transition">
                  <i class="fas fa-chevron-left"></i>
                </button>
                <button id="currentWeeks" class="bg-blue-100 px-3 py-1 rounded-lg hover:bg-blue-200 transition text-sm">
                  Current Weeks
                </button>
                <button id="nextTwoWeeks" class="bg-gray-100 p-2 rounded-lg hover:bg-gray-200 transition">
                  <i class="fas fa-chevron-right"></i>
                </button>
              </div>
            </div>

            <!-- Calendar Grid -->
            <div class="grid grid-cols-7 gap-2">
              <!-- Calendar Days Header -->
              <div class="text-center font-medium text-gray-500 py-2">Sun</div>
              <div class="text-center font-medium text-gray-500 py-2">Mon</div>
              <div class="text-center font-medium text-gray-500 py-2">Tue</div>
              <div class="text-center font-medium text-gray-500 py-2">Wed</div>
              <div class="text-center font-medium text-gray-500 py-2">Thu</div>
              <div class="text-center font-medium text-gray-500 py-2">Fri</div>
              <div class="text-center font-medium text-gray-500 py-2">Sat</div>
            </div>

            <!-- Calendar Weeks Container -->
            <div id="calendarWeeks" class="grid grid-cols-7 gap-2">
              <!-- Calendar days will be populated here -->
            </div>

            <!-- Selected Day Schedule -->
            <div id="selectedDaySchedule" class="mt-6 border-t pt-6">
              <h4 class="text-lg font-medium text-gray-800 mb-4">Available Time Slots</h4>
              <div id="timeSlots" class="grid grid-cols-3 gap-3">
                <!-- Time slots will be populated here -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>    <script>
      // Global variables
      let doctors = [];
      let availableDepartments = new Set();
      let doctorContainer;

      // Render doctors function (global scope)
      function renderDoctors(filteredDoctors) {
        // Clear container
        doctorContainer.innerHTML = "";

        if (filteredDoctors.length === 0) {
          doctorContainer.innerHTML = '<p class="text-center text-gray-500 col-span-full">No doctors found for the selected filter.</p>';
          return;
        }

        filteredDoctors.forEach((doctor) => {
          const doctorCard = document.createElement("div");
          doctorCard.className =
            "bg-white border border-gray-200 overflow-hidden shadow-sm hover:shadow-lg transition flex flex-col transform opacity-0 animate-fadeIn";

          // Use the image from database or fallback to default
          let doctorImage = doctor.image_path || "../public/assets/doctor1.jpg";
          // If image_path is absolute, use it as is, otherwise make it relative
          if (doctor.image_path && !doctor.image_path.startsWith('http') && !doctor.image_path.startsWith('/')) {
            doctorImage = "../" + doctor.image_path;
          } else if (doctor.image_path && doctor.image_path.startsWith('/')) {
            doctorImage = doctor.image_path;
          }
          const doctorSpecialization = doctor.specialization || doctor.department_name || "General";
          const doctorDescription = doctor.description || "Experienced medical professional dedicated to providing quality healthcare services.";

          doctorCard.innerHTML = `
            <!-- Doctor Image Wrapper -->
            <a href="doctor-details.html?id=${doctor.id}">
              <div class="relative h-56 w-full overflow-hidden group">
                <img src="${doctorImage}" alt="${doctor.name}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
              </div>
            </a>

            <!-- Doctor Content -->
            <div class="p-6 flex flex-col justify-between flex-grow">
              <h3 class="text-xl font-sans-serif text-blue-800 mb-2 text-start">${doctor.name}</h3>
              <p class="bg-green-100 text-blue-500 text-xs font-[Roboto] px-3 py-1 rounded-full uppercase w-fit mb-3">${doctorSpecialization}</p>
              <p class="text-gray-600 text-md mb-4 clamp-4 text-start leading-relaxed">${doctorDescription}</p>
            </div>
          `;

          doctorContainer.appendChild(doctorCard);

          // Animate card fade in
          requestAnimationFrame(() => {
            doctorCard.classList.remove("opacity-0");
          });
        });
      }

      // Update filter buttons based on available departments
      function updateFilterButtons() {
        const filterContainer = document.getElementById("doctorFilter");
        
        // Keep the "All" button and remove others
        const allButton = filterContainer.querySelector('[data-filter="All"]');
        filterContainer.innerHTML = '';
        filterContainer.appendChild(allButton);
        
        // Add dynamic department buttons
        availableDepartments.forEach(department => {
          const button = document.createElement('button');
          button.className = 'filter-btn relative px-4 py-2 text-black transition';
          button.setAttribute('data-filter', department);
          button.innerHTML = `
            ${department}
            <div class="underline hidden w-full h-0.5 bg-red-400 absolute bottom-0 left-0"></div>
          `;
          filterContainer.appendChild(button);
        });
        
        // Re-attach event listeners to all filter buttons
        attachFilterListeners();
      }

      document.addEventListener("DOMContentLoaded", () => {
        doctorContainer = document.getElementById("doctorContainer");

        // Fetch and render doctors
        fetchDoctors();
      });

      // Attach filter listeners to buttons
      function attachFilterListeners() {
        const filterButtons = document.querySelectorAll(".filter-btn");
        
        filterButtons.forEach((btn) => {
          btn.addEventListener("click", () => {
            const filter = btn.dataset.filter;

            // Update visual state
            filterButtons.forEach((b) =>
              b.querySelector(".underline").classList.add("hidden")
            );
            btn.querySelector(".underline").classList.remove("hidden");

            // Filter doctors
            if (filter === "All") {
              renderDoctors(doctors);
            } else {
              const filteredDoctors = doctors.filter((d) => 
                d.department_name && d.department_name === filter
              );
              renderDoctors(filteredDoctors);
            }
          });
        });
      }
    </script>


    <!-- Doctor Data -->
    <script>
      // Global variable to store current doctor
      let currentDoctor = null;

      // Fetch doctors from API
      async function fetchDoctors() {
        try {
          const response = await fetch('../../Backend/api/doctors.php?action=doctors');
          const data = await response.json();
          
          if (data.status === 'success') {
            doctors = data.data;
            console.log('Doctors loaded:', doctors.length, 'doctors');
            console.log('First doctor:', doctors[0]);
            
            // Extract unique departments from doctors data
            availableDepartments.clear();
            doctors.forEach(doctor => {
              if (doctor.department_name) {
                availableDepartments.add(doctor.department_name);
              }
            });
            
            // Update filter buttons dynamically
            updateFilterButtons();
            
            // Load doctor details and render all doctors
            loadDoctorDetails();
            renderDoctors(doctors);
          } else {
            console.error('Failed to fetch doctors:', data.message);
            document.getElementById("doctorDetail").innerHTML = '<p class="text-center text-red-500">Failed to load doctors data: ' + (data.message || 'Unknown error') + '</p>';
          }
        } catch (error) {
          console.error('Error fetching doctors:', error);
          document.getElementById("doctorDetail").innerHTML = '<p class="text-center text-gray-500">Unable to load doctor details. Please try again later.</p>';
        }
      }

      function loadDoctorDetails() {
        // Get doctor id from URL
        const params = new URLSearchParams(window.location.search);
        const doctorId = parseInt(params.get("id"));

        if (!doctorId || isNaN(doctorId)) {
          document.getElementById("doctorDetail").innerHTML = '<p class="text-center text-red-500 font-semibold">Invalid doctor ID. Please select a doctor from the doctors page.</p>';
          return;
        }

        // Check if doctors data is loaded
        if (!doctors || doctors.length === 0) {
          document.getElementById("doctorDetail").innerHTML = '<p class="text-center text-yellow-500">Loading doctor data...</p>';
          return;
        }

        // Find doctor by id (convert to string for comparison since API returns string IDs)
        console.log('Looking for doctor ID:', doctorId, 'in', doctors.length, 'doctors');
        currentDoctor = doctors.find((d) => parseInt(d.id) === doctorId);
        console.log('Found doctor:', currentDoctor ? currentDoctor.name : 'NOT FOUND');

        if (currentDoctor) {
          // Use the image from database or fallback to default
          let doctorImage = currentDoctor.image_path || "../public/assets/doctor1.jpg";
          // If image_path is absolute, use it as is, otherwise make it relative
          if (currentDoctor.image_path && !currentDoctor.image_path.startsWith('http') && !currentDoctor.image_path.startsWith('/')) {
            doctorImage = "../" + currentDoctor.image_path;
          } else if (currentDoctor.image_path && currentDoctor.image_path.startsWith('/')) {
            doctorImage = currentDoctor.image_path;
          }
          const doctorSpecialization = currentDoctor.specialization || currentDoctor.department_name || "General";
          const doctorDescription = currentDoctor.description || "Experienced medical professional dedicated to providing quality healthcare services.";

          document.getElementById("doctorDetail").innerHTML = `
        <div class="relative w-full h-40 max-w-6xl mx-auto ">
            <img src="${doctorImage}" alt="${currentDoctor.name}" class="w-full h-full object-cover  rounded-lg">
            <h1 class="absolute bottom-2 left-2 text-xl font-bold text-white bg-black/50 px-2 py-1 rounded">
                ${currentDoctor.name}
            </h1>
        </div>

        <div class="flex text-gray-600 my-10 leading-relaxed space-x-1 text-sm  justify-center max-w-6xl ">
            <a href="home.html#doctors" class="text-blue-600 hover:underline">Home</a>
            <span>&gt;</span>
            <a href="doctors.html" class="text-blue-600 hover:underline">Doctor</a>
            <span>&gt;</span>
            <span class="text-gray-800 font-medium">${currentDoctor.name}</span>
        </div>



        <div class="bg-white  p-6 flex flex-col justify-between max-w-6xl mx-auto md:flex-row gap-6">
          <img src="${doctorImage}" alt="${currentDoctor.name}" class="w-60 h-60 object-cover rounded-lg shadow-md">
          
          <div class="md:w-1/3">
            <h2 class="text-3xl font-bold text-gray-800 mb-2">${currentDoctor.name}</h2>
            <p class=" text-gray-600 text-sm px-3 py-1 font-italic w-fit mb-4">${doctorSpecialization}</p>
            <p class="text-gray-600 leading-relaxed mb-4">${doctorDescription}</p>
            <p class="text-gray-600 mb-1"><i class="fa-solid fa-envelope"></i>  <a href="mailto:${currentDoctor.email}" class="text-gray-500">${currentDoctor.email}</a></p>
            <p class="text-gray-600 mb-1"><i class="fa-solid fa-phone"></i> <a href="tel:${currentDoctor.phone}" class="text-gray-500">${currentDoctor.phone}</a></p>

            <div class="flex gap-2 mt-4">
              <button onclick="window.location.href='./home.html#appointment-form'" class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600">Book Appointment</button>
              <button onclick="showDetailedSchedule()" class="bg-green-500 text-white py-2 px-4 rounded hover:bg-green-600">View Detailed Schedule</button>
            </div>
          </div>

          <div class="mt-4 md:w-1/3 ">
            <h3 class="text-xl font-bold text-gray-800 mb-2  border-t border-gray-200">Other Doctors in ${doctorSpecialization}</h3>
           
           <ul id="other-doctors" class="divide-y divide-gray-200 border border-gray-200 rounded-lg"></ul>

          </div>
        </div>
      `;
          // Load other doctors in the same specialization
          loadOtherDoctors(doctorSpecialization);
          
          // Load schedule table
          loadScheduleTable();
        } else {
          document.getElementById("doctorDetail").innerHTML = '<p class="text-red-500 font-semibold">Doctor not found. The doctor with ID ' + doctorId + ' does not exist.</p>';
        }
      }

      function loadOtherDoctors(specialization) {
        const otherDoctorsContainer = document.querySelector("#other-doctors");
        if (!otherDoctorsContainer) return;

        const otherDoctors = doctors.filter((d) => 
          ((d.specialization && d.specialization.toLowerCase().includes(specialization.toLowerCase())) ||
           (d.department_name && d.department_name.toLowerCase().includes(specialization.toLowerCase()))) &&
          parseInt(d.id) !== parseInt(currentDoctor.id)
        );

        otherDoctorsContainer.innerHTML = otherDoctors
          .map((d) => `
            <li class="flex items-center gap-3 p-3 hover:bg-gray-50 transition">
              <div>
                <h4 class="text-gray-800 font-semibold text-sm">${d.name}</h4>
              </div>
            </li>
          `)
          .join("");
      }

      async function loadScheduleTable() {
        const tableBody = document.querySelector("#scheduleTable tbody");
        if (!tableBody) return;

        // Clear existing content
        tableBody.innerHTML = '';

        try {
          // Get current month for schedule display
          const currentDate = new Date();
          const currentMonth = currentDate.toISOString().slice(0, 7); // YYYY-MM format
          
          // Fetch doctor's schedule for current month
          const response = await fetch(`../../Backend/api/schedules.php?action=get_schedules&doctor_id=${currentDoctor.id}&month=${currentMonth}`);
          const data = await response.json();
          
          if (data.status === 'success' && data.data.length > 0) {
            // Group schedules by day of week
            const weeklySchedule = {
              "Sunday": [],
              "Monday": [],
              "Tuesday": [],
              "Wednesday": [],
              "Thursday": [],
              "Friday": [],
              "Saturday": []
            };
            
            // Process schedule data
            data.data.forEach(daySchedule => {
              const date = new Date(daySchedule.date);
              const dayName = date.toLocaleDateString('en-US', { weekday: 'long' });
              
              if (weeklySchedule[dayName]) {
                daySchedule.slots.forEach(slot => {
                  if (slot.is_available) {
                    weeklySchedule[dayName].push(`${convertTo12Hour(slot.start_time)} - ${convertTo12Hour(slot.end_time)}`);
                  }
                });
              }
            });
            
            // Create table row
            const row = document.createElement("tr");
            row.innerHTML = `<td class="border px-2 py-1 font-semibold text-center text-gray-400 h-20">${currentDoctor.name}</td>`;
            
            // Add schedule for each day
            const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            days.forEach((day) => {
              const daySchedules = weeklySchedule[day];
              let scheduleText = "--";
              let bgClass = "";
              
              if (daySchedules.length > 0) {
                // Show up to 2 time slots, add "..." if more
                if (daySchedules.length <= 2) {
                  scheduleText = daySchedules.join("<br>");
                } else {
                  scheduleText = daySchedules.slice(0, 2).join("<br>") + "<br><small>...</small>";
                }
                bgClass = "bg-green-100";
              }
              
              row.innerHTML += `<td class="border px-2 py-1 text-center text-sm ${bgClass}">${scheduleText}</td>`;
            });
            
            tableBody.appendChild(row);
          } else {
            // No schedule data available, show default message
            const row = document.createElement("tr");
            row.innerHTML = `<td class="border px-2 py-1 font-semibold text-center text-gray-400 h-20">${currentDoctor.name}</td>`;
            
            const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            days.forEach((day) => {
              row.innerHTML += `<td class="border px-2 py-1 text-center text-gray-500">Schedule not available</td>`;
            });
            
            tableBody.appendChild(row);
          }
        } catch (error) {
          console.error('Error loading schedule:', error);
          
          // Show error message
          const row = document.createElement("tr");
          row.innerHTML = `<td class="border px-2 py-1 font-semibold text-center text-gray-400 h-20">${currentDoctor.name}</td>`;
          
          const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
          days.forEach((day) => {
            row.innerHTML += `<td class="border px-2 py-1 text-center text-red-500">Error loading</td>`;
          });
          
          tableBody.appendChild(row);
        }
      }

      // Detailed Schedule Modal Functions
      let currentStartDate = new Date();
      let scheduleData = {};
      let autoRotateInterval;

      function showDetailedSchedule() {
        if (!currentDoctor) {
          alert('Doctor information not loaded');
          return;
        }
        
        // Set to start of current week
        currentStartDate = new Date();
        currentStartDate.setDate(currentStartDate.getDate() - currentStartDate.getDay());
        
        // Show modal
        document.getElementById('scheduleModal').classList.remove('hidden');
        
        // Load initial calendar
        updateCalendar();
        
        // Setup event listeners
        setupCalendarEventListeners();
        
        // Start auto-rotation
        startAutoRotate();
      }
      
      function closeScheduleModal() {
        document.getElementById('scheduleModal').classList.add('hidden');
        // Stop auto-rotation
        if (autoRotateInterval) {
          clearInterval(autoRotateInterval);
        }
      }

      function setupCalendarEventListeners() {
        document.getElementById('prevTwoWeeks').addEventListener('click', () => {
          currentStartDate.setDate(currentStartDate.getDate() - 14);
          updateCalendar();
        });

        document.getElementById('nextTwoWeeks').addEventListener('click', () => {
          currentStartDate.setDate(currentStartDate.getDate() + 14);
          updateCalendar();
        });

        document.getElementById('currentWeeks').addEventListener('click', () => {
          currentStartDate = new Date();
          currentStartDate.setDate(currentStartDate.getDate() - currentStartDate.getDay());
          updateCalendar();
        });
      }

      function startAutoRotate() {
        if (autoRotateInterval) {
          clearInterval(autoRotateInterval);
        }
        autoRotateInterval = setInterval(() => {
          currentStartDate.setDate(currentStartDate.getDate() + 14);
          updateCalendar();
        }, 10000); // Rotate every 10 seconds
      }

      async function updateCalendar() {
        // Update month/year display
        const endDate = new Date(currentStartDate);
        endDate.setDate(endDate.getDate() + 13);
        
        const monthYearText = currentStartDate.toLocaleDateString('en-US', { 
          month: 'long',
          year: 'numeric'
        });
        document.getElementById('calendarMonthYear').textContent = monthYearText;

        // Load schedule data for the two weeks
        await loadScheduleData(currentStartDate, endDate);

        // Render calendar
        renderCalendarDays(currentStartDate);
      }

      async function loadScheduleData(startDate, endDate) {
        try {
          const response = await fetch(`../../Backend/api/schedules.php?action=get_schedules&doctor_id=${currentDoctor.id}&start_date=${startDate.toISOString().split('T')[0]}&end_date=${endDate.toISOString().split('T')[0]}`);
          const data = await response.json();
          
          if (data.status === 'success') {
            // Transform data into a more usable format
            scheduleData = {};
            data.data.forEach(day => {
              scheduleData[day.date] = day.slots.filter(slot => slot.is_available);
            });
          }
        } catch (error) {
          console.error('Error loading schedule data:', error);
        }
      }

      function renderCalendarDays(startDate) {
        const calendarWeeks = document.getElementById('calendarWeeks');
        calendarWeeks.innerHTML = '';

        const endDate = new Date(startDate);
        endDate.setDate(endDate.getDate() + 14);

        // Create grid for days
        for (let i = 0; i < 14; i++) {
          const currentDate = new Date(startDate);
          currentDate.setDate(currentDate.getDate() + i);
          const dateStr = currentDate.toISOString().split('T')[0];
          
          const availableSlots = scheduleData[dateStr] || [];
          const isAvailable = availableSlots.length > 0;
          const isPast = currentDate < new Date().setHours(0, 0, 0, 0);

          const dayElement = document.createElement('div');
          dayElement.className = `border rounded-lg p-3 ${isPast ? 'bg-gray-100' : isAvailable ? 'bg-green-50 hover:bg-green-100 cursor-pointer' : 'bg-gray-50'} transition`;
          
          dayElement.innerHTML = `
            <div class="text-center">
              <div class="text-sm text-gray-600">${currentDate.toLocaleDateString('en-US', { weekday: 'short' })}</div>
              <div class="text-lg font-medium ${isAvailable ? 'text-green-600' : 'text-gray-400'}">${currentDate.getDate()}</div>
              ${isAvailable ? `<div class="text-xs text-green-600">${availableSlots.length} slots</div>` : ''}
            </div>
          `;

          if (isAvailable && !isPast) {
            dayElement.addEventListener('click', () => showTimeSlots(dateStr, availableSlots));
          }

          calendarWeeks.appendChild(dayElement);
        }
      }

      function showTimeSlots(date, slots) {
        const timeSlotsDiv = document.getElementById('timeSlots');
        const dateObj = new Date(date);
        const dateStr = dateObj.toLocaleDateString('en-US', { 
          weekday: 'long',
          month: 'long',
          day: 'numeric'
        });

        document.querySelector('#selectedDaySchedule h4').textContent = `Available Time Slots - ${dateStr}`;

        timeSlotsDiv.innerHTML = slots.map(slot => `
          <div class="border border-green-200 rounded-lg p-3 bg-green-50 hover:bg-green-100 cursor-pointer transition">
            <div class="font-medium text-green-800">${convertTo12Hour(slot.start_time)} - ${convertTo12Hour(slot.end_time)}</div>
            <div class="text-sm text-green-600">${slot.current_appointments}/${slot.max_appointments} booked</div>
          </div>
        `).join('');
      }

      // Convert 24-hour time to 12-hour format
      function convertTo12Hour(time24) {
        const [hours, minutes] = time24.split(':');
        const hour = parseInt(hours);
        const ampm = hour >= 12 ? 'PM' : 'AM';
        const hour12 = hour % 12 || 12;
        return `${hour12}:${minutes} ${ampm}`;
      }

      // Initialize when page loads
      document.addEventListener('DOMContentLoaded', function() {

      const filterButtons = document.querySelectorAll(".filter-btn");

        btn.addEventListener("click", () => {
          // Hide underline for all buttons
          filterButtons.forEach((b) =>
            b.querySelector(".underline").classList.add("hidden")

          // Show underline for clicked button
          btn.querySelector(".underline").classList.remove("hidden");

 <!-- Placeholder for spinner -->
<div id="spinner"></div>

<script>
  // Load spinner markup
  fetch("spinner.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("spinner").innerHTML = data;

      // Now spinner is in DOM -> attach JS logic
      const spinner = document.getElementById("spinner-overlay");

      function showSpinner() {
        spinner.classList.remove("hidden");
      }
      function hideSpinner() {
        spinner.classList.add("hidden");
      }

      // Show on links
    document.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", () => {
        if (link.getAttribute("href") !== "#" && !link.getAttribute("href")?.startsWith("javascript")) {
          showSpinner();
          setTimeout(hideSpinner, 10000); // works now
        }
      });
    });

    // Show on .show-spinner buttons
    document.querySelectorAll("button.show-spinner").forEach(btn => {
      btn.addEventListener("click", () => {
        showSpinner();
        setTimeout(hideSpinner, 10000); // works now
      });
    });

    // Show on form submit
    document.querySelectorAll("form").forEach(form => {
      form.addEventListener("submit", () => {
        showSpinner();
        setTimeout(hideSpinner, 10000); // works now
      });
    });

    // Optional: hide spinner after page load (auto)
    setTimeout(() => hideSpinner(), 10000);
    });
</script>
