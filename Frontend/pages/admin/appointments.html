<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Management - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" type="image/png" href="../../public/assets/logo.png">
    <style>
        .status-pending { @apply bg-yellow-100 text-yellow-800; }
        .status-confirmed { @apply bg-green-100 text-green-800; }
        .status-cancelled { @apply bg-red-100 text-red-800; }
        .status-completed { @apply bg-blue-100 text-blue-800; }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Admin Navigation -->
    <div id="adminNav"></div>
    <script>
        fetch("./shared/admin-nav.html")
            .then((res) => res.text())
            .then((data) => {
                document.getElementById("adminNav").innerHTML = data;
                // Mark current page as active
                const currentPage = document.querySelector('a[href="./appointments.html"]');
                if (currentPage) {
                    currentPage.className = currentPage.className.replace('text-gray-600 hover:bg-gray-100', 'text-gray-700 bg-blue-100');
                }
            });
    </script>
        <!-- Page Header -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800">📅 Appointment Management</h1>
                    <p class="text-gray-600 mt-2">View and manage all patient appointments</p>
                </div>
                <div class="flex gap-4">
                    <button id="refreshBtn" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition">
                        <i class="fas fa-sync-alt mr-2"></i>Refresh
                    </button>
                    <button id="exportBtn" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 transition">
                        <i class="fas fa-download mr-2"></i>Export
                    </button>
                </div>
            </div>
        </div>

        <!-- Statistics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-yellow-100 text-yellow-600">
                        <i class="fas fa-clock text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">Pending</p>
                        <p class="text-2xl font-bold text-gray-900" id="pendingCount">0</p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-green-100 text-green-600">
                        <i class="fas fa-check text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">Confirmed</p>
                        <p class="text-2xl font-bold text-gray-900" id="confirmedCount">0</p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-blue-100 text-blue-600">
                        <i class="fas fa-calendar-check text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">Completed</p>
                        <p class="text-2xl font-bold text-gray-900" id="completedCount">0</p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center">
                    <div class="p-3 rounded-full bg-red-100 text-red-600">
                        <i class="fas fa-times text-xl"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-600">Cancelled</p>
                        <p class="text-2xl font-bold text-gray-900" id="cancelledCount">0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">Filters</h3>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Status</label>
                    <select id="statusFilter" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">All Statuses</option>
                        <option value="pending">Pending</option>
                        <option value="confirmed">Confirmed</option>
                        <option value="completed">Completed</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Doctor</label>
                    <select id="doctorFilter" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">All Doctors</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Date</label>
                    <input type="date" id="dateFilter" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div class="flex items-end">
                    <button id="applyFilters" class="w-full bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition">
                        Apply Filters
                    </button>
                </div>
            </div>
        </div>

        <!-- Appointments Table -->
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200">
                <h3 class="text-lg font-semibold text-gray-800">Appointments</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Patient</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Doctor</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Department</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date & Time</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentsTableBody" class="bg-white divide-y divide-gray-200">
                        <!-- Appointments will be loaded here -->
                    </tbody>
                </table>
            </div>
            <div id="pagination" class="px-6 py-4 border-t border-gray-200">
                <!-- Pagination will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Status Update Modal -->
    <div id="statusModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl max-w-md w-full">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h3 class="text-lg font-semibold text-gray-800">Update Appointment Status</h3>
                </div>
                <div class="p-6">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">New Status</label>
                        <select id="newStatus" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="pending">Pending</option>
                            <option value="confirmed">Confirmed</option>
                            <option value="completed">Completed</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </div>
                    <div class="flex justify-end gap-3">
                        <button id="cancelStatusUpdate" class="px-4 py-2 text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
                            Cancel
                        </button>
                        <button id="confirmStatusUpdate" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition">
                            Update Status
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Appointment Details Modal -->
    <div id="detailsModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h3 class="text-lg font-semibold text-gray-800">Appointment Details</h3>
                </div>
                <div class="p-6">
                    <div id="appointmentDetails" class="space-y-4">
                        <!-- Details will be loaded here -->
                    </div>
                    <div class="flex justify-end mt-6">
                        <button id="closeDetailsModal" class="px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition">
                            Close
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 right-5 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg hidden z-50">
        <div class="flex items-center">
            <i class="fas fa-check-circle mr-2"></i>
            <span id="toastMessage">Success!</span>
        </div>
    </div>

    <script>
        let currentAppointmentId = null;
        let currentPage = 1;
        let currentFilters = {};

        // Load appointments on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadDoctors();
            loadAppointments();
            setupEventListeners();
        });

        function setupEventListeners() {
            // Filter controls
            document.getElementById('applyFilters').addEventListener('click', function() {
                currentFilters = {
                    status: document.getElementById('statusFilter').value,
                    doctor_id: document.getElementById('doctorFilter').value,
                    date: document.getElementById('dateFilter').value
                };
                currentPage = 1;
                loadAppointments();
            });

            // Refresh button
            document.getElementById('refreshBtn').addEventListener('click', loadAppointments);

            // Export button
            document.getElementById('exportBtn').addEventListener('click', exportAppointments);

            // Modal controls
            document.getElementById('cancelStatusUpdate').addEventListener('click', closeStatusModal);
            document.getElementById('confirmStatusUpdate').addEventListener('click', updateAppointmentStatus);
            document.getElementById('closeDetailsModal').addEventListener('click', closeDetailsModal);

            // Close modals when clicking outside
            document.getElementById('statusModal').addEventListener('click', function(e) {
                if (e.target === this) closeStatusModal();
            });
            document.getElementById('detailsModal').addEventListener('click', function(e) {
                if (e.target === this) closeDetailsModal();
            });
        }

        async function loadDoctors() {
            try {
                const response = await fetch('/doctor-appoinment/Backend/api/doctors.php?action=doctors');
                const data = await response.json();
                
                if (data.status === 'success') {
                    const doctorSelect = document.getElementById('doctorFilter');
                    doctorSelect.innerHTML = '<option value="">All Doctors</option>';
                    
                    data.data.forEach(doctor => {
                        const option = document.createElement('option');
                        option.value = doctor.id;
                        option.textContent = doctor.name;
                        doctorSelect.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Error loading doctors:', error);
            }
        }

        async function loadAppointments() {
            try {
                const params = new URLSearchParams({
                    action: 'list',
                    page: currentPage,
                    limit: 20,
                    ...currentFilters
                });

                const response = await fetch(`/doctor-appoinment/Backend/api/appointments.php?${params}`);
                const data = await response.json();
                
                if (data.appointments) {
                    renderAppointments(data.appointments);
                    renderPagination(data.pagination);
                    updateStatistics(data.appointments);
                } else {
                    showToast('Error loading appointments', 'error');
                }
            } catch (error) {
                console.error('Error loading appointments:', error);
                showToast('Network error loading appointments', 'error');
            }
        }

        function renderAppointments(appointments) {
            const tbody = document.getElementById('appointmentsTableBody');
            tbody.innerHTML = '';

            if (appointments.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="px-6 py-4 text-center text-gray-500">
                            No appointments found
                        </td>
                    </tr>
                `;
                return;
            }

            appointments.forEach(appointment => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50';
                
                const appointmentDate = new Date(appointment.appointment_date + ' ' + appointment.appointment_time);
                const formattedDate = appointmentDate.toLocaleDateString();
                const formattedTime = appointmentDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div>
                            <div class="text-sm font-medium text-gray-900">${appointment.patient_name}</div>
                            <div class="text-sm text-gray-500">${appointment.patient_email}</div>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-900">${appointment.doctor_name}</div>
                        <div class="text-sm text-gray-500">${appointment.specialization}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                        ${appointment.department_name || 'N/A'}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-900">${formattedDate}</div>
                        <div class="text-sm text-gray-500">${formattedTime}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full status-${appointment.status}">
                            ${appointment.status.charAt(0).toUpperCase() + appointment.status.slice(1)}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <div class="flex space-x-2">
                            <button onclick="viewAppointmentDetails(${appointment.id})" class="text-blue-600 hover:text-blue-900">
                                <i class="fas fa-eye"></i>
                            </button>
                            <button onclick="openStatusModal(${appointment.id})" class="text-green-600 hover:text-green-900">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="deleteAppointment(${appointment.id})" class="text-red-600 hover:text-red-900">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                `;
                
                tbody.appendChild(row);
            });
        }

        function renderPagination(pagination) {
            const paginationDiv = document.getElementById('pagination');
            if (pagination.pages <= 1) {
                paginationDiv.innerHTML = '';
                return;
            }

            let paginationHTML = '<div class="flex items-center justify-between">';
            paginationHTML += `<div class="text-sm text-gray-700">Showing ${((pagination.page - 1) * pagination.limit) + 1} to ${Math.min(pagination.page * pagination.limit, pagination.total)} of ${pagination.total} results</div>`;
            
            paginationHTML += '<div class="flex space-x-2">';
            
            // Previous button
            if (pagination.page > 1) {
                paginationHTML += `<button onclick="changePage(${pagination.page - 1})" class="px-3 py-1 border border-gray-300 rounded-md text-sm hover:bg-gray-50">Previous</button>`;
            }
            
            // Page numbers
            for (let i = Math.max(1, pagination.page - 2); i <= Math.min(pagination.pages, pagination.page + 2); i++) {
                const isActive = i === pagination.page;
                paginationHTML += `<button onclick="changePage(${i})" class="px-3 py-1 border border-gray-300 rounded-md text-sm ${isActive ? 'bg-blue-500 text-white' : 'hover:bg-gray-50'}">${i}</button>`;
            }
            
            // Next button
            if (pagination.page < pagination.pages) {
                paginationHTML += `<button onclick="changePage(${pagination.page + 1})" class="px-3 py-1 border border-gray-300 rounded-md text-sm hover:bg-gray-50">Next</button>`;
            }
            
            paginationHTML += '</div></div>';
            paginationDiv.innerHTML = paginationHTML;
        }

        function updateStatistics(appointments) {
            const stats = {
                pending: 0,
                confirmed: 0,
                completed: 0,
                cancelled: 0
            };

            appointments.forEach(appointment => {
                stats[appointment.status]++;
            });

            document.getElementById('pendingCount').textContent = stats.pending;
            document.getElementById('confirmedCount').textContent = stats.confirmed;
            document.getElementById('completedCount').textContent = stats.completed;
            document.getElementById('cancelledCount').textContent = stats.cancelled;
        }

        function changePage(page) {
            currentPage = page;
            loadAppointments();
        }

        function openStatusModal(appointmentId) {
            currentAppointmentId = appointmentId;
            document.getElementById('statusModal').classList.remove('hidden');
        }

        function closeStatusModal() {
            document.getElementById('statusModal').classList.add('hidden');
            currentAppointmentId = null;
        }

        async function updateAppointmentStatus() {
            if (!currentAppointmentId) return;

            const newStatus = document.getElementById('newStatus').value;
            
            try {
                const response = await fetch(`/doctor-appoinment/Backend/api/appointments.php?id=${currentAppointmentId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ status: newStatus })
                });

                const result = await response.json();

                if (response.ok) {
                    showToast('Appointment status updated successfully');
                    closeStatusModal();
                    loadAppointments();
                } else {
                    showToast(result.error || 'Failed to update status', 'error');
                }
            } catch (error) {
                console.error('Error updating status:', error);
                showToast('Network error updating status', 'error');
            }
        }

        async function viewAppointmentDetails(appointmentId) {
            try {
                const response = await fetch(`/doctor-appoinment/Backend/api/appointments.php?id=${appointmentId}`);
                const data = await response.json();
                
                if (data.appointment) {
                    const appointment = data.appointment;
                    const appointmentDate = new Date(appointment.appointment_date + ' ' + appointment.appointment_time);
                    
                    document.getElementById('appointmentDetails').innerHTML = `
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Patient Name</label>
                                <p class="text-sm text-gray-900">${appointment.patient_name}</p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Patient Email</label>
                                <p class="text-sm text-gray-900">${appointment.patient_email}</p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Doctor</label>
                                <p class="text-sm text-gray-900">${appointment.doctor_name}</p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Specialization</label>
                                <p class="text-sm text-gray-900">${appointment.specialization}</p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Department</label>
                                <p class="text-sm text-gray-900">${appointment.department_name || 'N/A'}</p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Status</label>
                                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full status-${appointment.status}">
                                    ${appointment.status.charAt(0).toUpperCase() + appointment.status.slice(1)}
                                </span>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Date</label>
                                <p class="text-sm text-gray-900">${appointmentDate.toLocaleDateString()}</p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Time</label>
                                <p class="text-sm text-gray-900">${appointmentDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
                            </div>
                        </div>
                        ${appointment.notes ? `
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Notes</label>
                                <p class="text-sm text-gray-900">${appointment.notes}</p>
                            </div>
                        ` : ''}
                    `;
                    
                    document.getElementById('detailsModal').classList.remove('hidden');
                } else {
                    showToast('Appointment not found', 'error');
                }
            } catch (error) {
                console.error('Error loading appointment details:', error);
                showToast('Error loading appointment details', 'error');
            }
        }

        function closeDetailsModal() {
            document.getElementById('detailsModal').classList.add('hidden');
        }

        async function deleteAppointment(appointmentId) {
            if (!confirm('Are you sure you want to delete this appointment?')) return;

            try {
                const response = await fetch(`/doctor-appoinment/Backend/api/appointments.php?id=${appointmentId}`, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (response.ok) {
                    showToast('Appointment deleted successfully');
                    loadAppointments();
                } else {
                    showToast(result.error || 'Failed to delete appointment', 'error');
                }
            } catch (error) {
                console.error('Error deleting appointment:', error);
                showToast('Network error deleting appointment', 'error');
            }
        }

        function exportAppointments() {
            // Simple CSV export functionality
            const table = document.querySelector('table');
            const rows = Array.from(table.querySelectorAll('tr'));
            
            let csv = 'Patient Name,Patient Email,Doctor,Department,Date,Time,Status\n';
            
            rows.slice(1).forEach(row => { // Skip header row
                const cells = Array.from(row.querySelectorAll('td'));
                if (cells.length > 0) {
                    const rowData = cells.map(cell => {
                        const text = cell.textContent.trim();
                        return `"${text.replace(/"/g, '""')}"`;
                    });
                    csv += rowData.join(',') + '\n';
                }
            });
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `appointments_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            
            toastMessage.textContent = message;
            
            if (type === 'error') {
                toast.className = toast.className.replace('bg-green-500', 'bg-red-500');
            } else {
                toast.className = toast.className.replace('bg-red-500', 'bg-green-500');
            }
            
            toast.classList.remove('hidden');
            
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }
    </script>
    </div> <!-- Close main content div -->
</div> <!-- Close flex container -->
    <script src="../../public/js/script.js"></script>
    <script src="./js/shared-auth.js"></script>
    <script src="./js/admin.js"></script>
</body>
</html>
