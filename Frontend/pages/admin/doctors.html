    <style>
        .search-result-item {
            @apply border border-gray-200 rounded-lg p-4 mb-4 hover:shadow-md transition-shadow duration-200;
        }

        .search-result-item:hover {
            @apply border-blue-300;
        }

        .search-result-type {
            @apply inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium;
        }

        .search-result-type.user {
            @apply bg-blue-100 text-blue-800;
        }

        .search-result-type.doctor {
            @apply bg-green-100 text-green-800;
        }

        .search-result-type.department {
            @apply bg-purple-100 text-purple-800;
        }

        .search-result-type.appointment {
            @apply bg-yellow-100 text-yellow-800;
        }

        .search-result-type.event {
            @apply bg-indigo-100 text-indigo-800;
        }

        .search-result-type.service {
            @apply bg-pink-100 text-pink-800;
        }

        .search-result-type.gallery {
            @apply bg-gray-100 text-gray-800;
        }

        .search-result-type.message {
            @apply bg-red-100 text-red-800;
        }

        .search-result-type.schedule {
            @apply bg-orange-100 text-orange-800;
        }

        .search-highlight {
            @apply bg-yellow-200 font-semibold;
        }

        .suggestion-item {
            @apply px-4 py-2 hover:bg-gray-100 cursor-pointer border-b border-gray-100 last:border-b-0;
        }

        .suggestion-item:hover {
            @apply bg-blue-50;
        }
    </style>
</head>

    <!-- Add Doctor Modal -->
    <div id="addDoctorModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow w-full max-w-2xl mx-4">
            <div class="flex items-center justify-between px-6 py-4 border-b">
                <h3 id="doctorModalTitle" class="text-lg font-semibold">Add Doctor</h3>
                <button id="closeAddDoctorModal" class="text-gray-500 hover:text-gray-700">✕</button>
            </div>
            <form id="addDoctorForm" enctype="multipart/form-data" class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" name="name" placeholder="Full Name" required class="px-3 py-2 border rounded">
                <input type="email" name="email" placeholder="Email" required class="px-3 py-2 border rounded">
                <input type="text" name="specialization" placeholder="Specialization" required class="px-3 py-2 border rounded">
                <input type="text" name="phone" placeholder="Phone" class="px-3 py-2 border rounded">
                <select name="department_id" class="px-3 py-2 border rounded">
                    <option value="">Select Department (Optional)</option>
                </select>
                <input type="text" name="description" placeholder="Description" class="px-3 py-2 border rounded md:col-span-2">
                <input type="file" name="image" accept="image/*" class="px-3 py-2 border rounded md:col-span-2">
                <div class="md:col-span-2 flex justify-end gap-3">
                    <button type="button" id="cancelAddDoctor" class="px-4 py-2 rounded border">Cancel</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">Save</button>
                </div>
            </form>

    <script src="../../public/js/script.js"></script>
    <script src="./js/shared-auth.js"></script>
    <script src="./js/page-search.js"></script>
    <script>
        class DoctorsManager {
            constructor() {
                this.apiBase = '/doctor-appoinment/Backend/api/admin.php';
                this.doctors = [];
                this.departments = [];
                this.editingDoctorId = null;
                this.init();
            }

            async init() {
                // Wait for shared auth to initialize
                if (typeof sharedAuth !== 'undefined') {
                    await sharedAuth.init();
                    if (!sharedAuth.canAccess()) {
                        sharedAuth.showAuthStatus();
                        return;
                    }
                }
                
                await this.loadDepartments();
                await this.loadDoctors();
                this.setupEventListeners();
            }

            async loadDepartments() {
                try {
                    const response = await fetch('/doctor-appoinment/Backend/api/admin.php?action=get_departments_dropdown', {
                        credentials: 'include',
                        cache: 'no-cache'
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        if (data.success) {
                            this.departments = data.departments;
                            this.populateDepartmentDropdown();
                        }
                    }
                } catch (error) {
                    console.error('Failed to load departments:', error);
                }
            }

            populateDepartmentDropdown() {
                const select = document.querySelector('select[name="department_id"]');
                if (!select) return;
                
                // Clear existing options except the first one
                select.innerHTML = '<option value="">Select Department (Optional)</option>';
                
                // Add department options
                this.departments.forEach(dept => {
                    const option = document.createElement('option');
                    option.value = dept.id;
                    option.textContent = dept.name;
                    select.appendChild(option);
                });
            }

            async loadDoctors() {
                try {
                    const response = await fetch('/doctor-appoinment/Backend/api/admin.php?action=get_doctors', {
                        credentials: 'include',
                        cache: 'no-cache'
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        if (data.success) {
                            this.doctors = data.doctors;
                            this.renderDoctorsTable();
                        } else {
                            this.showAuthMessage();
                        }
                    } else {
                        this.showAuthMessage();
                    }
                } catch (error) {
                    console.error('Failed to load doctors:', error);
                    this.showAuthMessage();
                }
            }

            showAuthMessage() {
                const tbody = document.getElementById('doctorsTableBody');
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="px-6 py-4 text-center">
                            <div class="text-gray-500 mb-2">Authentication required to view doctors</div>
                            <a href="../signin.html" class="text-blue-600 hover:text-blue-800 underline">Click here to login</a>
                        </td>
                    </tr>
                `;
            }

            renderDoctorsTable() {
                const tbody = document.getElementById('doctorsTableBody');
                
                if (this.doctors.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">No doctors found</td></tr>';
                    return;
                }

                tbody.innerHTML = this.doctors.map(doctor => `
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm font-medium text-gray-900">${doctor.name}</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm text-gray-900">${doctor.email}</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm text-gray-900">${doctor.specialization}</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm text-gray-900">${doctor.phone}</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                            <button class="text-blue-600 hover:text-blue-900 mr-3" onclick='doctorsManager.openEditDoctor(${JSON.stringify("__ID__").replace("\"__ID__\"", String(doctor.id))})'>Edit</button>
                            <button class="text-red-600 hover:text-red-900" onclick='doctorsManager.deleteDoctor(${JSON.stringify("__ID__\n").replace("\"__ID__\\n\"", String(doctor.id))})'>Delete</button>
                        </td>
                    </tr>
                `).join('');
            }

            setupEventListeners() {
                const form = document.getElementById('addDoctorForm');
                const modal = document.getElementById('addDoctorModal');
                const openBtn = document.getElementById('openAddDoctorModal');
                const closeBtn = document.getElementById('closeAddDoctorModal');
                const cancelBtn = document.getElementById('cancelAddDoctor');

                const openModal = () => {
                    if (modal) {
                        modal.classList.remove('hidden');
                        modal.classList.add('flex');
                    }
                };
                const closeModal = () => {
                    if (modal) {
                        modal.classList.add('hidden');
                        modal.classList.remove('flex');
                    }
                    this.editingDoctorId = null;
                    document.getElementById('doctorModalTitle').textContent = 'Add Doctor';
                    form.reset();
                };

                if (openBtn) openBtn.addEventListener('click', openModal);
                if (closeBtn) closeBtn.addEventListener('click', closeModal);
                if (cancelBtn) cancelBtn.addEventListener('click', closeModal);

                if (form) {
                    form.addEventListener('submit', async (e) => {
                        e.preventDefault();
                        if (this.editingDoctorId) {
                            // Update via JSON (ignore image during edit for now)
                            const fd = new FormData(form);
                            const payload = {
                                id: this.editingDoctorId,
                                name: fd.get('name') || '',
                                email: fd.get('email') || '',
                                specialization: fd.get('specialization') || '',
                                phone: fd.get('phone') || '',
                                department_id: fd.get('department_id') || null
                            };
                            try {
                                const response = await fetch('/doctor-appoinment/Backend/api/admin.php?action=update_doctor', {
                                    method: 'PUT',
                                    credentials: 'include',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(payload)
                                });
                                const data = await response.json();
                                if (response.ok && data.success) {
                                    closeModal();
                                    await this.loadDoctors();
                                } else {
                                    alert(data.error || 'Failed to update doctor');
                                }
                            } catch (err) {
                                console.error('Update doctor failed:', err);
                                alert('Failed to update doctor');
                            }
                        } else {
                            // Create via multipart FormData (supports image)
                            const formData = new FormData(form);
                            try {
                                const response = await fetch('/doctor-appoinment/Backend/api/admin.php?action=add_doctor', {
                                    method: 'POST',
                                    credentials: 'include',
                                    body: formData
                                });
                                const data = await response.json();
                                if (response.ok && data.success) {
                                    form.reset();
                                    closeModal();
                                    await this.loadDoctors();
                                } else {
                                    alert(data.error || 'Failed to add doctor');
                                }
                            } catch (err) {
                                console.error('Add doctor failed:', err);
                                alert('Failed to add doctor');
                            }
                        }
                    });
                }
            }

            openEditDoctor(id) {
                const modal = document.getElementById('addDoctorModal');
                const form = document.getElementById('addDoctorForm');
                const title = document.getElementById('doctorModalTitle');
                const doctor = this.doctors.find(d => String(d.id) === String(id));
                if (!doctor) return;
                this.editingDoctorId = id;
                if (title) title.textContent = 'Edit Doctor';
                if (form) {
                    form.querySelector('input[name="name"]').value = doctor.name || '';
                    form.querySelector('input[name="email"]').value = doctor.email || '';
                    form.querySelector('input[name="specialization"]').value = doctor.specialization || '';
                    form.querySelector('input[name="phone"]').value = doctor.phone || '';
                    form.querySelector('input[name="description"]').value = doctor.description || '';
                    
                    // Set department dropdown
                    const departmentSelect = form.querySelector('select[name="department_id"]');
                    if (departmentSelect) {
                        departmentSelect.value = doctor.department_id || '';
                    }
                }
                if (modal) {
                    modal.classList.remove('hidden');
                    modal.classList.add('flex');
                }
            }

            async deleteDoctor(id) {
                if (!confirm('Are you sure you want to delete this doctor?')) return;
                try {
                    const resp = await fetch(`/doctor-appoinment/Backend/api/admin.php?action=delete_doctor&id=${id}`, {
                        method: 'DELETE',
                        credentials: 'include'
                    });
                    const data = await resp.json();
                    if (resp.ok && data.success) {
                        await this.loadDoctors();
                    } else {
                        alert(data.error || 'Failed to delete doctor');
                    }
                } catch (e) {
                    console.error('Delete doctor failed:', e);
                    alert('Failed to delete doctor');
                }
            }


        }

        // Initialize doctors manager
        let doctorsManager;
        document.addEventListener('DOMContentLoaded', () => {
            doctorsManager = new DoctorsManager();
        });
    </script>
