    <!-- Main Content -->
    <div class="flex-1 p-6 md:p-8">
            <div class="mb-6">
                <h1 class="text-3xl font-bold text-gray-900">Doctors Management</h1>
            </div>



            <!-- Toolbar -->
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-semibold">Doctors</h2>
                <button id="openAddDoctorModal" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">Add Doctor</button>
            </div>

            <!-- Search Bar -->
            <div class="mb-6">
                <div class="relative max-w-md">
                    <input
                        type="text"
                        id="doctorSearch"
                        placeholder="Search doctors by name, email, phone, or specialization..."
                        class="w-full px-4 py-2 pl-10 pr-10 text-gray-700 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"

                        </svg>
                    </div>

                        id="clearSearch"
                        class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600 hidden"
                    >

    <!-- Add Doctor Modal -->
    <div id="addDoctorModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow w-full max-w-2xl mx-4">
            <div class="flex items-center justify-between px-6 py-4 border-b">
                <h3 id="doctorModalTitle" class="text-lg font-semibold">Add Doctor</h3>
                <button id="closeAddDoctorModal" class="text-gray-500 hover:text-gray-700">✕</button>
            </div>
            <form id="addDoctorForm" enctype="multipart/form-data" class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" name="name" placeholder="Full Name" required class="px-3 py-2 border rounded">
                <input type="email" name="email" placeholder="Email" required class="px-3 py-2 border rounded">
                <input type="text" name="specialization" placeholder="Specialization" required class="px-3 py-2 border rounded">
                <input type="text" name="phone" id="doctorPhone" placeholder="Phone (10 digits)" maxlength="10" inputmode="numeric" class="px-3 py-2 border rounded">
                <select name="department_id" class="px-3 py-2 border rounded">
                    <option value="">Select Department (Optional)</option>
                </select>
                <input type="text" name="description" placeholder="Description" class="px-3 py-2 border rounded md:col-span-2">
                <input type="file" name="image" accept="image/*" class="px-3 py-2 border rounded md:col-span-2">
                <div class="md:col-span-2 flex justify-end gap-3">
                    <button type="button" id="cancelAddDoctor" class="px-4 py-2 rounded border">Cancel</button>
                    <button type="submit" id="saveDoctorBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">Save</button>
                </div>
            </form>
            <!-- Upload progress (hidden until an upload starts) -->
            <div class="p-4">
                <div id="uploadProgress" class="w-full bg-gray-200 h-3 rounded overflow-hidden hidden">
                    <div id="uploadProgressBar" class="h-full bg-blue-600 w-0"></div>
                </div>
                <div id="uploadProgressText" class="text-sm text-gray-600 mt-2 hidden">Uploading: <span id="uploadProgressPercent">0%</span></div>
            </div>
        </div>

    <script src="https://spchospital.com/Frontend/public/js/config.js"></script>
    <script src="https://spchospital.com/Frontend/public/js/script.js"></script>
    <script src="https://spchospital.com/Frontend/pages/admin/js/shared-auth.js"></script>
    <script>
        class DoctorsManager {
            constructor() {
                this.apiBase = ((typeof window.buildApiUrl === 'function') ? window.buildApiUrl('admin.php') : (window.APP_API_FOLDER ? window.APP_API_FOLDER + 'admin.php' : 'https://spchospital.com/Backend/api/admin.php'));
                this.doctors = [];
                this.departments = [];
                this.editingDoctorId = null;
                this.currentSearchTerm = '';
                this.searchTimeout = null;
                this.init();
            }

            async init() {
                // Wait for shared auth to initialize
                if (typeof sharedAuth !== 'undefined') {
                    await sharedAuth.init();
                    if (!sharedAuth.canAccess()) {
                        sharedAuth.showAuthStatus();
                        return;
                    }
                }
                
                await this.loadDepartments();
                await this.loadDoctors();
                this.setupEventListeners();
            }

            async loadDepartments() {
                try {
                        const deptUrl = (typeof window.buildApiUrl === 'function') ? window.buildApiUrl('admin.php?action=get_departments_dropdown') : (window.APP_API_FOLDER ? (window.APP_API_FOLDER + 'admin.php?action=get_departments_dropdown') : 'https://spchospital.com/Backend/api/admin.php?action=get_departments_dropdown');
                        const response = await fetch(deptUrl, {
                        credentials: 'include',
                        cache: 'no-cache'
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        if (data.success) {
                            this.departments = data.departments;
                            this.populateDepartmentDropdown();
                        }
                    }
                } catch (error) {
                    console.error('Failed to load departments:', error);
                }
            }

            populateDepartmentDropdown() {
                const select = document.querySelector('select[name="department_id"]');
                if (!select) return;
                
                // Clear existing options except the first one
                select.innerHTML = '<option value="">Select Department (Optional)</option>';
                
                // Add department options
                this.departments.forEach(dept => {
                    const option = document.createElement('option');
                    option.value = dept.id;
                    option.textContent = dept.name;
                    select.appendChild(option);
                });
            }

            async loadDoctors(searchTerm = '') {
                try {
                    let url = (typeof window.buildApiUrl === 'function') ? window.buildApiUrl('admin.php?action=get_doctors') : (window.APP_API_FOLDER ? (window.APP_API_FOLDER + 'admin.php?action=get_doctors') : 'https://spchospital.com/Backend/api/admin.php?action=get_doctors');
                    if (searchTerm) {
                        url += '&search=' + encodeURIComponent(searchTerm);
                    }
                    
                    const response = await fetch(url, {
                        credentials: 'include',
                        cache: 'no-cache'
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        if (data.success) {
                            this.doctors = data.doctors;
                            this.renderDoctorsTable();
                        } else {
                            this.showAuthMessage();
                        }
                    } else {
                        this.showAuthMessage();
                    }
                } catch (error) {
                    console.error('Failed to load doctors:', error);
                    this.showAuthMessage();
                }
            }

            showAuthMessage() {
                const container = document.getElementById('doctorsContainer');
                if (!container) return;
                container.innerHTML = `
                    <div class="col-span-full text-center py-8">
                        <div class="text-gray-500 mb-2">Authentication required to view doctors</div>
                        <a href="login.html" class="text-blue-600 hover:text-blue-800 underline">Click here to login</a>
                    </div>
                `;
            }

            renderDoctorsTable() {
                const container = document.getElementById('doctorsContainer');
                if (!container) return;

                if (!this.doctors || this.doctors.length === 0) {
                    container.innerHTML = '<div class="col-span-full text-center text-gray-500 py-8">No doctors found</div>';
                    return;
                }

                container.innerHTML = this.doctors.map(doctor => {
                    // compute a reliable avatar asset URL
                    const assetAvatar = (typeof window.buildAssetUrl === 'function') ? window.buildAssetUrl('assets/avatar.png') : (window.location.origin + (window.location.pathname.includes('/Frontend/') ? window.location.pathname.split('/Frontend/')[0] : '') + '/Frontend/public/assets/avatar.png');

                    // determine image URL (uploaded doctor image)
                    let img = assetAvatar;
                    if (doctor.image_path) {
                        const imgPath = String(doctor.image_path || '');
                        const imgName = imgPath.split('/').pop();
                        // If image_path looks like a full URL, use it
                        if (imgPath.startsWith('http')) {
                            img = imgPath;
                        } else if (imgPath.startsWith('/')) {
                            // Absolute path on the same host
                            img = window.location.origin + imgPath;
                        } else if (imgName) {
                            // Relative upload filename; try buildUploadUrl or construct relative to app root
                            if (typeof window.buildUploadUrl === 'function') {
                                img = window.buildUploadUrl(`doctors/${imgName}`);
                            } else {
                                // construct a path relative to the current host and project root
                                const basePath = window.location.pathname.includes('/doctor-appoinment') ? window.location.pathname.split('/doctor-appoinment')[0] + '/doctor-appoinment' : '';
                                img = window.location.origin + basePath + '/uploads/doctors/' + imgName;
                            }
                        }
                    }

                    return `
                        <div class="bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm hover:shadow-lg transition flex flex-col">
                            <div class="h-48 w-full overflow-hidden bg-gray-100 flex items-center justify-center">
                                <img src="${img}" alt="${doctor.name}" class="object-cover w-full h-full" onerror="this.onerror=null;this.src='${assetAvatar}';" />
                            </div>
                            <div class="p-4 flex-1 flex flex-col relative pb-12">
                                <h3 class="text-lg font-semibold text-gray-900 mb-1">${doctor.name}</h3>
                                <p class="text-sm text-gray-600 mb-2">${doctor.specialization || ''}</p>
                                <p class="text-sm text-gray-600 mb-4">${doctor.phone || ''}</p>
                                <div class="text-sm text-gray-500">${doctor.email || ''}</div>

                                <!-- Actions pinned to bottom-right -->
                                <div class="absolute bottom-3 right-3 flex gap-2">
                                    <button class="text-blue-600 hover:text-blue-900 px-2 py-1 rounded" onclick='doctorsManager.openEditDoctor(${JSON.stringify("__ID__").replace("\"__ID__\"", String(doctor.id))})'>Edit</button>
                                    <button class="text-red-600 hover:text-red-900 px-2 py-1 rounded" onclick='doctorsManager.deleteDoctor(${JSON.stringify("__ID__\n").replace("\"__ID__\\n\"", String(doctor.id))})'>Delete</button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // Client-side phone validation helper used on form submit
            validatePhoneNumber(value) {
                if (!value) return true; // allow empty (optional)
                const cleaned = String(value).replace(/[^0-9]/g, '');
                return cleaned.length === 10;
            }

            setupSearchFunctionality() {
                const searchInput = document.getElementById('doctorSearch');
                const clearButton = document.getElementById('clearSearch');

                if (searchInput) {
                    searchInput.addEventListener('input', (e) => {
                        const searchTerm = e.target.value.trim();
                        this.currentSearchTerm = searchTerm;
                        
                        // Show/hide clear button
                        if (clearButton) {
                            if (searchTerm) {
                                clearButton.classList.remove('hidden');
                            } else {
                                clearButton.classList.add('hidden');
                            }
                        }
                        
                        // Debounce search to avoid too many API calls
                        clearTimeout(this.searchTimeout);
                        this.searchTimeout = setTimeout(() => {
                            this.loadDoctors(searchTerm);
                        }, 300);
                    });
                }

                if (clearButton) {
                    clearButton.addEventListener('click', () => {
                        if (searchInput) {
                            searchInput.value = '';
                            this.currentSearchTerm = '';
                            clearButton.classList.add('hidden');
                            this.loadDoctors('');
                        }
                    });
                }
            }

            setupEventListeners() {
                const form = document.getElementById('addDoctorForm');
                const modal = document.getElementById('addDoctorModal');
                const openBtn = document.getElementById('openAddDoctorModal');
                const closeBtn = document.getElementById('closeAddDoctorModal');
                const cancelBtn = document.getElementById('cancelAddDoctor');

                // Setup search functionality
                this.setupSearchFunctionality();

                const openModal = () => {
                    if (modal) {
                        modal.classList.remove('hidden');
                        modal.classList.add('flex');
                    }
                };
                const closeModal = () => {
                    if (modal) {
                        modal.classList.add('hidden');
                        modal.classList.remove('flex');
                    }
                    this.editingDoctorId = null;
                    document.getElementById('doctorModalTitle').textContent = 'Add Doctor';
                    form.reset();
                };

                if (openBtn) openBtn.addEventListener('click', openModal);
                if (closeBtn) closeBtn.addEventListener('click', closeModal);
                if (cancelBtn) cancelBtn.addEventListener('click', closeModal);

                if (form) {
                    form.addEventListener('submit', async (e) => {
                        e.preventDefault();
                        // Validate phone before submitting: only if provided it must be exactly 10 digits
                        const phoneInput = form.querySelector('input[name="phone"]');
                        const phoneVal = phoneInput ? phoneInput.value : '';
                        if (phoneVal && !this.validatePhoneNumber(phoneVal)) {
                            alert('Phone number must contain exactly 10 digits.');
                            if (phoneInput) phoneInput.focus();
                            return;
                        }
                        if (this.editingDoctorId) {
                            // Update via JSON (ignore image during edit for now)
                            const fd = new FormData(form);
                            const payload = {
                                id: this.editingDoctorId,
                                name: fd.get('name') || '',
                                email: fd.get('email') || '',
                                specialization: fd.get('specialization') || '',
                                phone: fd.get('phone') || '',
                                department_id: fd.get('department_id') || null
                            };
                            try {
                                const updateUrl = (typeof window.buildApiUrl === 'function') ? window.buildApiUrl('admin.php?action=update_doctor') : (window.APP_API_FOLDER ? (window.APP_API_FOLDER + 'admin.php?action=update_doctor') : 'https://spchospital.com/Backend/api/admin.php?action=update_doctor');
                                const response = await fetch(updateUrl, {
                                    method: 'PUT',
                                    credentials: 'include',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(payload)
                                });
                                const data = await response.json();
                                if (response.ok && data.success) {
                                    closeModal();
                                    await this.loadDoctors();
                                } else {
                                    alert(data.error || 'Failed to update doctor');
                                }
                            } catch (err) {
                                console.error('Update doctor failed:', err);
                                alert('Failed to update doctor');
                            }
                        } else {
                            // Create via multipart FormData (supports image)
                            const formData = new FormData(form);
                            try {
                                const addUrl = (typeof window.buildApiUrl === 'function') ? window.buildApiUrl('admin.php?action=add_doctor') : (window.APP_API_FOLDER ? (window.APP_API_FOLDER + 'admin.php?action=add_doctor') : 'https://spchospital.com/Backend/api/admin.php?action=add_doctor');

                                // Use XHR to get upload progress events
                                await this.uploadWithProgress(addUrl, formData);

                                // On success
                                form.reset();
                                closeModal();
                                await this.loadDoctors();
                            } catch (err) {
                                console.error('Add doctor failed:', err);
                                alert(err && err.message ? err.message : 'Failed to add doctor');
                            } finally {
                                // Ensure UI is re-enabled
                                this.setUploading(false);
                            }
                        }
                    });

                    // Sanitize phone input on the fly (allow only digits, max 10)
                    const phoneEl = form.querySelector('#doctorPhone');
                    if (phoneEl) {
                        phoneEl.addEventListener('input', (ev) => {
                            const cleaned = ev.target.value.replace(/[^0-9]/g, '').slice(0,10);
                            if (ev.target.value !== cleaned) ev.target.value = cleaned;
                        });
                    }
                }
            }

            // Upload helper: uses XMLHttpRequest to report progress and returns a Promise
            uploadWithProgress(url, formData) {
                const self = this;
                return new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    xhr.open('POST', url, true);
                    xhr.withCredentials = true;

                    xhr.upload.addEventListener('progress', function(e) {
                        if (e.lengthComputable) {
                            const percent = Math.round((e.loaded / e.total) * 100);
                            self.updateUploadProgress(percent);
                        }
                    });

                    xhr.addEventListener('load', function() {
                        try {
                            const ct = xhr.getResponseHeader('content-type') || '';
                            const text = xhr.responseText || '';
                            if (!xhr.status || xhr.status < 200 || xhr.status >= 300) {
                                return reject(new Error('Upload failed: HTTP ' + xhr.status + ' - ' + text.slice(0,200)));
                            }
                            if (ct.indexOf('application/json') === -1) {
                                // Try to parse if possible, otherwise treat as error
                                try { var parsed = JSON.parse(text); } catch (e) { return reject(new Error('Invalid server response')) }
                            } else {
                                var parsed = JSON.parse(text);
                            }

                            if (parsed && parsed.success) {
                                resolve(parsed);
                            } else {
                                reject(new Error(parsed && parsed.error ? parsed.error : 'Server reported failure'));
                            }
                        } catch (e) {
                            reject(e);
                        }
                    });

                    xhr.addEventListener('error', function() {
                        reject(new Error('Network error during upload'));
                    });

                    // Before sending, disable UI
                    this.setUploading(true);
                    // small delay to allow UI update
                    setTimeout(() => {
                        xhr.send(formData);
                    }, 50);
                });
            }

            // UI helpers for upload progress and disabling
            setUploading(isUploading) {
                const modal = document.getElementById('addDoctorModal');
                const saveBtn = document.getElementById('saveDoctorBtn');
                const cancelBtn = document.getElementById('cancelAddDoctor');
                const form = document.getElementById('addDoctorForm');

                if (isUploading) {
                    if (saveBtn) {
                        saveBtn.disabled = true;
                        saveBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    }
                    if (cancelBtn) cancelBtn.disabled = true;
                    if (form) Array.from(form.elements).forEach(el => el.disabled = true);
                    // show progress UI
                    const progress = document.getElementById('uploadProgress');
                    const text = document.getElementById('uploadProgressText');
                    if (progress) progress.classList.remove('hidden');
                    if (text) text.classList.remove('hidden');
                    this.updateUploadProgress(0);
                } else {
                    if (saveBtn) {
                        saveBtn.disabled = false;
                        saveBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    }
                    if (cancelBtn) cancelBtn.disabled = false;
                    if (form) Array.from(form.elements).forEach(el => el.disabled = false);
                    const progress = document.getElementById('uploadProgress');
                    const text = document.getElementById('uploadProgressText');
                    if (progress) progress.classList.add('hidden');
                    if (text) text.classList.add('hidden');
                    this.updateUploadProgress(0);
                }
            }

            updateUploadProgress(percent) {
                const bar = document.getElementById('uploadProgressBar');
                const txt = document.getElementById('uploadProgressPercent');
                if (bar) bar.style.width = (percent || 0) + '%';
                if (txt) txt.textContent = (percent || 0) + '%';
            }

            openEditDoctor(id) {
                const modal = document.getElementById('addDoctorModal');
                const form = document.getElementById('addDoctorForm');
                const title = document.getElementById('doctorModalTitle');
                const doctor = this.doctors.find(d => String(d.id) === String(id));
                if (!doctor) return;
                this.editingDoctorId = id;
                if (title) title.textContent = 'Edit Doctor';
                if (form) {
                    form.querySelector('input[name="name"]').value = doctor.name || '';
                    form.querySelector('input[name="email"]').value = doctor.email || '';
                    form.querySelector('input[name="specialization"]').value = doctor.specialization || '';
                    form.querySelector('input[name="phone"]').value = doctor.phone || '';
                    form.querySelector('input[name="description"]').value = doctor.description || '';
                    
                    // Set department dropdown
                    const departmentSelect = form.querySelector('select[name="department_id"]');
                    if (departmentSelect) {
                        departmentSelect.value = doctor.department_id || '';
                    }
                }
                if (modal) {
                    modal.classList.remove('hidden');
                    modal.classList.add('flex');
                }
            }

            async deleteDoctor(id) {
                if (!confirm('Are you sure you want to delete this doctor?')) return;
                try {
                    const delUrl = (typeof window.buildApiUrl === 'function') ? window.buildApiUrl(`admin.php?action=delete_doctor&id=${id}`) : (window.APP_API_FOLDER ? (window.APP_API_FOLDER + `admin.php?action=delete_doctor&id=${id}`) : `https://spchospital.com/Backend/api/admin.php?action=delete_doctor&id=${id}`);
                    const resp = await fetch(delUrl, {
                        method: 'DELETE',
                        credentials: 'include'
                    });
                    const data = await resp.json();
                    if (resp.ok && data.success) {
                        await this.loadDoctors();
                    } else {
                        alert(data.error || 'Failed to delete doctor');
                    }
                } catch (e) {
                    console.error('Delete doctor failed:', e);
                    alert('Failed to delete doctor');
                }
            }


        }

        // Initialize doctors manager
        let doctorsManager;
        document.addEventListener('DOMContentLoaded', () => {
            doctorsManager = new DoctorsManager();
        });
    </script>
    <script src="./js/admin.js"></script>
</body>
