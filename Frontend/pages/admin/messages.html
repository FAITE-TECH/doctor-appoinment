        <!-- Main Content -->
        <div class="flex-1 p-8">
            <!-- Header -->
            <div class="mb-6">
                <h1 class="text-3xl font-bold text-gray-900 mb-2">Contact Messages</h1>
                <p class="text-gray-600">Manage and reply to customer inquiries</p>
            </div>

        <!-- Filter and Stats -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center space-x-4">
                    <select id="statusFilter" class="border border-gray-300 rounded-md px-3 py-2">
                        <option value="">All Messages</option>
                        <option value="new">New</option>
                        <option value="read">Read</option>
                        <option value="replied">Replied</option>
                        <option value="closed">Closed</option>
                    </select>
                    <button onclick="loadMessages()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                        <i class="fas fa-filter mr-2"></i>Filter
                    </button>
                </div>
                <div class="flex items-center space-x-6 text-sm">
                    <div class="text-center">
                        <div class="text-2xl font-bold text-blue-600" id="newCount">0</div>
                        <div class="text-gray-600">New</div>
                    </div>
                    <div class="text-center">
                        <div class="text-2xl font-bold text-green-600" id="repliedCount">0</div>
                        <div class="text-gray-600">Replied</div>
                    </div>
                    <div class="text-center">
                        <div class="text-2xl font-bold text-gray-600" id="totalCount">0</div>
                        <div class="text-gray-600">Total</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Messages List -->
        <div class="bg-white rounded-lg shadow">
            <div class="p-6">
                <div id="messagesList" class="space-y-4">
                    <!-- Messages will be loaded here -->
                </div>
                
                <!-- Pagination -->
                <div id="pagination" class="mt-6 flex justify-center">
                    <!-- Pagination will be loaded here -->
                </div>
            </div>
        </div>

    <!-- Reply Modal -->
    <div id="replyModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-2xl mx-4">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold">Reply to Message</h3>
                <button onclick="closeReplyModal()" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <div id="messageDetails" class="mb-4 p-4 bg-gray-50 rounded">
                <!-- Message details will be shown here -->
            </div>
            
            <form id="replyForm">
                <input type="hidden" id="replyMessageId">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Your Reply</label>
                    <textarea id="adminReply" rows="6" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Type your reply here..." required></textarea>
                </div>
                
                <div class="flex justify-end space-x-3">
                    <button type="button" onclick="closeReplyModal()" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">
                        Cancel
                    </button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                        <i class="fas fa-paper-plane mr-2"></i>Send Reply
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- View Message Modal -->
    <div id="viewModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-3xl mx-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold">Message Details</h3>
                <button onclick="closeViewModal()" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <div id="viewMessageContent" class="space-y-4">
                <!-- Message content will be populated here -->
            </div>
            
            <div class="flex justify-end space-x-3 mt-6">
                <button type="button" onclick="closeViewModal()" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">
                    Close
                </button>
                <button type="button" id="replyFromViewBtn" onclick="replyFromView()" class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700">
                    <i class="fas fa-reply mr-2"></i>Reply
                </button>
            </div>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 flex items-center space-x-3">
            <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-600"></div>
            <span>Loading...</span>
        </div>
    </div>

    <script src="js/shared-auth.js"></script>
    <script>
        let currentPage = 1;
        let currentStatus = '';
        let loadedMessages = []; // Store loaded messages for quick access

        // Check authentication on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Wait for shared auth to initialize
            setTimeout(() => {
                if (sharedAuth && sharedAuth.isAuthChecked()) {
                    if (!sharedAuth.canAccess()) {
                        window.location.href = 'login.html';
                        return;
                    }
                    loadMessages();
                    loadUnreadMessagesCount();
                } else {
                    // If shared auth is not ready, check manually
                    checkAuth();
                }
            }, 100);
        });

        // Fallback authentication check
        async function checkAuth() {
            try {
                const response = await fetch('../../../Backend/api/auth.php?action=me', {
                    method: 'GET',
                    credentials: 'include'
                });
                const data = await response.json();
                
                if (!data.authenticated || data.user.role !== 'admin') {
                    window.location.href = 'login.html';
                    return;
                }
                loadMessages();
            } catch (error) {
                console.error('Auth check failed:', error);
                window.location.href = 'login.html';
            }
        }

        // Load messages
        function loadMessages(page = 1) {
            currentPage = page;
            currentStatus = document.getElementById('statusFilter').value;
            
            showLoading(true);
            
            let url = `../../../Backend/api/contact.php?page=${page}&limit=10`;
            if (currentStatus) {
                url += `&status=${currentStatus}`;
            }
            
            fetch(url, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include'
            })
            .then(response => response.json())
            .then(data => {
                showLoading(false);
                if (data.success) {
                    displayMessages(data.messages);
                    updatePagination(data.pagination);
                    updateStats(data.messages);
                } else {
                    showAlert(data.message, 'error');
                }
            })
            .catch(error => {
                showLoading(false);
                console.error('Error loading messages:', error);
                showAlert('Failed to load messages', 'error');
            });
        }

        // Display messages
        function displayMessages(messages) {
            const messagesList = document.getElementById('messagesList');
            
            // Store messages globally for quick access
            loadedMessages = messages;
            
            if (messages.length === 0) {
                messagesList.innerHTML = `
                    <div class="text-center py-8 text-gray-500">
                        <i class="fas fa-inbox text-4xl mb-4"></i>
                        <p>No messages found</p>
                    </div>
                `;
                return;
            }
            
            messagesList.innerHTML = messages.map(message => `
                <div class="border border-gray-200 rounded-lg p-4 hover:shadow-md transition-shadow">
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex-1">
                            <div class="flex items-center space-x-3 mb-2">
                                <h4 class="font-semibold text-lg">${message.first_name} ${message.last_name}</h4>
                                <span class="px-2 py-1 text-xs rounded-full ${getStatusBadgeClass(message.status)}">
                                    ${message.status.toUpperCase()}
                                </span>
                                ${message.user_name ? `<span class="text-sm text-gray-500">(Registered User)</span>` : ''}
                            </div>
                            <p class="text-gray-600 mb-1"><strong>Subject:</strong> ${message.subject}</p>
                            <p class="text-gray-600 mb-1"><strong>Email:</strong> ${message.email}</p>
                            <p class="text-gray-500 text-sm"><strong>Received:</strong> ${formatDate(message.created_at)}</p>
                        </div>
                        <div class="flex space-x-2">
                            <button onclick="viewMessage(${message.id})" class="text-blue-600 hover:text-blue-800">
                                <i class="fas fa-eye"></i>
                            </button>
                            ${message.status !== 'replied' ? `
                                <button onclick="openReplyModal(${message.id})" class="text-green-600 hover:text-green-800">
                                    <i class="fas fa-reply"></i>
                                </button>
                            ` : ''}
                            <button onclick="updateStatus(${message.id}, '${message.status === 'new' ? 'read' : 'closed'}')" class="text-gray-600 hover:text-gray-800">
                                <i class="fas fa-${message.status === 'new' ? 'check' : 'times'}"></i>
                            </button>
                        </div>
                    </div>
                    <div class="text-gray-700">
                        <p class="line-clamp-2">${message.message}</p>
                    </div>
                    ${message.admin_reply ? `
                        <div class="mt-3 p-3 bg-blue-50 rounded border-l-4 border-blue-400">
                            <p class="text-sm text-gray-600 mb-1"><strong>Admin Reply:</strong></p>
                            <p class="text-gray-700">${message.admin_reply}</p>
                            <p class="text-xs text-gray-500 mt-1">Replied by ${message.replied_by_name} on ${formatDate(message.replied_at)}</p>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        // Get status badge class
        function getStatusBadgeClass(status) {
            switch (status) {
                case 'new': return 'bg-red-100 text-red-800';
                case 'read': return 'bg-yellow-100 text-yellow-800';
                case 'replied': return 'bg-green-100 text-green-800';
                case 'closed': return 'bg-gray-100 text-gray-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        // Update pagination
        function updatePagination(pagination) {
            const paginationDiv = document.getElementById('pagination');
            
            if (pagination.pages <= 1) {
                paginationDiv.innerHTML = '';
                return;
            }
            
            let paginationHTML = '<div class="flex space-x-2">';
            
            // Previous button
            if (pagination.page > 1) {
                paginationHTML += `
                    <button onclick="loadMessages(${pagination.page - 1})" class="px-3 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                `;
            }
            
            // Page numbers
            for (let i = 1; i <= pagination.pages; i++) {
                if (i === pagination.page) {
                    paginationHTML += `
                        <button class="px-3 py-2 bg-blue-600 text-white rounded-md">
                            ${i}
                        </button>
                    `;
                } else {
                    paginationHTML += `
                        <button onclick="loadMessages(${i})" class="px-3 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">
                            ${i}
                        </button>
                    `;
                }
            }
            
            // Next button
            if (pagination.page < pagination.pages) {
                paginationHTML += `
                    <button onclick="loadMessages(${pagination.page + 1})" class="px-3 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                `;
            }
            
            paginationHTML += '</div>';
            paginationDiv.innerHTML = paginationHTML;
        }

        // Update stats
        function updateStats(messages) {
            const newCount = messages.filter(m => m.status === 'new').length;
            const repliedCount = messages.filter(m => m.status === 'replied').length;
            const totalCount = messages.length;
            
            document.getElementById('newCount').textContent = newCount;
            document.getElementById('repliedCount').textContent = repliedCount;
            document.getElementById('totalCount').textContent = totalCount;
        }

        // Open reply modal
        function openReplyModal(messageId) {
            // Find the message
            const message = getMessageById(messageId);
            if (!message) return;
            
            document.getElementById('replyMessageId').value = messageId;
            document.getElementById('adminReply').value = '';
            
            // Show message details
            document.getElementById('messageDetails').innerHTML = `
                <div class="mb-2">
                    <strong>From:</strong> ${message.first_name} ${message.last_name} (${message.email})
                </div>
                <div class="mb-2">
                    <strong>Subject:</strong> ${message.subject}
                </div>
                <div class="mb-2">
                    <strong>Message:</strong>
                </div>
                <div class="text-gray-700 bg-white p-3 rounded border">
                    ${message.message}
                </div>
            `;
            
            document.getElementById('replyModal').classList.remove('hidden');
            document.getElementById('replyModal').classList.add('flex');
        }

        // Close reply modal
        function closeReplyModal() {
            document.getElementById('replyModal').classList.add('hidden');
            document.getElementById('replyModal').classList.remove('flex');
        }

        // Handle reply form submission
        document.getElementById('replyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const messageId = document.getElementById('replyMessageId').value;
            const adminReply = document.getElementById('adminReply').value;
            
            if (!adminReply.trim()) {
                showAlert('Please enter a reply', 'error');
                return;
            }
            
            showLoading(true);
            
            fetch('../../../Backend/api/contact.php', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include',
                body: JSON.stringify({
                    messageId: messageId,
                    adminReply: adminReply
                })
            })
            .then(response => response.json())
            .then(data => {
                showLoading(false);
                if (data.success) {
                    showAlert('Reply sent successfully', 'success');
                    closeReplyModal();
                    loadMessages(currentPage);
                } else {
                    showAlert(data.message, 'error');
                }
            })
            .catch(error => {
                showLoading(false);
                console.error('Error sending reply:', error);
                showAlert('Failed to send reply', 'error');
            });
        });

        // Update message status
        function updateStatus(messageId, newStatus) {
            showLoading(true);
            
            fetch('../../../Backend/api/contact.php', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include',
                body: JSON.stringify({
                    messageId: messageId,
                    status: newStatus
                })
            })
            .then(response => response.json())
            .then(data => {
                showLoading(false);
                if (data.success) {
                    showAlert('Status updated successfully', 'success');
                    loadMessages(currentPage);
                } else {
                    showAlert(data.message, 'error');
                }
            })
            .catch(error => {
                showLoading(false);
                console.error('Error updating status:', error);
                showAlert('Failed to update status', 'error');
            });
        }

        // View message (placeholder for future implementation)
        function viewMessage(messageId) {
            // Find the message
            const message = getMessageById(messageId);
            if (!message) {
                showAlert('Message not found', 'error');
                return;
            }
            
            // Populate the view modal
            document.getElementById('viewMessageContent').innerHTML = `
                <div class="bg-gray-50 p-4 rounded-lg">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-600">From</label>
                            <p class="text-gray-900">${message.first_name} ${message.last_name}</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600">Email</label>
                            <p class="text-gray-900">${message.email}</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600">Subject</label>
                            <p class="text-gray-900">${message.subject}</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600">Status</label>
                            <span class="px-2 py-1 text-xs rounded-full ${getStatusBadgeClass(message.status)}">
                                ${message.status.charAt(0).toUpperCase() + message.status.slice(1)}
                            </span>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600">Date</label>
                            <p class="text-gray-900">${formatDate(message.created_at)}</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600">Message ID</label>
                            <p class="text-gray-900">#${message.id}</p>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-600 mb-2">Message</label>
                        <div class="bg-white p-4 rounded border text-gray-900 whitespace-pre-wrap">
                            ${message.message}
                        </div>
                    </div>
                    
                    ${message.admin_reply ? `
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-600 mb-2">Admin Reply</label>
                            <div class="bg-blue-50 p-4 rounded border-l-4 border-blue-400">
                                <p class="text-gray-900 whitespace-pre-wrap">${message.admin_reply}</p>
                                <div class="mt-2 text-sm text-gray-600">
                                    <i class="fas fa-user-md mr-1"></i>
                                    Replied by ${message.replied_by_name || 'Admin'} on ${formatDate(message.replied_at)}
                                </div>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
            
            // Show/hide reply button based on status
            const replyBtn = document.getElementById('replyFromViewBtn');
            if (message.status === 'replied') {
                replyBtn.style.display = 'none';
            } else {
                replyBtn.style.display = 'inline-block';
                replyBtn.setAttribute('data-message-id', messageId);
            }
            
            // Show the modal
            document.getElementById('viewModal').classList.remove('hidden');
            document.getElementById('viewModal').classList.add('flex');
        }

        // Close view modal
        function closeViewModal() {
            document.getElementById('viewModal').classList.add('hidden');
            document.getElementById('viewModal').classList.remove('flex');
        }

        // Reply from view modal
        function replyFromView() {
            const messageId = document.getElementById('replyFromViewBtn').getAttribute('data-message-id');
            closeViewModal();
            openReplyModal(messageId);
        }

        // Get message by ID (helper function)
        function getMessageById(messageId) {
            // Find message from currently loaded messages
            return loadedMessages.find(message => message.id == messageId);
        }

        // Show loading spinner
        function showLoading(show) {
            const spinner = document.getElementById('loadingSpinner');
            if (show) {
                spinner.classList.remove('hidden');
                spinner.classList.add('flex');
            } else {
                spinner.classList.add('hidden');
                spinner.classList.remove('flex');
            }
        }

        // Show alert
        function showAlert(message, type = 'info') {
            const alertDiv = document.createElement('div');
            alertDiv.className = `fixed top-4 right-4 p-4 rounded-md shadow-lg z-50 ${
                type === 'success' ? 'bg-green-100 text-green-800' :
                type === 'error' ? 'bg-red-100 text-red-800' :
                'bg-blue-100 text-blue-800'
            }`;
            alertDiv.innerHTML = `
                <div class="flex items-center">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'} mr-2"></i>
                    ${message}
                </div>
            `;
            
            document.body.appendChild(alertDiv);
            
            setTimeout(() => {
                alertDiv.remove();
            }, 3000);
        }

        // Format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
        }

        // Load unread messages count for badge
        async function loadUnreadMessagesCount() {
            try {
                const response = await fetch('../../../Backend/api/contact.php?page=1&limit=1&status=new', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include'
                });
                const data = await response.json();
                const badge = document.getElementById('unreadMessagesBadge');
                if (data.success && data.pagination && data.pagination.total > 0) {
                    badge.textContent = data.pagination.total;
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }
            } catch (error) {
                console.error('Failed to load unread messages count:', error);
                const badge = document.getElementById('unreadMessagesBadge');
                if (badge) badge.classList.add('hidden');
            }
        }

        // Logout function
        async function logout() {
            if (sharedAuth) {
                sharedAuth.logout();
            } else {
                try {
                    await fetch('../../../Backend/api/auth.php?action=signout', {
                        method: 'POST',
                        credentials: 'include'
                    });
                } catch (error) {
                    console.error('Logout error:', error);
                }
                window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>
