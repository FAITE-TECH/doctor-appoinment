<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - SPC Hospital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../public/css/styles.css">
</head>
<body class="bg-gray-100">
    <div class="min-h-screen flex items-center justify-center">
        <div class="max-w-md w-full space-y-8">
            <div>
                <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                    🏥 SPC Hospital Admin
                </h2>
                <p class="mt-2 text-center text-sm text-gray-600">
                    Sign in to access the admin panel
                </p>
            </div>
            <div class="bg-white py-8 px-6 shadow rounded-lg">
                <form id="adminLoginForm" class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700">
                            Email address
                        </label>
                        <input id="email" name="email" type="email" required 
                               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700">
                            Password
                        </label>
                        <input id="password" name="password" type="password" required 
                               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <button type="submit" 
                                class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                            Sign in to Admin Panel
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Force correct API base on hosted environment to avoid incorrect URL detection -->
    <script>
        if (window.location && window.location.hostname && window.location.hostname.indexOf('spchospital.com') !== -1) {
            // Production API location on the host
            window.APP_API_FOLDER = 'https://spchospital.com/Backend/api/';
            window.APP_API_BASE = 'https://spchospital.com/Backend/api/auth.php';
        }
    </script>
    <script src="../../public/js/script.js"></script>
    <script>
        // Handle admin login directly
        document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                alert('Please fill in all fields');
                return;
            }
            
                try {
                const apiUrl = (window.APP_API_BASE || (window.location.origin + '/doctor-appoinment' + '/Backend/api/auth.php')) + '?action=signin';
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({ email, password }),
                });
                
                let data;
                try { data = await response.json(); } catch (e) { throw new Error('Invalid server response'); }
                
                if (response.ok && data.user && data.user.role === 'admin') {
                    // Successfully logged in as admin
                    window.location.href = './index.html';
                } else {
                    alert(data.error || 'Invalid admin credentials');
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('Login failed. Please try again.');
            }
        });
    </script>
</body>
</html>
