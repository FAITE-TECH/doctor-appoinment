<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Management - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" type="image/png" href="../../public/assets/logo.png">
    <style>
        .time-slot { @apply border border-gray-300 rounded-lg p-3 cursor-pointer transition-colors; }
        .time-slot.available { @apply bg-green-50 border-green-300 hover:bg-green-100; }
        .time-slot.booked { @apply bg-red-50 border-red-300 cursor-not-allowed; }
        .time-slot.selected { @apply bg-blue-100 border-blue-500; }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Header -->
    <div id="header"></div>
    <script>
        fetch("../shared-nav.html")
            .then((res) => res.text())
            .then((data) => {
                document.getElementById("header").innerHTML = data;
                if (window.initNavigationAfterLoad) {
                    window.initNavigationAfterLoad();
                }
            });
    </script>

    <div class="container mx-auto px-4 py-8">
        <!-- Page Header -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800">📅 Schedule Management</h1>
                    <p class="text-gray-600 mt-2">View and manage appointment schedules for doctors</p>
                </div>
                <div class="flex gap-4">
                    <button id="addScheduleBtn" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition">
                        <i class="fas fa-plus mr-2"></i>Add Schedule
                    </button>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">Schedule Filters</h3>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Doctor</label>
                    <select id="doctorFilter" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">Select Doctor</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Date</label>
                    <input type="date" id="dateFilter" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Week</label>
                    <input type="week" id="weekFilter" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div class="flex items-end">
                    <button id="loadSchedule" class="w-full bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition">
                        Load Schedule
                    </button>
                </div>
            </div>
        </div>

        <!-- Schedule View -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-semibold text-gray-800">Doctor Schedule</h3>
                <div class="flex gap-2">
                    <button id="prevWeek" class="px-3 py-1 border border-gray-300 rounded-md hover:bg-gray-50">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <span id="currentWeek" class="px-4 py-1 text-sm font-medium text-gray-700"></span>
                    <button id="nextWeek" class="px-3 py-1 border border-gray-300 rounded-md hover:bg-gray-50">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>

            <!-- Schedule Grid -->
            <div id="scheduleGrid" class="grid grid-cols-8 gap-2">
                <!-- Schedule will be loaded here -->
            </div>
        </div>

        <!-- Schedule Details Modal -->
        <div id="scheduleModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50">
            <div class="flex items-center justify-center min-h-screen p-4">
                <div class="bg-white rounded-lg shadow-xl max-w-md w-full">
                    <div class="px-6 py-4 border-b border-gray-200">
                        <h3 class="text-lg font-semibold text-gray-800">Schedule Details</h3>
                    </div>
                    <div class="p-6">
                        <div id="scheduleDetails" class="space-y-4">
                            <!-- Details will be loaded here -->
                        </div>
                        <div class="flex justify-end mt-6">
                            <button id="closeScheduleModal" class="px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition">
                                Close
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Schedule Modal -->
        <div id="addScheduleModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50">
            <div class="flex items-center justify-center min-h-screen p-4">
                <div class="bg-white rounded-lg shadow-xl max-w-md w-full">
                    <div class="px-6 py-4 border-b border-gray-200">
                        <h3 class="text-lg font-semibold text-gray-800">Add Schedule</h3>
                    </div>
                    <div class="p-6">
                        <form id="addScheduleForm" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Doctor</label>
                                <select id="scheduleDoctor" name="doctor_id" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
                                    <option value="">Select Doctor</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Date</label>
                                <input type="date" id="scheduleDate" name="date" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Start Time</label>
                                <input type="time" id="scheduleStartTime" name="start_time" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">End Time</label>
                                <input type="time" id="scheduleEndTime" name="end_time" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Duration (minutes)</label>
                                <input type="number" id="scheduleDuration" name="duration" value="30" min="15" max="120" step="15" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
                            </div>
                            <div class="flex justify-end gap-3">
                                <button type="button" id="cancelAddSchedule" class="px-4 py-2 text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
                                    Cancel
                                </button>
                                <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition">
                                    Add Schedule
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="fixed top-5 right-5 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg hidden z-50">
            <div class="flex items-center">
                <i class="fas fa-check-circle mr-2"></i>
                <span id="toastMessage">Success!</span>
            </div>
        </div>
    </div>

    <script>
        let currentWeek = new Date();
        let selectedDoctor = '';
        let scheduleData = {};

        // Load doctors and initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadDoctors();
            setupEventListeners();
            updateCurrentWeek();
            loadSchedule();
        });

        function setupEventListeners() {
            // Filter controls
            document.getElementById('loadSchedule').addEventListener('click', loadSchedule);
            document.getElementById('doctorFilter').addEventListener('change', function() {
                selectedDoctor = this.value;
                loadSchedule();
            });

            // Week navigation
            document.getElementById('prevWeek').addEventListener('click', function() {
                currentWeek.setDate(currentWeek.getDate() - 7);
                updateCurrentWeek();
                loadSchedule();
            });

            document.getElementById('nextWeek').addEventListener('click', function() {
                currentWeek.setDate(currentWeek.getDate() + 7);
                updateCurrentWeek();
                loadSchedule();
            });

            // Modal controls
            document.getElementById('addScheduleBtn').addEventListener('click', openAddScheduleModal);
            document.getElementById('cancelAddSchedule').addEventListener('click', closeAddScheduleModal);
            document.getElementById('closeScheduleModal').addEventListener('click', closeScheduleModal);
            document.getElementById('addScheduleForm').addEventListener('submit', addSchedule);

            // Close modals when clicking outside
            document.getElementById('scheduleModal').addEventListener('click', function(e) {
                if (e.target === this) closeScheduleModal();
            });
            document.getElementById('addScheduleModal').addEventListener('click', function(e) {
                if (e.target === this) closeAddScheduleModal();
            });
        }

        async function loadDoctors() {
            try {
                const response = await fetch('/doctor-appoinment/Backend/api/doctors.php?action=doctors');
                const data = await response.json();
                
                if (data.status === 'success') {
                    const doctorSelects = ['doctorFilter', 'scheduleDoctor'];
                    
                    doctorSelects.forEach(selectId => {
                        const select = document.getElementById(selectId);
                        select.innerHTML = '<option value="">Select Doctor</option>';
                        
                        data.data.forEach(doctor => {
                            const option = document.createElement('option');
                            option.value = doctor.id;
                            option.textContent = doctor.name;
                            select.appendChild(option);
                        });
                    });
                }
            } catch (error) {
                console.error('Error loading doctors:', error);
            }
        }

        function updateCurrentWeek() {
            const startOfWeek = new Date(currentWeek);
            startOfWeek.setDate(currentWeek.getDate() - currentWeek.getDay());
            
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 6);
            
            document.getElementById('currentWeek').textContent = 
                `${startOfWeek.toLocaleDateString()} - ${endOfWeek.toLocaleDateString()}`;
        }

        async function loadSchedule() {
            if (!selectedDoctor) {
                document.getElementById('scheduleGrid').innerHTML = '<div class="col-span-8 text-center text-gray-500 py-8">Please select a doctor to view schedule</div>';
                return;
            }

            try {
                const startOfWeek = new Date(currentWeek);
                startOfWeek.setDate(currentWeek.getDate() - currentWeek.getDay());
                
                const endOfWeek = new Date(startOfWeek);
                endOfWeek.setDate(startOfWeek.getDate() + 6);

                // Load appointments for the selected doctor and week
                const params = new URLSearchParams({
                    action: 'list',
                    doctor_id: selectedDoctor,
                    start_date: startOfWeek.toISOString().split('T')[0],
                    end_date: endOfWeek.toISOString().split('T')[0],
                    limit: 1000
                });

                const response = await fetch(`/doctor-appoinment/Backend/api/appointments.php?${params}`);
                const data = await response.json();
                
                if (data.appointments) {
                    renderSchedule(data.appointments, startOfWeek);
                } else {
                    showToast('Error loading schedule', 'error');
                }
            } catch (error) {
                console.error('Error loading schedule:', error);
                showToast('Network error loading schedule', 'error');
            }
        }

        function renderSchedule(appointments, startOfWeek) {
            const grid = document.getElementById('scheduleGrid');
            grid.innerHTML = '';

            // Create header row
            const days = ['Time', 'Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            days.forEach(day => {
                const header = document.createElement('div');
                header.className = 'font-semibold text-gray-700 p-2 text-center bg-gray-100 rounded';
                header.textContent = day;
                grid.appendChild(header);
            });

            // Generate time slots (9 AM to 5 PM, 30-minute intervals)
            const timeSlots = [];
            for (let hour = 9; hour < 17; hour++) {
                for (let minute = 0; minute < 60; minute += 30) {
                    const time = `${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}`;
                    timeSlots.push(time);
                }
            }

            // Create schedule grid
            timeSlots.forEach(time => {
                // Time column
                const timeCell = document.createElement('div');
                timeCell.className = 'p-2 text-sm text-gray-600 bg-gray-50 text-center';
                timeCell.textContent = new Date(`2000-01-01 ${time}`).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                grid.appendChild(timeCell);

                // Day columns
                for (let day = 0; day < 7; day++) {
                    const cellDate = new Date(startOfWeek);
                    cellDate.setDate(startOfWeek.getDate() + day);
                    const dateStr = cellDate.toISOString().split('T')[0];

                    const cell = document.createElement('div');
                    cell.className = 'time-slot available min-h-[60px] p-2';
                    
                    // Check if there's an appointment at this time
                    const appointment = appointments.find(apt => 
                        apt.appointment_date === dateStr && 
                        apt.appointment_time === time
                    );

                    if (appointment) {
                        cell.className = 'time-slot booked min-h-[60px] p-2';
                        cell.innerHTML = `
                            <div class="text-xs">
                                <div class="font-medium">${appointment.patient_name}</div>
                                <div class="text-gray-500">${appointment.status}</div>
                            </div>
                        `;
                        cell.addEventListener('click', () => viewAppointmentDetails(appointment));
                    } else {
                        cell.addEventListener('click', () => openAddScheduleModal(dateStr, time));
                    }

                    grid.appendChild(cell);
                }
            });
        }

        function openAddScheduleModal(date = '', time = '') {
            document.getElementById('addScheduleModal').classList.remove('hidden');
            
            if (date) {
                document.getElementById('scheduleDate').value = date;
            }
            if (time) {
                document.getElementById('scheduleStartTime').value = time;
            }
        }

        function closeAddScheduleModal() {
            document.getElementById('addScheduleModal').classList.add('hidden');
            document.getElementById('addScheduleForm').reset();
        }

        async function addSchedule(e) {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const scheduleData = {
                doctor_id: formData.get('doctor_id'),
                date: formData.get('date'),
                start_time: formData.get('start_time'),
                end_time: formData.get('end_time'),
                duration: formData.get('duration')
            };

            // For now, we'll just show a success message
            // In a real implementation, you'd send this to the backend
            showToast('Schedule added successfully');
            closeAddScheduleModal();
            loadSchedule();
        }

        function viewAppointmentDetails(appointment) {
            const appointmentDate = new Date(appointment.appointment_date + ' ' + appointment.appointment_time);
            
            document.getElementById('scheduleDetails').innerHTML = `
                <div class="space-y-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Patient</label>
                        <p class="text-sm text-gray-900">${appointment.patient_name}</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Email</label>
                        <p class="text-sm text-gray-900">${appointment.patient_email}</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Date & Time</label>
                        <p class="text-sm text-gray-900">${appointmentDate.toLocaleDateString()} at ${appointmentDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Status</label>
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full status-${appointment.status}">
                            ${appointment.status.charAt(0).toUpperCase() + appointment.status.slice(1)}
                        </span>
                    </div>
                    ${appointment.notes ? `
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Notes</label>
                            <p class="text-sm text-gray-900">${appointment.notes}</p>
                        </div>
                    ` : ''}
                </div>
            `;
            
            document.getElementById('scheduleModal').classList.remove('hidden');
        }

        function closeScheduleModal() {
            document.getElementById('scheduleModal').classList.add('hidden');
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            
            toastMessage.textContent = message;
            
            if (type === 'error') {
                toast.className = toast.className.replace('bg-green-500', 'bg-red-500');
            } else {
                toast.className = toast.className.replace('bg-red-500', 'bg-green-500');
            }
            
            toast.classList.remove('hidden');
            
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }
    </script>
</body>
</html>
