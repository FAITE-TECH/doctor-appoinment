<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications & Alerts - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" type="image/png" href="../../public/assets/logo.png">
    <style>
        .notification-unread { @apply bg-blue-50 border-l-4 border-blue-500; }
        .notification-read { @apply bg-gray-50 border-l-4 border-gray-300; }
        .notification-urgent { @apply bg-red-50 border-l-4 border-red-500; }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Header -->
    <div id="header"></div>
    <script>
        fetch("../shared-nav.html")
            .then((res) => res.text())
            .then((data) => {
                document.getElementById("header").innerHTML = data;
                if (window.initNavigationAfterLoad) {
                    window.initNavigationAfterLoad();
                }
            });
    </script>

    <div class="container mx-auto px-4 py-8">
        <!-- Page Header -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800">🔔 Notifications & Alerts</h1>
                    <p class="text-gray-600 mt-2">Manage appointment reminders and system alerts</p>
                </div>
                <div class="flex gap-4">
                    <button id="markAllRead" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition">
                        <i class="fas fa-check-double mr-2"></i>Mark All Read
                    </button>
                    <button id="sendReminder" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 transition">
                        <i class="fas fa-paper-plane mr-2"></i>Send Reminder
                    </button>
                </div>
            </div>
        </div>

        <!-- Notification Settings -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">Notification Settings</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <h4 class="font-medium text-gray-700 mb-3">Appointment Reminders</h4>
                    <div class="space-y-3">
                        <label class="flex items-center">
                            <input type="checkbox" id="reminder24h" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500" checked>
                            <span class="ml-2 text-sm text-gray-700">24 hours before</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" id="reminder2h" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500" checked>
                            <span class="ml-2 text-sm text-gray-700">2 hours before</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" id="reminder30min" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            <span class="ml-2 text-sm text-gray-700">30 minutes before</span>
                        </label>
                    </div>
                </div>
                <div>
                    <h4 class="font-medium text-gray-700 mb-3">System Alerts</h4>
                    <div class="space-y-3">
                        <label class="flex items-center">
                            <input type="checkbox" id="alertNewAppointment" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500" checked>
                            <span class="ml-2 text-sm text-gray-700">New appointments</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" id="alertCancellation" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500" checked>
                            <span class="ml-2 text-sm text-gray-700">Cancellations</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" id="alertNoShow" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500" checked>
                            <span class="ml-2 text-sm text-gray-700">No-shows</span>
                        </label>
                    </div>
                </div>
                <div>
                    <h4 class="font-medium text-gray-700 mb-3">Delivery Methods</h4>
                    <div class="space-y-3">
                        <label class="flex items-center">
                            <input type="checkbox" id="deliveryEmail" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500" checked>
                            <span class="ml-2 text-sm text-gray-700">Email</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" id="deliverySMS" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            <span class="ml-2 text-sm text-gray-700">SMS</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" id="deliveryInApp" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500" checked>
                            <span class="ml-2 text-sm text-gray-700">In-app notifications</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Upcoming Appointments -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold text-gray-800">Upcoming Appointments (Next 24 Hours)</h3>
                <button id="refreshUpcoming" class="text-blue-600 hover:text-blue-800">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
            <div id="upcomingAppointments" class="space-y-3">
                <!-- Upcoming appointments will be loaded here -->
            </div>
        </div>

        <!-- Recent Notifications -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold text-gray-800">Recent Notifications</h3>
                <div class="flex gap-2">
                    <select id="notificationFilter" class="border border-gray-300 rounded-lg px-3 py-1 text-sm">
                        <option value="all">All</option>
                        <option value="unread">Unread</option>
                        <option value="urgent">Urgent</option>
                    </select>
                </div>
            </div>
            <div id="notificationsList" class="space-y-3">
                <!-- Notifications will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Send Reminder Modal -->
    <div id="reminderModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl max-w-md w-full">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h3 class="text-lg font-semibold text-gray-800">Send Appointment Reminder</h3>
                </div>
                <div class="p-6">
                    <form id="reminderForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Select Appointment</label>
                            <select id="reminderAppointment" name="appointment_id" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
                                <option value="">Select appointment</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Message Type</label>
                            <select id="reminderType" name="type" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
                                <option value="reminder">Appointment Reminder</option>
                                <option value="confirmation">Confirmation</option>
                                <option value="reschedule">Reschedule Request</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Custom Message (Optional)</label>
                            <textarea id="reminderMessage" name="message" rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Leave empty to use default message"></textarea>
                        </div>
                        <div class="flex justify-end gap-3">
                            <button type="button" id="cancelReminder" class="px-4 py-2 text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
                                Cancel
                            </button>
                            <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition">
                                Send Reminder
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 right-5 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg hidden z-50">
        <div class="flex items-center">
            <i class="fas fa-check-circle mr-2"></i>
            <span id="toastMessage">Success!</span>
        </div>
    </div>

    <script>
        let notificationsData = [];
        let upcomingAppointments = [];

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
            loadUpcomingAppointments();
            loadNotifications();
        });

        function setupEventListeners() {
            // Button controls
            document.getElementById('markAllRead').addEventListener('click', markAllAsRead);
            document.getElementById('sendReminder').addEventListener('click', openReminderModal);
            document.getElementById('refreshUpcoming').addEventListener('click', loadUpcomingAppointments);

            // Filter controls
            document.getElementById('notificationFilter').addEventListener('change', filterNotifications);

            // Modal controls
            document.getElementById('cancelReminder').addEventListener('click', closeReminderModal);
            document.getElementById('reminderForm').addEventListener('submit', sendReminder);

            // Close modal when clicking outside
            document.getElementById('reminderModal').addEventListener('click', function(e) {
                if (e.target === this) closeReminderModal();
            });
        }

        async function loadUpcomingAppointments() {
            try {
                const today = new Date();
                const tomorrow = new Date(today);
                tomorrow.setDate(today.getDate() + 1);

                const params = new URLSearchParams({
                    action: 'list',
                    start_date: today.toISOString().split('T')[0],
                    end_date: tomorrow.toISOString().split('T')[0],
                    status: 'confirmed,pending',
                    limit: 50
                });

                const response = await fetch(`/doctor-appoinment/Backend/api/appointments.php?${params}`);
                const data = await response.json();
                
                if (data.appointments) {
                    upcomingAppointments = data.appointments;
                    renderUpcomingAppointments();
                }
            } catch (error) {
                console.error('Error loading upcoming appointments:', error);
            }
        }

        function renderUpcomingAppointments() {
            const container = document.getElementById('upcomingAppointments');
            container.innerHTML = '';

            if (upcomingAppointments.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-4">No upcoming appointments</p>';
                return;
            }

            upcomingAppointments.forEach(appointment => {
                const appointmentDate = new Date(appointment.appointment_date + ' ' + appointment.appointment_time);
                const timeUntil = getTimeUntil(appointmentDate);
                
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between p-4 bg-blue-50 rounded-lg border border-blue-200';
                div.innerHTML = `
                    <div class="flex items-center">
                        <div class="flex-shrink-0">
                            <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center">
                                <i class="fas fa-calendar text-white"></i>
                            </div>
                        </div>
                        <div class="ml-4">
                            <div class="text-sm font-medium text-gray-900">${appointment.patient_name}</div>
                            <div class="text-sm text-gray-600">${appointment.doctor_name} - ${appointment.specialization}</div>
                            <div class="text-xs text-gray-500">${appointmentDate.toLocaleDateString()} at ${appointmentDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-sm font-medium text-blue-600">${timeUntil}</div>
                        <button onclick="sendQuickReminder(${appointment.id})" class="text-xs text-blue-600 hover:text-blue-800 mt-1">
                            <i class="fas fa-paper-plane mr-1"></i>Send Reminder
                        </button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function getTimeUntil(date) {
            const now = new Date();
            const diff = date - now;
            
            if (diff < 0) return 'Overdue';
            
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            
            if (hours > 0) {
                return `In ${hours}h ${minutes}m`;
            } else {
                return `In ${minutes}m`;
            }
        }

        function loadNotifications() {
            // Mock notifications data - in a real app, this would come from the backend
            notificationsData = [
                {
                    id: 1,
                    type: 'appointment',
                    title: 'New Appointment Booked',
                    message: 'John Doe has booked an appointment with Dr. Smith for tomorrow at 2:00 PM',
                    timestamp: new Date(Date.now() - 30 * 60 * 1000), // 30 minutes ago
                    read: false,
                    urgent: false
                },
                {
                    id: 2,
                    type: 'reminder',
                    title: 'Appointment Reminder Sent',
                    message: 'Reminder sent to Sarah Johnson for appointment at 10:00 AM',
                    timestamp: new Date(Date.now() - 2 * 60 * 60 * 1000), // 2 hours ago
                    read: true,
                    urgent: false
                },
                {
                    id: 3,
                    type: 'cancellation',
                    title: 'Appointment Cancelled',
                    message: 'Mike Wilson cancelled his appointment scheduled for today at 3:00 PM',
                    timestamp: new Date(Date.now() - 4 * 60 * 60 * 1000), // 4 hours ago
                    read: false,
                    urgent: true
                },
                {
                    id: 4,
                    type: 'system',
                    title: 'System Maintenance',
                    message: 'Scheduled maintenance will occur tonight from 11 PM to 1 AM',
                    timestamp: new Date(Date.now() - 6 * 60 * 60 * 1000), // 6 hours ago
                    read: true,
                    urgent: false
                }
            ];

            renderNotifications();
        }

        function renderNotifications() {
            const container = document.getElementById('notificationsList');
            const filter = document.getElementById('notificationFilter').value;
            
            let filteredNotifications = notificationsData;
            
            if (filter === 'unread') {
                filteredNotifications = notificationsData.filter(n => !n.read);
            } else if (filter === 'urgent') {
                filteredNotifications = notificationsData.filter(n => n.urgent);
            }

            container.innerHTML = '';

            if (filteredNotifications.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-4">No notifications found</p>';
                return;
            }

            filteredNotifications.forEach(notification => {
                const div = document.createElement('div');
                const baseClass = notification.urgent ? 'notification-urgent' : 
                                 notification.read ? 'notification-read' : 'notification-unread';
                
                div.className = `p-4 rounded-lg ${baseClass}`;
                div.innerHTML = `
                    <div class="flex items-start justify-between">
                        <div class="flex-1">
                            <div class="flex items-center">
                                <i class="fas fa-${getNotificationIcon(notification.type)} text-sm mr-2"></i>
                                <h4 class="text-sm font-medium text-gray-900">${notification.title}</h4>
                                ${notification.urgent ? '<span class="ml-2 px-2 py-1 text-xs bg-red-100 text-red-800 rounded-full">Urgent</span>' : ''}
                            </div>
                            <p class="text-sm text-gray-600 mt-1">${notification.message}</p>
                            <p class="text-xs text-gray-500 mt-2">${formatTimestamp(notification.timestamp)}</p>
                        </div>
                        <div class="flex items-center ml-4">
                            ${!notification.read ? '<div class="w-2 h-2 bg-blue-500 rounded-full mr-2"></div>' : ''}
                            <button onclick="markAsRead(${notification.id})" class="text-gray-400 hover:text-gray-600">
                                <i class="fas fa-check"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function getNotificationIcon(type) {
            const icons = {
                'appointment': 'calendar-plus',
                'reminder': 'bell',
                'cancellation': 'calendar-times',
                'system': 'cog'
            };
            return icons[type] || 'bell';
        }

        function formatTimestamp(timestamp) {
            const now = new Date();
            const diff = now - timestamp;
            
            const minutes = Math.floor(diff / (1000 * 60));
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            
            if (minutes < 60) {
                return `${minutes} minutes ago`;
            } else if (hours < 24) {
                return `${hours} hours ago`;
            } else {
                return `${days} days ago`;
            }
        }

        function filterNotifications() {
            renderNotifications();
        }

        function markAsRead(notificationId) {
            const notification = notificationsData.find(n => n.id === notificationId);
            if (notification) {
                notification.read = true;
                renderNotifications();
            }
        }

        function markAllAsRead() {
            notificationsData.forEach(notification => {
                notification.read = true;
            });
            renderNotifications();
            showToast('All notifications marked as read');
        }

        function openReminderModal() {
            // Populate appointment dropdown
            const appointmentSelect = document.getElementById('reminderAppointment');
            appointmentSelect.innerHTML = '<option value="">Select appointment</option>';
            
            upcomingAppointments.forEach(appointment => {
                const appointmentDate = new Date(appointment.appointment_date + ' ' + appointment.appointment_time);
                const option = document.createElement('option');
                option.value = appointment.id;
                option.textContent = `${appointment.patient_name} - ${appointmentDate.toLocaleDateString()} ${appointmentDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
                appointmentSelect.appendChild(option);
            });

            document.getElementById('reminderModal').classList.remove('hidden');
        }

        function closeReminderModal() {
            document.getElementById('reminderModal').classList.add('hidden');
            document.getElementById('reminderForm').reset();
        }

        function sendReminder(e) {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const reminderData = {
                appointment_id: formData.get('appointment_id'),
                type: formData.get('type'),
                message: formData.get('message')
            };

            // In a real app, this would send to the backend
            showToast('Reminder sent successfully');
            closeReminderModal();
            
            // Add notification
            const appointment = upcomingAppointments.find(apt => apt.id == reminderData.appointment_id);
            if (appointment) {
                notificationsData.unshift({
                    id: Date.now(),
                    type: 'reminder',
                    title: 'Reminder Sent',
                    message: `Reminder sent to ${appointment.patient_name} for appointment at ${new Date(appointment.appointment_date + ' ' + appointment.appointment_time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`,
                    timestamp: new Date(),
                    read: false,
                    urgent: false
                });
                renderNotifications();
            }
        }

        function sendQuickReminder(appointmentId) {
            const appointment = upcomingAppointments.find(apt => apt.id === appointmentId);
            if (appointment) {
                // In a real app, this would send to the backend
                showToast(`Quick reminder sent to ${appointment.patient_name}`);
                
                // Add notification
                notificationsData.unshift({
                    id: Date.now(),
                    type: 'reminder',
                    title: 'Quick Reminder Sent',
                    message: `Quick reminder sent to ${appointment.patient_name}`,
                    timestamp: new Date(),
                    read: false,
                    urgent: false
                });
                renderNotifications();
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            
            toastMessage.textContent = message;
            
            if (type === 'error') {
                toast.className = toast.className.replace('bg-green-500', 'bg-red-500');
            } else {
                toast.className = toast.className.replace('bg-red-500', 'bg-green-500');
            }
            
            toast.classList.remove('hidden');
            
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }
    </script>
</body>
</html>
