<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Services - SPC Hospital Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://spchospital.com/Frontend/public/css/styles.css">
    <script src="./shared/admin-nav.js"></script>
    <!-- Small local fixes: remove mobile/browser focus/tap highlight and unwanted outline on sidebar links -->
    <style>
        /* Remove the blue tap highlight on iOS/Android when tapping links */
        html, body, a, button {
            -webkit-tap-highlight-color: rgba(0,0,0,0);
            -webkit-tap-highlight-color: transparent;
        }

        /* Sidebar link focus/active fixes to avoid extra blue bars/gaps while keeping visual active state */
        nav a:focus,
        nav a:active,
        nav a:focus-visible {
            outline: none !important;
            box-shadow: none !important;
            background-image: none !important;
            border-color: transparent !important;
        }

        /* If Tailwind or browser adds an inner highlight, force background only, no extra borders */
        nav a[aria-current],
        nav a.active,
        nav a.bg-blue-100 {
            /* preserve the intended background color but remove any surrounding stroke/outline */
            box-shadow: none !important;
            outline: none !important;
            border: none !important;
        }

        /* For safari/ios, sometimes form controls get an inner focus ring -- remove it for sidebar anchors */
        nav a::-moz-focus-inner { border: 0; }
    </style>
</head>
<body class="bg-gray-100">

                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"></path>

                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">

    <!-- Main Content -->
    <div class="flex-1 p-4 sm:p-6 md:p-8">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 sm:mb-8 gap-4">
                <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">Manage Services</h1>
                <button id="addServiceBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg w-full sm:w-auto">
                    + Add Service
                </button>
            </div>

            <!-- Search Bar -->
            <div class="mb-6">
                <div class="relative max-w-md">
                    <input
                        type="text"
                        id="serviceSearch"
                        placeholder="Search services by name, description, or price..."
                        class="w-full px-4 py-2 pl-10 pr-10 text-gray-700 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    />
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                    <button
                        id="clearServiceSearch"
                        class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600 hidden"
                    >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>

                    </button>

            </div>

            <!-- Services Cards Grid (replaces table) -->
            <div class="rounded-lg overflow-hidden">
                <div class="p-4">
                    <div id="servicesContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        <div class="col-span-full text-center text-gray-500">Loading...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Service Modal -->
    <div id="serviceModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden overflow-y-auto h-full w-full z-50">
        <div class="relative top-10 sm:top-20 mx-auto p-4 sm:p-5 border w-11/12 sm:w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3">
                <h3 id="modalTitle" class="text-lg font-medium text-gray-900 mb-4">Add Service</h3>
                <form id="serviceForm" enctype="multipart/form-data">
                    <input type="hidden" id="serviceId" name="id">
                    <div class="mb-4">
                        <label for="serviceName" class="block text-sm font-medium text-gray-700 mb-2">Service Name</label>
                        <input type="text" id="serviceName" name="name" required 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div class="mb-4">
                        <label for="serviceDescription" class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                        <textarea id="serviceDescription" name="description" rows="3" required
                                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500"></textarea>
                    </div>
                    <div class="mb-4">
                        <label for="servicePrice" class="block text-sm font-medium text-gray-700 mb-2">Price (Rs)</label>
                        <input type="number" id="servicePrice" name="price" step="0.01" min="0" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div class="mb-4">
                        <label for="serviceImage" class="block text-sm font-medium text-gray-700 mb-2">Image (optional)</label>
                        <input type="file" id="serviceImage" name="image" accept="image/*"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <!-- Upload progress (hidden until upload starts) -->
                    <div id="uploadProgressWrapper" class="mb-4 hidden">
                        <div class="text-sm text-gray-600 mb-1">Uploading image: <span id="uploadProgressPercent">0%</span></div>
                        <div class="w-full bg-gray-200 rounded overflow-hidden h-3">
                            <div id="uploadProgressBar" class="bg-blue-600 h-3 w-0"></div>
                        </div>
                    </div>

                    <div class="flex justify-end space-x-3">
                        <button type="button" id="cancelServiceBtn" 
                                class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400">
                            Cancel
                        </button>
                        <button type="submit" id="saveServiceBtn"
                                class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                            Save
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://spchospital.com/Frontend/public/js/config.js"></script>
    <script src="https://spchospital.com/Frontend/public/js/script.js"></script>
    <script src="https://spchospital.com/Frontend/pages/admin/js/shared-auth.js"></script>
    <script>
        // Service management functionality
        let services = [];
        let editingServiceId = null;
        let currentSearchTerm = '';
        let searchTimeout = null;

        // Load services
        async function loadServices(searchTerm = '') {
            try {
                // Check if user is authenticated
                if (typeof sharedAuth !== 'undefined' && !sharedAuth.canAccess()) {
                    showAuthMessage();
                    return;
                }

                let url = (window.buildApiUrl ? window.buildApiUrl('services.php') : (window.APP_API_FOLDER ? window.APP_API_FOLDER + 'services.php' : 'https://spchospital.com/Backend/api/services.php'));
                if (searchTerm) {
                    url += '?search=' + encodeURIComponent(searchTerm);
                }

                const response = await fetch(url);
                if (response.status === 403) {
                    showAuthMessage();
                    return;
                }
                
                const data = await response.json();
                services = data.services || [];
                displayServices();
            } catch (error) {
                console.error('Error loading services:', error);
                showAuthMessage();
            }
        }

        function showAuthMessage() {
            const container = document.getElementById('servicesContainer');
            if (!container) return;
            container.innerHTML = `
                <div class="col-span-full text-center py-8">
                    <div class="text-gray-500 mb-2">Authentication required to view services</div>
                    <a href="login.html" class="text-blue-600 hover:text-blue-800 underline">Click here to login</a>
                </div>
            `;
        }

        // Build a usable image URL for service images (mirrors doctors/events helpers)
        function buildServiceImageUrl(imagePath) {
            if (!imagePath) return null;
            const imgPath = String(imagePath || '');
            if (imgPath.startsWith('http')) return imgPath;
            if (imgPath.startsWith('/')) return window.location.origin + imgPath;

            const imgName = imgPath.split('/').pop();
            if (!imgName) return null;
            if (typeof window.buildUploadUrl === 'function') {
                return window.buildUploadUrl('services/' + imgName);
            }
            const basePath = window.location.pathname.includes('/doctor-appoinment') ? window.location.pathname.split('/doctor-appoinment')[0] + '/doctor-appoinment' : '';
            return window.location.origin + basePath + '/uploads/services/' + imgName;
        }

        // Display services as responsive cards (mobile-first)
        function displayServices() {
            const container = document.getElementById('servicesContainer');
            if (!container) return;

            if (!services || services.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center text-gray-500 py-8">No services found</div>';
                return;
            }

            container.innerHTML = services.map(service => {
                const assetPlaceholder = (typeof window.buildAssetUrl === 'function') ? window.buildAssetUrl('assets/service-placeholder.png') : (window.location.origin + '/Frontend/public/assets/service-placeholder.png');
                let img = buildServiceImageUrl(service.image_path) || assetPlaceholder;

                return `
                    <div class="bg-transparent border border-gray-200/50 rounded-lg overflow-hidden shadow-sm hover:shadow-lg transition flex flex-col">
                        <div class="h-44 w-full bg-gray-100 overflow-hidden flex items-center justify-center">
                            <img src="${img}" alt="${service.name}" class="object-cover w-full h-full" onerror="this.onerror=null;this.src='${assetPlaceholder}';" />
                        </div>
                        <div class="p-4 flex-1 flex flex-col relative pb-12">
                            <h3 class="text-lg font-semibold text-gray-900 mb-1">${service.name}</h3>
                            <p class="text-sm text-gray-600 mb-2">${service.description || ''}</p>
                            <div class="text-sm text-gray-500 mb-2">Rs ${parseFloat(service.price || 0).toFixed(2)}</div>

                            <div class="absolute bottom-3 right-3 flex gap-2">
                                <button class="text-blue-600 hover:text-blue-900 px-2 py-1 rounded" onclick="editService(${service.id})">Edit</button>
                                <button class="text-red-600 hover:text-red-900 px-2 py-1 rounded" onclick="deleteService(${service.id})">Delete</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Show modal for adding/editing
        function showServiceModal(isEdit = false) {
            const modal = document.getElementById('serviceModal');
            const title = document.getElementById('modalTitle');
            const form = document.getElementById('serviceForm');
            
            if (isEdit) {
                title.textContent = 'Edit Service';
            } else {
                title.textContent = 'Add Service';
                form.reset();
                editingServiceId = null;
            }
            
            modal.classList.remove('hidden');
        }

        // Hide modal
        function hideServiceModal() {
            document.getElementById('serviceModal').classList.add('hidden');
        }

        // Edit service
        function editService(id) {
            const service = services.find(s => s.id == id);
            if (service) {
                editingServiceId = id;
                document.getElementById('serviceName').value = service.name;
                document.getElementById('serviceDescription').value = service.description || '';
                document.getElementById('servicePrice').value = service.price;
                showServiceModal(true);
            }
        }

        // Delete service
        async function deleteService(id) {
            if (confirm('Are you sure you want to delete this service?')) {
                try {
                    const response = await fetch((window.buildApiUrl ? window.buildApiUrl(`services.php?id=${id}`) : (window.APP_API_FOLDER ? window.APP_API_FOLDER + `services.php?id=${id}` : `https://spchospital.com/Backend/api/services.php?id=${id}`)), {
                        method: 'DELETE'
                    });
                    if (response.ok) {
                        loadServices();
                    }
                } catch (error) {
                    console.error('Error deleting service:', error);
                }
            }
        }

        // Setup search functionality
        function setupSearchFunctionality() {
            const searchInput = document.getElementById('serviceSearch');
            const clearButton = document.getElementById('clearServiceSearch');

            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    const searchTerm = e.target.value.trim();
                    currentSearchTerm = searchTerm;
                    
                    // Show/hide clear button
                    if (clearButton) {
                        if (searchTerm) {
                            clearButton.classList.remove('hidden');
                        } else {
                            clearButton.classList.add('hidden');
                        }
                    }
                    
                    // Debounce search to avoid too many API calls
                    clearTimeout(searchTimeout);
                    searchTimeout = setTimeout(() => {
                        loadServices(searchTerm);
                    }, 300);
                });
            }

            if (clearButton) {
                clearButton.addEventListener('click', () => {
                    if (searchInput) {
                        searchInput.value = '';
                        currentSearchTerm = '';
                        clearButton.classList.add('hidden');
                        loadServices('');
                    }
                });
            }
        }

        // Event listeners
        document.getElementById('addServiceBtn').addEventListener('click', () => showServiceModal(false));
        document.getElementById('cancelServiceBtn').addEventListener('click', hideServiceModal);
        
        document.getElementById('serviceForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            try {
                const url = editingServiceId 
                    ? (window.buildApiUrl ? window.buildApiUrl(`services.php?id=${editingServiceId}`) : (window.APP_API_FOLDER ? window.APP_API_FOLDER + `services.php?id=${editingServiceId}` : `https://spchospital.com/Backend/api/services.php?id=${editingServiceId}`))
                    : (window.buildApiUrl ? window.buildApiUrl('services.php') : (window.APP_API_FOLDER ? window.APP_API_FOLDER + 'services.php' : 'https://spchospital.com/Backend/api/services.php'));

                const method = editingServiceId ? 'PUT' : 'POST';

                if (editingServiceId) {
                    // Edit via JSON
                    const formData = new FormData(e.target);
                    const serviceData = {
                        name: formData.get('name'),
                        description: formData.get('description'),
                        price: parseFloat(formData.get('price'))
                    };
                    const response = await fetch(url, {
                        method: method,
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(serviceData)
                    });
                    if (response.ok) {
                        hideServiceModal();
                        loadServices();
                    }
                    return;
                }

                // Create flow (multipart) - use XHR for upload progress
                const form = e.target;
                const formData = new FormData(form);

                const saveBtn = document.getElementById('saveServiceBtn');
                const progressWrapper = document.getElementById('uploadProgressWrapper');
                const progressBar = document.getElementById('uploadProgressBar');
                const progressPercent = document.getElementById('uploadProgressPercent');

                // Disable save and show progress
                saveBtn.disabled = true;
                saveBtn.classList.add('opacity-60', 'cursor-not-allowed');
                if (progressWrapper) progressWrapper.classList.remove('hidden');

                const xhr = new XMLHttpRequest();
                xhr.open('POST', url, true);
                xhr.withCredentials = true;

                xhr.upload.addEventListener('progress', (evt) => {
                    if (!evt.lengthComputable) return;
                    const percent = Math.round((evt.loaded / evt.total) * 100);
                    if (progressBar) progressBar.style.width = percent + '%';
                    if (progressPercent) progressPercent.textContent = percent + '%';
                });

                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        saveBtn.disabled = false;
                        saveBtn.classList.remove('opacity-60', 'cursor-not-allowed');
                        if (xhr.status >= 200 && xhr.status < 300) {
                            hideServiceModal();
                            loadServices();
                        } else {
                            console.error('Upload failed', xhr.status, xhr.responseText);
                            alert('Failed to save service. Please try again.');
                        }
                        // reset progress UI after a small delay
                        setTimeout(() => {
                            if (progressBar) progressBar.style.width = '0%';
                            if (progressPercent) progressPercent.textContent = '0%';
                            if (progressWrapper) progressWrapper.classList.add('hidden');
                        }, 800);
                    }
                };

                xhr.send(formData);

            } catch (error) {
                console.error('Error saving service:', error);
                const saveBtn = document.getElementById('saveServiceBtn');
                if (saveBtn) {
                    saveBtn.disabled = false;
                    saveBtn.classList.remove('opacity-60', 'cursor-not-allowed');
                }
                const progressWrapper = document.getElementById('uploadProgressWrapper');
                if (progressWrapper) progressWrapper.classList.add('hidden');
            }
        });

        // Load services on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadServices();
            setupSearchFunctionality();
        });
    </script>
    <!-- scripts already included above: config.js, script.js, shared-auth.js, admin.js -->
</body>
</html>
