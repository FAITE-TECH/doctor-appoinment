                    + Upload Image
                </button>
            </div>

            <!-- Gallery Grid -->

    <!-- Add/Edit Image Modal -->
    <div id="imageModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden overflow-y-auto h-full w-full">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3">
                <h3 id="modalTitle" class="text-lg font-medium text-gray-900 mb-4">Upload Image</h3>
                <form id="imageForm" enctype="multipart/form-data">
                    <input type="hidden" id="imageId" name="id">
                    <div class="mb-4">
                        <label for="imageTitle" class="block text-sm font-medium text-gray-700 mb-2">Title</label>
                        <input type="text" id="imageTitle" name="title" required 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div class="mb-4">
                        <label for="imageDescription" class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                        <textarea id="imageDescription" name="description" rows="3"
                                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500"></textarea>
                    </div>
                    <div class="mb-4">
                        <label for="imageFile" class="block text-sm font-medium text-gray-700 mb-2">Image File</label>
                        <input type="file" id="imageFile" name="image" accept="image/*" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div class="mb-4">
                        <!-- Upload progress -->
                        <div id="uploadProgressContainer" class="hidden">
                            <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
                                <div id="uploadProgressBar" class="bg-blue-600 h-3 w-0"></div>
                            </div>
                            <p id="uploadProgressText" class="text-sm text-gray-600 mt-2">0%</p>
                        </div>
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" id="cancelImageBtn" 
                                class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400">
                            Cancel
                        </button>
                        <button type="submit" id="uploadImageBtn"
                                class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                            Upload
                        </button>
                    </div>
                </form>
            </div>

    <script>
        // Gallery management functionality
        let galleryImages = [];
        let editingImageId = null;

        // Load gallery images
        async function loadGallery() {
            try {
                console.log('🎯 Loading gallery...');
                
                // Wait for authentication to be checked
                if (typeof sharedAuth === 'undefined') {
                    console.log('⏳ Waiting for sharedAuth to be available...');
                    setTimeout(loadGallery, 100);
                    return;
                }

                // Wait for auth check to complete
                let retryCount = 0;
                while (!sharedAuth.isAuthChecked() && retryCount < 50) {
                    console.log('⏳ Waiting for auth check to complete...', retryCount);
                    await new Promise(resolve => setTimeout(resolve, 100));
                    retryCount++;
                }

                if (retryCount >= 50) {
                    console.error('❌ Timeout waiting for auth check');
                    showAuthMessage();
                    return;
                }

                console.log('🔐 Auth checked. Can access:', sharedAuth.canAccess());

                // Check if user is authenticated
                if (!sharedAuth.canAccess()) {
                    console.log('❌ User cannot access admin gallery');
                    showAuthMessage();
                    return;
                }

                console.log('✅ User authenticated, fetching gallery...');
                console.log('🔗 API URL:', (window.buildApiUrl ? window.buildApiUrl('gallery.php') : (window.APP_API_FOLDER ? window.APP_API_FOLDER + 'gallery.php' : 'https://spchospital.com/Backend/api/gallery.php')));

                const response = await fetch((window.buildApiUrl ? window.buildApiUrl('gallery.php') : (window.APP_API_FOLDER ? window.APP_API_FOLDER + 'gallery.php' : 'https://spchospital.com/Backend/api/gallery.php')), {
                    credentials: 'include',
                    cache: 'no-cache'
                });
                
                console.log('📡 Gallery API response status:', response.status);
                console.log('📡 Gallery API response headers:', [...response.headers.entries()]);
                
                if (response.status === 403) {
                    console.log('❌ 403 Forbidden from gallery API');
                    showAuthMessage();
                    return;
                }
                
                if (response.status === 404) {
                    console.error('❌ 404 Not Found - API endpoint not found');
                    const grid = document.getElementById('galleryGrid');
                    grid.innerHTML = `
                        <div class="col-span-full text-center py-12">
                            <div class="bg-red-50 border border-red-200 rounded-lg p-6">
                                <div class="text-red-800 mb-2 font-semibold">API Error</div>
                                <div class="text-red-700 mb-4">Gallery API endpoint not found. Please check server configuration.</div>
                                <div class="text-sm text-red-600">Error: 404 - https://spchospital.com/Backend/api/gallery.php</div>
                            </div>
                        </div>
                    `;
                    return;
                }
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const responseText = await response.text();
                console.log('📡 Raw response:', responseText);
                
                const data = JSON.parse(responseText);
                console.log('📷 Gallery data received:', data);
                galleryImages = data.gallery || [];
                displayGallery();
                console.log('✅ Gallery displayed successfully');
            } catch (error) {
                console.error('💥 Error loading gallery:', error);
                console.error('💥 Error stack:', error.stack);
                
                const grid = document.getElementById('galleryGrid');
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <div class="bg-red-50 border border-red-200 rounded-lg p-6">
                            <div class="text-red-800 mb-2 font-semibold">Error Loading Gallery</div>
                            <div class="text-red-700 mb-4">${error.message}</div>
                            <button onclick="loadGallery()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg">Retry</button>
                        </div>
                    </div>
                `;
            }
        }

        function showAuthMessage() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = `
                <div class="col-span-full text-center py-12">
                    <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-6">
                        <div class="text-yellow-800 mb-2 font-semibold">Authentication Required</div>
                        <div class="text-yellow-700 mb-4">You need to be logged in as an administrator to view and manage the gallery.</div>
                        <a href="login.html" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg inline-block">Login as Admin</a>
                    </div>
                </div>
            `;
        }

        // Display gallery images
        function displayGallery() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';

            galleryImages.forEach(image => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-lg shadow-lg overflow-hidden';
                card.innerHTML = `
                    <div class="relative">
                    <img src="https://spchospital.com/uploads/gallery/${image.image_path}" 
                             alt="${image.title}" 
                             class="w-full h-48 object-cover">
                        <div class="absolute top-2 right-2 flex space-x-2">
                            <button onclick="editImage(${image.id})" 
                                    class="bg-blue-600 text-white p-2 rounded-full hover:bg-blue-700">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                                </svg>
                            </button>
                            <button onclick="deleteImage(${image.id})" 
                                    class="bg-red-600 text-white p-2 rounded-full hover:bg-red-700">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="p-4">
                        <h3 class="text-lg font-semibold text-gray-900 mb-2">${image.title}</h3>
                        <p class="text-gray-600 text-sm">${image.description || 'No description'}</p>
                        <p class="text-gray-500 text-xs mt-2">${new Date(image.created_at).toLocaleDateString()}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Show modal for adding/editing
        function showImageModal(isEdit = false) {
            const modal = document.getElementById('imageModal');
            const title = document.getElementById('modalTitle');
            const form = document.getElementById('imageForm');
            
            if (isEdit) {
                title.textContent = 'Edit Image';
                document.getElementById('imageFile').required = false;
            } else {
                title.textContent = 'Upload Image';
                document.getElementById('imageFile').required = true;
                form.reset();
                editingImageId = null;
            }
            // Reset progress UI whenever modal is shown
            const progressContainer = document.getElementById('uploadProgressContainer');
            const progressBar = document.getElementById('uploadProgressBar');
            const progressText = document.getElementById('uploadProgressText');
            const uploadBtn = document.getElementById('uploadImageBtn');
            if (progressContainer) progressContainer.classList.add('hidden');
            if (progressBar) progressBar.style.width = '0%';
            if (progressText) progressText.textContent = '0%';
            if (uploadBtn) {
                uploadBtn.disabled = false;
                uploadBtn.classList.remove('opacity-60', 'cursor-not-allowed');
            }

            modal.classList.remove('hidden');
        }

        // Hide modal
        function hideImageModal() {
            const modal = document.getElementById('imageModal');
            const progressContainer = document.getElementById('uploadProgressContainer');
            const progressBar = document.getElementById('uploadProgressBar');
            const progressText = document.getElementById('uploadProgressText');
            const uploadBtn = document.getElementById('uploadImageBtn');

            // Reset progress UI when hiding
            if (progressContainer) progressContainer.classList.add('hidden');
            if (progressBar) progressBar.style.width = '0%';
            if (progressText) progressText.textContent = '0%';
            if (uploadBtn) {
                uploadBtn.disabled = false;
                uploadBtn.classList.remove('opacity-60', 'cursor-not-allowed');
            }

            if (modal) modal.classList.add('hidden');
        }

        // Edit image
        function editImage(id) {
            const image = galleryImages.find(img => img.id == id);
            if (image) {
                editingImageId = id;
                document.getElementById('imageTitle').value = image.title;
                document.getElementById('imageDescription').value = image.description || '';
                showImageModal(true);
            }
        }

        // Delete image
        async function deleteImage(id) {
            if (confirm('Are you sure you want to delete this image?')) {
                try {
                    const response = await fetch((window.buildApiUrl ? window.buildApiUrl(`gallery.php?id=${id}`) : (window.APP_API_FOLDER ? window.APP_API_FOLDER + `gallery.php?id=${id}` : 'https://spchospital.com/Backend/api/gallery.php?id=${id}')), {
                        method: 'DELETE'
                    });
                    if (response.ok) {
                        loadGallery();
                    }
                } catch (error) {
                    console.error('Error deleting image:', error);
                }
            }
        }

        // Event listeners
        document.getElementById('addImageBtn').addEventListener('click', () => showImageModal(false));
        document.getElementById('cancelImageBtn').addEventListener('click', hideImageModal);
        
        document.getElementById('imageForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            try {
                const url = editingImageId 
                    ? (window.buildApiUrl ? window.buildApiUrl(`gallery.php?id=${editingImageId}`) : (window.APP_API_FOLDER ? window.APP_API_FOLDER + `gallery.php?id=${editingImageId}` : 'https://spchospital.com/Backend/api/gallery.php?id=${editingImageId}'))
                    : (window.buildApiUrl ? window.buildApiUrl('gallery.php') : (window.APP_API_FOLDER ? window.APP_API_FOLDER + 'gallery.php' : 'https://spchospital.com/Backend/api/gallery.php'));
                
                const method = editingImageId ? 'PUT' : 'POST';
                
                let response;
                if (editingImageId) {
                    // Edit via JSON (no file upload)
                    const imageData = {
                        title: document.getElementById('imageTitle').value,
                        description: document.getElementById('imageDescription').value
                    };
                    response = await fetch(url, {
                        method: method,
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(imageData)
                    });
                } else {
                    // Create via FormData (with file upload) using XHR to track progress
                    await new Promise((resolve, reject) => {
                        const formData = new FormData(e.target);

                        const xhr = new XMLHttpRequest();
                        xhr.open(method, url, true);
                        xhr.withCredentials = true;

                        const uploadBtn = document.getElementById('uploadImageBtn');
                        const progressContainer = document.getElementById('uploadProgressContainer');
                        const progressBar = document.getElementById('uploadProgressBar');
                        const progressText = document.getElementById('uploadProgressText');

                        // Disable the upload button to prevent duplicate clicks
                        if (uploadBtn) {
                            uploadBtn.disabled = true;
                            uploadBtn.classList.add('opacity-60', 'cursor-not-allowed');
                        }

                        // Show progress UI
                        if (progressContainer) progressContainer.classList.remove('hidden');

                        xhr.upload.addEventListener('progress', (evt) => {
                            if (evt.lengthComputable) {
                                const percent = Math.round((evt.loaded / evt.total) * 100);
                                if (progressBar) progressBar.style.width = percent + '%';
                                if (progressText) progressText.textContent = percent + '%';
                            }
                        });

                        xhr.onreadystatechange = function() {
                            if (xhr.readyState === XMLHttpRequest.DONE) {
                                const progressContainerLocal = progressContainer;
                                const progressBarLocal = progressBar;
                                const progressTextLocal = progressText;

                                if (xhr.status >= 200 && xhr.status < 300) {
                                    resolve(xhr.responseText);
                                } else {
                                    reject(xhr);
                                }

                                // Re-enable upload button
                                if (uploadBtn) {
                                    uploadBtn.disabled = false;
                                    uploadBtn.classList.remove('opacity-60', 'cursor-not-allowed');
                                }

                                // Hide/reset progress UI after a short delay so user can see 100%
                                setTimeout(() => {
                                    if (progressContainerLocal) progressContainerLocal.classList.add('hidden');
                                    if (progressBarLocal) progressBarLocal.style.width = '0%';
                                    if (progressTextLocal) progressTextLocal.textContent = '0%';
                                }, 700);
                            }
                        };

                        xhr.onerror = function() {
                            // Network error
                            if (uploadBtn) {
                                uploadBtn.disabled = false;
                                uploadBtn.classList.remove('opacity-60', 'cursor-not-allowed');
                            }

                            // Hide/reset progress UI
                            if (progressContainer) progressContainer.classList.add('hidden');
                            if (progressBar) progressBar.style.width = '0%';
                            if (progressText) progressText.textContent = '0%';

                            reject(new Error('Network error during image upload'));
                        };

                        xhr.send(formData);
                    }).then(() => {
                        // success
                        hideImageModal();
                        loadGallery();
                    }).catch(async (xhrOrError) => {
                        console.error('Error saving image:', xhrOrError);
                        let msg = 'Failed to save image';
                        try {
                            if (xhrOrError && xhrOrError.responseText) {
                                const json = JSON.parse(xhrOrError.responseText);
                                msg = json.error || msg;
                            } else if (xhrOrError instanceof Error) {
                                msg = xhrOrError.message;
                            }
                        } catch (e) {
                            // ignore JSON parse errors
                        }
                        alert('Error: ' + msg);
                    });
                }

            } catch (error) {
                console.error('Error saving image:', error);
                alert('Error: ' + error.message);
            }
        });

        // Load gallery on page load - with a slight delay to ensure auth is initialized
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(loadGallery, 500); // Increased delay to ensure all scripts load properly
        });
    </script>
