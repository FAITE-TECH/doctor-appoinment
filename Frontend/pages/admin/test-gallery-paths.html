<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Gallery Paths</title>
</head>
<body>
    <h1>Testing Gallery API Paths</h1>
    <div id="results"></div>
    
    <script>
        async function testPaths() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Testing API paths...</p>';
            
            const pathsToTest = [
                (window.buildApiUrl ? window.buildApiUrl('gallery.php') : (window.APP_API_FOLDER ? window.APP_API_FOLDER + 'gallery.php' : 'https://spchospital.com/Backend/api/gallery.php')),
                (window.buildApiUrl ? window.buildApiUrl('auth.php?action=me') : ((function(v){ try{ if(!v) return v; if(/^https?:\/\//i.test(v)) return v; if(v.startsWith('/')) return window.location.origin.replace(/\/$/,'')+v; return v;}catch(e){return v}})(window.APP_API_BASE) || (window.APP_API_FOLDER ? window.APP_API_FOLDER + 'auth.php?action=me' : 'https://spchospital.com/Backend/api/auth.php?action=me'))),
                (window.buildApiUrl ? window.buildApiUrl('gallery.php') : (window.APP_API_FOLDER ? window.APP_API_FOLDER + 'gallery.php' : 'https://spchospital.com/Backend/api/gallery.php')),
                (window.buildApiUrl ? window.buildApiUrl('gallery.php') : (window.APP_API_FOLDER ? window.APP_API_FOLDER + 'gallery.php' : 'https://spchospital.com/Backend/api/gallery.php'))
            ];
            
            for (const path of pathsToTest) {
                try {
                    console.log(`Testing path: ${path}`);
                    const response = await fetch(path, {
                        credentials: 'include',
                        cache: 'no-cache'
                    });
                    
                    const status = response.status;
                    const statusText = response.statusText;
                    
                    resultsDiv.innerHTML += `
                        <div style="margin: 10px 0; padding: 10px; border: 1px solid #ccc;">
                            <strong>Path:</strong> ${path}<br>
                            <strong>Status:</strong> ${status} ${statusText}<br>
                            <strong>Result:</strong> ${status === 200 ? '✅ Success' : status === 403 ? '🔒 Forbidden (Auth required)' : status === 404 ? '❌ Not Found' : '⚠️ Other'}
                        </div>
                    `;
                } catch (error) {
                    resultsDiv.innerHTML += `
                        <div style="margin: 10px 0; padding: 10px; border: 1px solid red;">
                            <strong>Path:</strong> ${path}<br>
                            <strong>Error:</strong> ${error.message}
                        </div>
                    `;
                }
            }
        }
        
        // Test when page loads
        document.addEventListener('DOMContentLoaded', testPaths);
    </script>
</body>
</html>
