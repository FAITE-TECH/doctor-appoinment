    <style>
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 5px;
            color: white;
            z-index: 1000;
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 0.3s, transform 0.3s;
        }
        
        .notification.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .notification.success {
            background-color: #10B981;
        }
        
        .notification.error {
            background-color: #EF4444;
        }
        
        .notification.warning {
            background-color: #F59E0B;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            display: none;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3B82F6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-field {
            border-color: #EF4444 !important;
        }
        
        .error-message {
            color: #EF4444;
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }

    </style>
</head>

    <script src="https://spchospital.com/Frontend/public/js/config.js"></script>

    <script src="https://spchospital.com/Frontend/pages/admin/js/shared-auth.js"></script>
    <script>
        // Event management functionality
        let events = [];
        let editingEventId = null;
        let currentSearchTerm = '';
        let searchTimeout = null;

        // Utility functions
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type} show`;
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        function showLoading() {
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        function clearErrors() {
            document.querySelectorAll('.error-field').forEach(el => {
                el.classList.remove('error-field');
            });
            document.querySelectorAll('.error-message').forEach(el => {
                el.classList.add('hidden');
            });
        }

        // Helper to build API URLs with sensible fallbacks when window.buildApiUrl
        // is not available (e.g. script failed to load or blocked). Other pages
        // in the project use a similar pattern; keep the same fallback behavior
        // so admin pages work both locally and when served from production.
        function apiUrl(endpoint) {
            try {
                if (typeof window.buildApiUrl === 'function') return window.buildApiUrl(endpoint);
                // Normalize endpoint
                var ep = endpoint || '';
                if (ep.startsWith('/')) ep = ep.substring(1);
                var folder = window.APP_API_FOLDER || 'https://spchospital.com/Backend/api/';
                if (!folder.endsWith('/')) folder = folder + '/';
                return folder + ep;
            } catch (e) {
                // As last resort, return a production absolute URL
                return 'https://spchospital.com/Backend/api/' + (endpoint || '');
            }
        }

        function showError(fieldId, message) {
            const field = document.getElementById(fieldId);
            const errorElement = document.getElementById(fieldId + 'Error');
            
            if (field) {
                field.classList.add('error-field');
            }
            
            if (errorElement) {
                errorElement.textContent = message;
                errorElement.classList.remove('hidden');
            }
        }

        // Helper to build image URL for event uploads (mirrors doctors logic)
        function buildEventImageUrl(imagePath) {
            if (!imagePath) return null;
            const imgPath = String(imagePath || '');
            if (imgPath.startsWith('http')) return imgPath;
            if (imgPath.startsWith('/')) return window.location.origin + imgPath;

            // If only filename stored, attempt to use buildUploadUrl or construct relative path
            const imgName = imgPath.split('/').pop();
            if (!imgName) return null;
            if (typeof window.buildUploadUrl === 'function') {
                return window.buildUploadUrl('events/' + imgName);
            }
            const basePath = window.location.pathname.includes('/doctor-appoinment') ? window.location.pathname.split('/doctor-appoinment')[0] + '/doctor-appoinment' : '';
            return window.location.origin + basePath + '/uploads/events/' + imgName;
        }

        // Load events
        async function loadEvents(searchTerm = '') {
            try {
                showLoading();
                
                // Check if user is authenticated
                if (typeof sharedAuth !== 'undefined' && !sharedAuth.canAccess()) {
                    showAuthMessage();
                    hideLoading();
                    return;
                }

                let url = apiUrl('events.php');
                if (searchTerm) {
                    url += '?search=' + encodeURIComponent(searchTerm);
                }

                const response = await fetch(url);
                if (response.status === 403) {
                    showAuthMessage();
                    hideLoading();
                    return;
                }
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                events = data.events || [];
                displayEvents();
                hideLoading();
            } catch (error) {
                console.error('Error loading events:', error);
                showAuthMessage();
                hideLoading();
                showNotification('Failed to load events. Please try again.', 'error');
            }
        }

        function showAuthMessage() {
            const container = document.getElementById('eventsContainer');
            if (!container) return;
            container.innerHTML = `
                <div class="col-span-full text-center py-8">
                    <div class="text-gray-500 mb-2">Authentication required to view events</div>
                    <a href="login.html" class="text-blue-600 hover:text-blue-800 underline">Click here to login</a>
                </div>
            `;
        }

        // Display events as responsive cards (mobile-first)
        function displayEvents() {
            const container = document.getElementById('eventsContainer');
            if (!container) return;

            if (!events || events.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center text-gray-500 py-8">No events found. Click "Add Event" to create one.</div>';
                return;
            }

            container.innerHTML = events.map(event => {
                const imgUrl = buildEventImageUrl(event.image_path) || ((typeof window.buildAssetUrl === 'function') ? window.buildAssetUrl('assets/event-placeholder.png') : (window.location.origin + '/Frontend/public/assets/event-placeholder.png'));
                return `
                    <div class="bg-transparent border border-gray-200 rounded-lg overflow-hidden shadow-sm hover:shadow-lg transition flex flex-col">
                        <div class="h-44 w-full bg-gray-100 overflow-hidden flex items-center justify-center">
                            <img src="${imgUrl}" alt="${escapeHtml(event.title)}" class="object-cover w-full h-full" onerror="this.onerror=null;this.src='${imgUrl}';" />
                        </div>
                        <div class="p-4 flex-1 flex flex-col relative pb-12">
                            <h3 class="text-lg font-semibold text-gray-900 mb-1">${escapeHtml(event.title)}</h3>
                            <p class="text-sm text-gray-600 mb-2 truncate">${escapeHtml(event.description || '')}</p>
                            <div class="text-sm text-gray-500 mb-2">${new Date(event.event_date).toLocaleDateString()} ${event.event_time ? '• ' + event.event_time : ''}</div>
                            <div class="text-sm text-gray-500 mb-2">${escapeHtml(event.location || '')}</div>

                            <div class="absolute bottom-3 left-3 flex gap-2">
                                <button class="text-blue-600 hover:text-blue-900 px-2 py-1 rounded" onclick="editEvent(${event.id})">Edit</button>
                                <button class="text-red-600 hover:text-red-900 px-2 py-1 rounded" onclick="deleteEvent(${event.id})">Delete</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Simple escaping for text to avoid HTML injection
        function escapeHtml(unsafe) {
            if (!unsafe && unsafe !== 0) return '';
            return String(unsafe)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        // Show modal for adding/editing
        function showEventModal(isEdit = false) {
            const modal = document.getElementById('eventModal');
            const title = document.getElementById('modalTitle');
            const form = document.getElementById('eventForm');
            
            clearErrors();
            
            if (isEdit) {
                title.textContent = 'Edit Event';
            } else {
                title.textContent = 'Add Event';
                form.reset();
                editingEventId = null;
            }
            
            modal.classList.remove('hidden');
        }

        // Hide modal
        function hideEventModal() {
            document.getElementById('eventModal').classList.add('hidden');
        }

        // Edit event
        function editEvent(id) {
            const event = events.find(e => e.id == id);
            if (event) {
                editingEventId = id;
                document.getElementById('eventTitle').value = event.title;
                document.getElementById('eventDescription').value = event.description || '';
                document.getElementById('eventDate').value = event.event_date;
                document.getElementById('eventTime').value = event.event_time || '';
                document.getElementById('eventLocation').value = event.location || '';
                showEventModal(true);
            }
        }

        // Delete event
        async function deleteEvent(id) {
            if (confirm('Are you sure you want to delete this event?')) {
                try {
                    showLoading();
                    const response = await fetch(apiUrl(`events.php?id=${id}`), {
                        method: 'DELETE'
                    });
                    
                    if (response.ok) {
                        showNotification('Event deleted successfully');
                        loadEvents();
                    } else if (response.status === 422) {
                        const errorData = await response.json();
                        showNotification(errorData.message || 'Validation error occurred', 'error');
                    } else {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                } catch (error) {
                    console.error('Error deleting event:', error);
                    showNotification('Failed to delete event. Please try again.', 'error');
                } finally {
                    hideLoading();
                }
            }
        }

        // Setup search functionality
        function setupSearchFunctionality() {
            const searchInput = document.getElementById('eventSearch');
            const clearButton = document.getElementById('clearEventSearch');

            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    const searchTerm = e.target.value.trim();
                    currentSearchTerm = searchTerm;
                    
                    // Show/hide clear button
                    if (clearButton) {
                        if (searchTerm) {
                            clearButton.classList.remove('hidden');
                        } else {
                            clearButton.classList.add('hidden');
                        }
                    }
                    
                    // Debounce search to avoid too many API calls
                    clearTimeout(searchTimeout);
                    searchTimeout = setTimeout(() => {
                        loadEvents(searchTerm);
                    }, 300);
                });
            }

            if (clearButton) {
                clearButton.addEventListener('click', () => {
                    if (searchInput) {
                        searchInput.value = '';
                        currentSearchTerm = '';
                        clearButton.classList.add('hidden');
                        loadEvents('');
                    }
                });
            }
        }

        // Event listeners
        document.getElementById('addEventBtn').addEventListener('click', () => showEventModal(false));
        document.getElementById('cancelEventBtn').addEventListener('click', hideEventModal);
        
        document.getElementById('eventForm').addEventListener('submit', (e) => {
            e.preventDefault();

            clearErrors();

            const form = e.target;
            const formData = new FormData(form);
            const title = (formData.get('title') || '').trim();
            const eventDate = formData.get('event_date');

            // Client-side validation
            let isValid = true;
            if (!title) {
                showError('eventTitle', 'Title is required');
                isValid = false;
            }
            if (!eventDate) {
                showError('eventDate', 'Date is required');
                isValid = false;
            }
            if (!isValid) {
                showNotification('Please fix the validation errors', 'error');
                return;
            }

            // Prepare FormData and include id if editing
            if (editingEventId) {
                formData.append('id', editingEventId);
            }

            // Use XMLHttpRequest to track upload progress
            const xhr = new XMLHttpRequest();
            const url = apiUrl('events.php');

            // Modal-local progress UI and Save button
            const progressWrapper = document.getElementById('modalUploadProgress');
            const progressBar = document.getElementById('modalUploadProgressBar');
            const progressPercent = document.getElementById('modalUploadProgressPercent');
            const saveBtn = document.getElementById('saveEventBtn');
            if (progressWrapper) progressWrapper.classList.remove('hidden');
            if (progressBar) progressBar.style.width = '0%';
            if (progressPercent) progressPercent.textContent = '0%';
            if (saveBtn) { saveBtn.disabled = true; saveBtn.classList.add('opacity-60', 'cursor-not-allowed'); }

            xhr.open('POST', url, true);
            xhr.withCredentials = true;

            xhr.upload.addEventListener('progress', (evt) => {
                if (evt.lengthComputable) {
                    const percentComplete = Math.round((evt.loaded / evt.total) * 100);
                    if (progressBar) progressBar.style.width = percentComplete + '%';
                    // write percent into the moved percent element
                    if (progressPercent) progressPercent.textContent = percentComplete + '%';
                }
            });

            // When the upload stream completes (client finished sending), show 100% and update text to Processing…
            xhr.upload.addEventListener('loadend', () => {
                if (progressBar) progressBar.style.width = '100%';
                if (progressPercent) progressPercent.textContent = 'Processing…';
            });

            // Set a reasonable timeout (ms) for the entire request/response
            xhr.timeout = 120000; // 120s
            xhr.ontimeout = function() {
                if (progressWrapper) progressWrapper.classList.add('hidden');
                if (saveBtn) { saveBtn.disabled = false; saveBtn.classList.remove('opacity-60', 'cursor-not-allowed'); }
                showNotification('Server did not respond in time. Try again or check server logs.', 'error');
            };

            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    try {
                        const responseData = JSON.parse(xhr.responseText || '{}');
                        if (xhr.status >= 200 && xhr.status < 300) {
                            showNotification(editingEventId ? 'Event updated successfully' : 'Event created successfully');
                            hideEventModal();
                            loadEvents();
                        } else if (xhr.status === 422) {
                            if (responseData.errors) {
                                Object.keys(responseData.errors).forEach(field => {
                                    showError(`event${field.charAt(0).toUpperCase() + field.slice(1)}`, responseData.errors[field]);
                                });
                            }
                            showNotification(responseData.message || 'Validation error occurred', 'error');
                        } else {
                            showNotification(responseData.error || 'Failed to save event. Please try again.', 'error');
                        }
                    } catch (err) {
                        console.error('Invalid JSON response', err, xhr.responseText);
                        showNotification('Unexpected server response', 'error');
                    } finally {
                        // hide/reset progress UI
                        if (progressWrapper) setTimeout(() => progressWrapper.classList.add('hidden'), 800);
                        if (progressBar) progressBar.style.width = '0%';
                        if (progressPercent) progressPercent.textContent = '0%';
                        if (saveBtn) { saveBtn.disabled = false; saveBtn.classList.remove('opacity-60', 'cursor-not-allowed'); }
                    }
                }
            };

            xhr.onerror = function() {
                showNotification('Network error while uploading (connection interrupted). Please try again.', 'error');
                if (progressWrapper) progressWrapper.classList.add('hidden');
                if (saveBtn) { saveBtn.disabled = false; saveBtn.classList.remove('opacity-60', 'cursor-not-allowed'); }
            };
            xhr.send(formData);
        });

        // Load events on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadEvents();
            setupSearchFunctionality();
        });
    </script>
    <script src="./js/admin.js"></script>
    <script src="./shared/admin-nav.js"></script>
</body>
</html>
