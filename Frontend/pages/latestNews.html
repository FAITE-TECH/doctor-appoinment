<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SPC Hospital offers 24/7 emergency services, expert doctors, and modern facilities in  Navatkudah, Battialoa. Book your appointment online."
    />
<meta name="keywords" content="hospital, doctor, appointment, Navatkudah, Batticaloa, Sri Lanka, SPC Hospital">
  <meta name="author" content="SPC General Hospital">
  <meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="SPC General Hospital">
<meta name="twitter:description" content="Book your appointment online today.">
<meta name="twitter:image" content="https://yourdomain.com/images/hospital.jpg">

<meta property="og:title" content="SPC General Hospital - Online Appointments" />
<meta property="og:description" content="Easily book appointments with our trusted doctors in Navatkudah." />
<meta property="og:image" content="https://yourdomain.com/images/hospital.jpg" />
<meta property="og:url" content="https://yourdomain.com/book-appointment" />
<meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="../public/assets/logo.png" />

    <title>Latest News Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      src="https://kit.fontawesome.com/a076d05399.js"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <!--  Import Header -->

    <div id="header"></div>
    <script>
      fetch("header.html")
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("header").innerHTML = data;

          // === Mobile menu toggle ===
          const mobileMenuToggle = document.getElementById("mobileMenuToggle");
          const mobileMenu = document.getElementById("mobileMenu");

          if (mobileMenuToggle && mobileMenu) {
            mobileMenuToggle.addEventListener("click", () => {
              mobileMenu.classList.toggle("hidden");
            });
          }

          // === Main Doctor dropdown ===
          document.querySelectorAll("[data-dropdown]").forEach((button) => {
            button.addEventListener("click", () => {
              const menu = button.nextElementSibling;
              menu.classList.toggle("hidden");
            });
          });

          // === Submenus ===
          document.querySelectorAll("[data-submenu]").forEach((button) => {
            button.addEventListener("click", () => {
              const submenu = button.nextElementSibling;

              // Close other submenus first
              document
                .querySelectorAll("[data-submenu-menu]")
                .forEach((menu) => {
                  if (menu !== submenu) menu.classList.add("hidden");
                });

              // Toggle clicked submenu
              submenu.classList.toggle("hidden");
            });
          });
        });
    </script>
    <div class="relative w-full h-40 max-w-6xl mx-auto">
      <img
        src="../public/assets/eyecare.jpg"
        alt="services"
        class="w-full h-full object-cover rounded-lg"
      />
      <h1
        class="absolute bottom-2 left-2 text-xl font-bold text-white bg-black/50 px-2 py-1 rounded"
      >
        Latest News Details
      </h1>
    </div>

    <div
      class="flex text-gray-600 my-10 leading-relaxed space-x-1 text-sm justify-center max-w-6xl"
    >
      <a href="home.html#latestNews" class="text-blue-600 hover:underline"
        >Home</a
      >
      <span>&gt;</span>
      <a href="latestNews.html" class="text-blue-600 hover:underline"
        >latestNews</a
      >
      <span>&gt;</span>
    </div>
    <section id="latestNews">
      <div class="text-center my-10 container mx-auto max-w-6xl px-4">
        <!-- Services Cards Grid -->
        <div
          id="latestNewsContainer"
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 mt-10"
        >
          <!-- Cards will be injected by JS -->
        </div>
      </div>
    </section>
    <script src="latestNews-data.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const latestNewsContainer = document.getElementById(
          "latestNewsContainer"
        );

        function renderLatestNews(latestNews) {
          // Clear container
          latestNewsContainer.innerHTML = "";

          latestNews.forEach((news) => {
            const newsCard = document.createElement("div");
            newsCard.className =
              "bg-white border border-gray-200 overflow-hidden shadow-sm hover:shadow-lg transition flex flex-col transform opacity-0 animate-fadeIn";

            newsCard.innerHTML = `
        <!-- News Image Wrapper -->
        <a href="latestNews-details.html?id=${news.id}">
          <div class="relative h-56 w-full overflow-hidden group">
            <img src="${news.img}" alt="${news.title}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
          </div>
        </a>

        <!-- News Content -->
        <div class="p-6 flex flex-col justify-between flex-grow">
          <h3 class="text-xl font-sans-serif text-blue-800 mb-2 text-start">${news.title}</h3>
          <p class="bg-green-100 text-blue-500 text-xs font-[Roboto] px-3 py-1 rounded-full uppercase w-fit mb-3">${news.date}</p>
          <p class="text-gray-600 text-md mb-4 clamp-4 text-start leading-relaxed">${news.description}</p>
        </div>
      `;

            latestNewsContainer.appendChild(newsCard);

            // Animate card fade in
            requestAnimationFrame(() => {
              newsCard.classList.remove("opacity-0");
            });
          });
        }

        // Initial render - all news
        renderLatestNews(latestNews);
      });
    </script>

    <style>
      /* Simple fade-in animation */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-fadeIn {
        animation: fadeIn 1.5s ease forwards;
      }
    </style>

    <!-- Footer -->
    <div id="footer"></div>
    <script>
      fetch("footer.html")
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("footer").innerHTML = data;

          // Now the footer exists, so set the year
          const yearSpan = document.getElementById("currentYear");
          if (yearSpan) {
            yearSpan.textContent = new Date().getFullYear();
          }
        });
    </script>

    <!-- Placeholder for spinner -->
    <div id="spinner"></div>

    <script>
      // Load spinner markup
      fetch("spinner.html")
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("spinner").innerHTML = data;

          // Now spinner is in DOM -> attach JS logic
          const spinner = document.getElementById("spinner-overlay");

          function showSpinner() {
            spinner.classList.remove("hidden");
          }
          function hideSpinner() {
            spinner.classList.add("hidden");
          }

          // Show on links
          document.querySelectorAll("a").forEach((link) => {
            link.addEventListener("click", () => {
              if (
                link.getAttribute("href") !== "#" &&
                !link.getAttribute("href")?.startsWith("javascript")
              ) {
                showSpinner();
                setTimeout(hideSpinner, 10000); // works now
              }
            });
          });

          // Show on .show-spinner buttons
          document.querySelectorAll("button.show-spinner").forEach((btn) => {
            btn.addEventListener("click", () => {
              showSpinner();
              setTimeout(hideSpinner, 10000); // works now
            });
          });

          // Show on form submit
          document.querySelectorAll("form").forEach((form) => {
            form.addEventListener("submit", () => {
              showSpinner();
              setTimeout(hideSpinner, 10000); // works now
            });
          });

          // Optional: hide spinner after page load (auto)
          setTimeout(() => hideSpinner(), 10000);
        });
    </script>
  </body>
</html>
