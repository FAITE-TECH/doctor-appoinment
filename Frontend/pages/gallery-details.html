<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery Details</title>
  <link rel="icon" type="image/png" href="https://spchospital.com/Frontend/public/assets/logo.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    
  <!-- Safari and Cross-browser compatibility -->
  <script src="https://spchospital.com/Frontend/public/js/config.js"></script>
  <script src="https://spchospital.com/Frontend/public/js/browser-compat.js"></script>
  <script src="https://spchospital.com/Frontend/public/js/cross-platform-utils.js?v=20251024-1"></script>
  </head>
  <body class="bg-gray-50" style="min-height: 100vh; display: flex; flex-direction: column;">


    <!--  Import Header -->

    <div id="header"></div>
    <script>
      // Safari-compatible navigation loading
      function loadNavigation() {
        var headerEl = document.getElementById("header");
        if (!headerEl) {
          console.error('Header element not found');
          return;
        }
        
  fetch('shared-nav.html?v=' + Date.now(), {
          method: 'GET',
          cache: 'no-cache',
          headers: {
            'Accept': 'text/html',
            'Cache-Control': 'no-cache, no-store, must-revalidate'
          }
        })
        .then(function(res) {
          if (!res.ok) {
            throw new Error('HTTP error! status: ' + res.status);
          }
          return res.text();
        })
        .then(function(data) {
          headerEl.innerHTML = data;
          // Small delay to ensure DOM is ready
          setTimeout(function() {
            if (window.initNavigationAfterLoad) {
              window.initNavigationAfterLoad();
            }
          }, 100);
        })
        .catch(function(error) {
          console.warn('Failed to load navigation:', error.message);
          // Minimal fallback nav
          headerEl.innerHTML = '<header class="bg-white shadow-md w-full"><div class="max-w-6xl mx-auto flex items-center justify-between px-4 py-3"><a href="index.html" class="flex items-center space-x-2"><img src="../public/assets/logo.png" alt="SPC Hospital Logo" class="h-8 w-auto" /><span class="font-bold text-blue-600">SPC Hospital</span></a><nav class="hidden md:flex items-center space-x-6 text-gray-600"><a href="home.html">Home</a><a href="doctors.html">Doctors</a><a href="departments.html">Departments</a><a href="services.html">Services</a><a href="gallery.html">Gallery</a><a href="events.html">Events</a><a href="contact.html">Contact</a></nav></div></header>';
        });
      }
      
      // Safari-compatible DOM ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadNavigation);
      } else {
        loadNavigation();
      }
    </script>
    </script>

    <main style="flex: 1 0 auto;">
      <div class="container mx-auto p-6">
        <div
          id="galleryDetail"
          class="flex flex-col mt-6 justify-center align-center"
        ></div>
      </div>

      <!-- Related Gallery Items -->
      <section id="gallery">
        <div class="text-center my-10 container mx-auto max-w-6xl px-4">
          <h2 class="text-3xl font-bold text-gray-800 mb-8">More from Gallery</h2>
          
          <!-- Gallery Grid -->
          <div
            id="galleryContainer"
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 transition-all duration-500"
          >
            <!-- Cards will be injected by JS -->
          </div>
        </div>
      </section>
    </main>

    <script>
      // Global variables
      let galleryItems = [];
      let currentGalleryItem = null;

      // Fetch gallery from API
      async function fetchGallery() {
        try {
          const response = await fetch(
            window.buildApiUrl
              ? window.buildApiUrl('public_gallery.php')
              : (window.APP_API_FOLDER ? window.APP_API_FOLDER + 'public_gallery.php' : 'https://spchospital.com/Backend/api/public_gallery.php')
          );
          
          if (!response.ok) {
            throw new Error('Failed to load gallery');
          }
          
          const data = await response.json();
          galleryItems = data.gallery || [];
          loadGalleryDetails();
          renderRelatedGallery();
        } catch (error) {
          console.error('Error fetching gallery:', error);
          document.getElementById("galleryDetail").innerHTML = '<p class="text-center text-gray-500">Unable to load gallery details. Please try again later.</p>';
        }
      }

      function loadGalleryDetails() {
        // Get gallery item id from URL
        const params = new URLSearchParams(window.location.search);
        const galleryId = parseInt(params.get("id"));

        if (!galleryId || isNaN(galleryId)) {
          document.getElementById("galleryDetail").innerHTML = '<p class="text-center text-red-500 font-semibold">Invalid gallery item ID. Please select an item from the gallery page.</p>';
          return;
        }

        // Check if gallery data is loaded
        if (!galleryItems || galleryItems.length === 0) {
          document.getElementById("galleryDetail").innerHTML = '<p class="text-center text-yellow-500">Loading gallery data...</p>';
          return;
        }

        // Find gallery item by id
        currentGalleryItem = galleryItems.find((item) => parseInt(item.id) === galleryId);

        if (currentGalleryItem) {
          // Normalize gallery image path robustly across prod/local
          let imagePath = 'https://spchospital.com/Frontend/public/assets/eyecare.jpg';
          if (currentGalleryItem.image_path) {
            const rawPath = String(currentGalleryItem.image_path || '');
            const imgName = rawPath.split('/').pop();
            if (typeof window.buildUploadUrl === 'function') {
              if (/^https?:\/\//i.test(rawPath) || rawPath.startsWith('/')) {
                imagePath = window.buildUploadUrl(rawPath);
              } else if (imgName) {
                imagePath = window.buildUploadUrl(`gallery/${imgName}`);
              }
            } else {
              // Fallbacks without helper
              if (/^https?:\/\//i.test(rawPath)) {
                imagePath = rawPath.replace(/\/doctor-appoinment\//, '/');
              } else if (imgName) {
                imagePath = 'https://spchospital.com/uploads/gallery/' + imgName;
              }
            }
          }
          const title = currentGalleryItem.title || "Gallery Image";
          const description = currentGalleryItem.description || "Beautiful image from our gallery.";
          const createdDate = new Date(currentGalleryItem.created_at).toLocaleDateString();

          document.getElementById("galleryDetail").innerHTML = `
            <div class="flex text-gray-600 my-6 leading-relaxed space-x-1 text-sm justify-center max-w-6xl">
                <a href="home.html#gallery" class="text-blue-600 hover:underline">Home</a>
                <span>&gt;</span>
                <a href="gallery.html" class="text-blue-600 hover:underline">Gallery</a>
                <span>&gt;</span>
                <span class="text-gray-800 font-medium">${title}</span>
            </div>

            <div class="bg-white p-6 max-w-6xl mx-auto">
              <!-- Main Image -->
              <div class="mb-6">
                <img src="${imagePath}" alt="${title}" class="w-full h-auto max-h-96 object-cover rounded-lg shadow-lg">
              </div>
              
              <!-- Image Details -->
              <div class="max-w-4xl mx-auto">
                <h1 class="text-3xl font-bold text-gray-800 mb-4">${title}</h1>
                
                <div class="flex items-center gap-4 mb-6 text-gray-600">
                  <div class="flex items-center gap-2">
                    <i class="fa-solid fa-calendar"></i>
                    <span>${createdDate}</span>
                  </div>
                  <div class="flex items-center gap-2">
                    <i class="fa-solid fa-image"></i>
                    <span>Gallery Image</span>
                  </div>
                </div>
                
                <div class="prose max-w-none">
                  <p class="text-gray-600 leading-relaxed text-lg">${description}</p>
                </div>

              </div>
            </div>
          `;
        } else {
          document.getElementById("galleryDetail").innerHTML = '<p class="text-red-500 font-semibold">Gallery item not found. The item with ID ' + galleryId + ' does not exist.</p>';
        }
      }

      function renderRelatedGallery() {
        const galleryContainer = document.getElementById("galleryContainer");
        if (!galleryContainer) return;

        // Filter out current gallery item
        const relatedItems = galleryItems.filter((item) => 
          parseInt(item.id) !== parseInt(currentGalleryItem?.id || 0)
        );

        if (relatedItems.length === 0) {
          galleryContainer.innerHTML = '<p class="text-center text-gray-500 col-span-full">No other gallery items available.</p>';
          return;
        }

        // Show only first 8 related items
        const displayItems = relatedItems.slice(0, 8);

        galleryContainer.innerHTML = displayItems
          .map((item) => {
            // Normalize related gallery image path
            let imagePath = '../public/assets/eyecare.jpg';
            if (item.image_path) {
              const rawPath = String(item.image_path || '');
              const imgName = rawPath.split('/').pop();
              if (typeof window.buildUploadUrl === 'function') {
                if (/^https?:\/\//i.test(rawPath) || rawPath.startsWith('/')) {
                  imagePath = window.buildUploadUrl(rawPath);
                } else if (imgName) {
                  imagePath = window.buildUploadUrl(`gallery/${imgName}`);
                }
              } else {
                if (/^https?:\/\//i.test(rawPath)) {
                  imagePath = rawPath.replace(/\/doctor-appoinment\//, '/');
                } else if (imgName) {
                  imagePath = 'https://spchospital.com/uploads/gallery/' + imgName;
                }
              }
            }
            const title = item.title || "Gallery Image";
            const description = item.description || "Beautiful image from our gallery.";
            const createdDate = new Date(item.created_at).toLocaleDateString();

            return `
              <div class="bg-white rounded-lg shadow-lg overflow-hidden hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                <a href="gallery-details.html?id=${item.id}">
                  <div class="relative group">
                    <img src="${imagePath}" 
                         alt="${title}" 
                         class="w-full h-64 object-cover transition-transform duration-300 group-hover:scale-105">
                    <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-20 transition-all duration-300"></div>
                  </div>
                </a>
                <div class="p-4">
                  <h3 class="text-lg font-semibold text-gray-800 mb-2">${title}</h3>
                  <p class="text-gray-600 text-sm mb-3">${description}</p>
                  <p class="text-gray-500 text-xs">${createdDate}</p>
                </div>
              </div>
            `;
          })
          .join("");
      }

      // Helper functions
      function downloadImage(imagePath, title) {
        const link = document.createElement('a');
        link.href = imagePath;
        link.download = title.replace(/[^a-z0-9]/gi, '_').toLowerCase() + '.jpg';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }

      function shareImage(title, description) {
        if (navigator.share) {
          navigator.share({
            title: title,
            text: description,
            url: window.location.href
          });
        } else {
          // Fallback: copy to clipboard
          navigator.clipboard.writeText(window.location.href).then(() => {
            alert('Link copied to clipboard!');
          });
        }
      }

      // Initialize when page loads
      document.addEventListener('DOMContentLoaded', function() {
        fetchGallery();
      });
    </script>

    <style>
      /* Simple fade-in animation */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-fadeIn {
        animation: fadeIn 0.5s ease forwards;
      }
    </style>

    <!-- Footer -->
    <div id="footer"></div>
    <script>
      // Safari-compatible footer loading
      function loadFooter() {
        var footerEl = document.getElementById("footer");
        if (!footerEl) {
          console.error('Footer element not found');
          return;
        }
        
  fetch('https://spchospital.com/Frontend/pages/footer.html?v=' + Date.now(), {
          method: 'GET',
          cache: 'no-cache',
          headers: {
            'Accept': 'text/html',
            'Cache-Control': 'no-cache, no-store, must-revalidate'
          }
        })
        .then(function(res) {
          if (!res.ok) {
            throw new Error('HTTP error! status: ' + res.status);
          }
          return res.text();
        })
        .then(function(data) {
          footerEl.innerHTML = data;
          // Add proper styling to footer without affecting body layout
          var footer = footerEl.querySelector('footer');
          if (footer) {
            footer.style.marginTop = 'auto';
            footer.style.flexShrink = '0';
          }
        })
        .catch(function(error) {
          console.warn('Failed to load footer:', error.message);
          // Minimal fallback footer with proper styling
          footerEl.innerHTML = '<footer class="bg-gray-700 text-white py-6" style="margin-top: auto; flex-shrink: 0;"><div class="container mx-auto px-4 text-center"><p>&copy; 2025 SPC Hospital. All rights reserved.</p></div></footer>';
        });
      }
      
      // Load footer immediately on DOM ready to prevent layout issues
      loadFooter();
    </script>

    <!-- Placeholder for spinner -->
    <div id="spinner"></div>

    <script>
      // Load spinner markup
  fetch('https://spchospital.com/Frontend/pages/spinner.html')
        .then(res => res.text())
        .then(data => {
          document.getElementById("spinner").innerHTML = data;

          // Now spinner is in DOM -> attach JS logic
          const spinner = document.getElementById("spinner-overlay");

          function showSpinner() {
            spinner.classList.remove("hidden");
          }
          function hideSpinner() {
            spinner.classList.add("hidden");
          }

          // Show on links
          document.querySelectorAll("a").forEach(link => {
            link.addEventListener("click", () => {
              if (link.getAttribute("href") !== "#" && !link.getAttribute("href")?.startsWith("javascript")) {
                showSpinner();
                setTimeout(hideSpinner, 10000);
              }
            });
          });

          // Show on .show-spinner buttons
          document.querySelectorAll("button.show-spinner").forEach(btn => {
            btn.addEventListener("click", () => {
              showSpinner();
              setTimeout(hideSpinner, 10000);
            });
          });

          // Show on form submit
          document.querySelectorAll("form").forEach(form => {
            form.addEventListener("submit", () => {
              showSpinner();
              setTimeout(hideSpinner, 10000);
            });
          });

          // Optional: hide spinner after page load (auto)
          setTimeout(() => hideSpinner(), 10000);
        });
    </script>

  <script src="https://spchospital.com/Frontend/public/js/config.js"></script>
  <script src="https://spchospital.com/Frontend/public/js/script.js"></script>
    <script src="shared-nav.js"></script>
  </body>
</html>
