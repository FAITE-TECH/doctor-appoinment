<!-- Load navigation script -->
<script>
  // Create a promise to track script loading
  window.navScriptLoaded = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'shared-nav.js';
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });

  // Initialize navigation after script is loaded
  window.navScriptLoaded.then(() => {
    if (typeof initMobileMenu === 'function') {
      initMobileMenu();
      setActiveNavLink();
    }
  }).catch(error => {
    console.error('Error loading navigation script:', error);
  });
  
  // Also expose initialization function for dynamic loading
  window.initNavigationAfterLoad = function() {
    window.navScriptLoaded.then(() => {
      if (typeof initMobileMenu === 'function') {
        initMobileMenu();
        setActiveNavLink();
      }
    });
  };
</script>
