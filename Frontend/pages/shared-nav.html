<!-- Load navigation script -->
<script>
  // Create a promise to track script loading
  window.navScriptLoaded = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'shared-nav.js';
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });

  // Initialize navigation after script is loaded. Prefer the initializer
  // exposed by `shared-nav.js` (window.initNavigationAfterLoad). Do not
  // overwrite that global function here — call it when available. This
  // avoids calling internal functions that are intentionally scoped
  // inside the navigation script and prevents runtime errors on pages
  // where those functions are not globally available.
  window.navScriptLoaded.then(() => {
    if (typeof window.initNavigationAfterLoad === 'function') {
      // Use the global initializer provided by the script
      window.initNavigationAfterLoad();
    } else {
      // Fallback: if the script exposed functions directly (older build),
      // call them if available.
      if (typeof initMobileMenu === 'function') initMobileMenu();
      if (typeof setActiveNavLink === 'function') setActiveNavLink();
    }
  }).catch(error => {
    console.error('Error loading navigation script:', error);
  });
</script>
