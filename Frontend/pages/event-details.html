<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Details</title>
    <link rel="icon" type="image/png" href="../public/assets/logo.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    
    <!-- Safari and Cross-browser compatibility -->
    <script src="../public/js/browser-compat.js"></script>
    <script src="../public/js/cross-platform-utils.js"></script>
  </head>
  <body class="bg-gray-50" style="min-height: 100vh; display: flex; flex-direction: column;">


    <!--  Import Header -->

    <div id="header"></div>
    <script>
      // Safari-compatible navigation loading
      function loadNavigation() {
        var headerEl = document.getElementById("header");
        if (!headerEl) {
          console.error('Header element not found');
          return;
        }
        
        fetch("shared-nav.html?v=" + Date.now(), {
          method: 'GET',
          cache: 'no-cache',
          headers: {
            'Accept': 'text/html',
            'Cache-Control': 'no-cache, no-store, must-revalidate'
          }
        })
        .then(function(res) {
          if (!res.ok) {
            throw new Error('HTTP error! status: ' + res.status);
          }
          return res.text();
        })
        .then(function(data) {
          headerEl.innerHTML = data;
          // Small delay to ensure DOM is ready
          setTimeout(function() {
            if (window.initNavigationAfterLoad) {
              window.initNavigationAfterLoad();
            }
          }, 100);
        })
        .catch(function(error) {
          console.warn('Failed to load navigation:', error.message);
          // Minimal fallback nav
          headerEl.innerHTML = '<header class="bg-white shadow-md w-full"><div class="max-w-6xl mx-auto flex items-center justify-between px-4 py-3"><a href="./index.html" class="flex items-center space-x-2"><img src="../public/assets/logo.png" alt="SPC Hospital Logo" class="h-8 w-auto" /><span class="font-bold text-blue-600">SPC Hospital</span></a><nav class="hidden md:flex items-center space-x-6 text-gray-600"><a href="./home.html">Home</a><a href="./doctors.html">Doctors</a><a href="./departments.html">Departments</a><a href="./services.html">Services</a><a href="./gallery.html">Gallery</a><a href="./events.html">Events</a><a href="./contact.html">Contact</a></nav></div></header>';
        });
      }
      
      // Safari-compatible DOM ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadNavigation);
      } else {
        loadNavigation();
      }
    </script>
    </script>

    <main style="flex: 1 0 auto;">
      <div class="container mx-auto p-6">
        <div
          id="eventDetail"
          class="flex flex-col mt-6 justify-center align-center"
        ></div>
      </div>

      <!-- Related Events -->
      <section id="events">
        <div class="text-center my-10 container mx-auto max-w-6xl px-4">
          <h2 class="text-3xl font-bold text-gray-800 mb-8">Other Events</h2>
          
          <!-- Cards Grid -->
          <div
            id="eventContainer"
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-6 lg:gap-8 transition-all duration-500"
          >
            <!-- Cards will be injected by JS -->
          </div>
        </div>
      </section>
    </main>

    <script>
      // Global variables
      let events = [];
      let currentEvent = null;

      // Fetch events from API
      async function fetchEvents() {
        try {
          const response = await fetch((window.buildApiUrl ? window.buildApiUrl('events.php?action=public') : '../../Backend/api/events.php?action=public'));
          const data = await response.json();
          
          if (data.status === 'success') {
            events = data.data;
            loadEventDetails();
            renderRelatedEvents();
          } else {
            console.error('Failed to fetch events:', data.message);
            document.getElementById("eventDetail").innerHTML = '<p class="text-center text-red-500">Failed to load event data: ' + (data.message || 'Unknown error') + '</p>';
          }
        } catch (error) {
          console.error('Error fetching events:', error);
          document.getElementById("eventDetail").innerHTML = '<p class="text-center text-gray-500">Unable to load event details. Please try again later.</p>';
        }
      }

      function loadEventDetails() {
        // Get event id from URL
        const params = new URLSearchParams(window.location.search);
        const eventId = parseInt(params.get("id"));

        if (!eventId || isNaN(eventId)) {
          document.getElementById("eventDetail").innerHTML = '<p class="text-center text-red-500 font-semibold">Invalid event ID. Please select an event from the events page.</p>';
          return;
        }

        // Check if events data is loaded
        if (!events || events.length === 0) {
          document.getElementById("eventDetail").innerHTML = '<p class="text-center text-yellow-500">Loading event data...</p>';
          return;
        }

        // Find event by id
        currentEvent = events.find((e) => parseInt(e.id) === eventId);

        if (currentEvent) {
          // Use the image from database or fallback to default
          let eventImage = currentEvent.image_path || "../public/assets/eyecare.jpg";
          // Handle image path properly
          if (currentEvent.image_path && !currentEvent.image_path.startsWith('http') && !currentEvent.image_path.startsWith('/')) {
            eventImage = window.buildUploadUrl ? window.buildUploadUrl(`events/${currentEvent.image_path}`) : `/doctor-appoinment/uploads/events/${currentEvent.image_path}`;
          } else if (currentEvent.image_path && currentEvent.image_path.startsWith('/')) {
            eventImage = currentEvent.image_path;
          }
          
          const eventTitle = currentEvent.title || "Event";
          const eventDescription = currentEvent.description || "Join us for this special event.";
          const eventDate = currentEvent.event_date ? new Date(currentEvent.event_date).toLocaleDateString('en-US', {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          }) : "TBA";
          const eventTime = currentEvent.event_time || "TBA";
          const eventLocation = currentEvent.location || "Hospital Main Hall";

          document.getElementById("eventDetail").innerHTML = `
            <div class="flex text-gray-600 my-6 leading-relaxed space-x-1 text-sm justify-center max-w-6xl">
                <a href="home.html#events" class="text-blue-600 hover:underline">Home</a>
                <span>&gt;</span>
                <a href="events.html" class="text-blue-600 hover:underline">Events</a>
                <span>&gt;</span>
                <span class="text-gray-800 font-medium">${eventTitle}</span>
            </div>

            <div class="bg-white p-6 flex flex-col justify-between max-w-6xl mx-auto md:flex-row gap-6">
              <img src="${eventImage}" alt="${eventTitle}" class="w-60 h-60 object-cover rounded-lg shadow-md">
              
              <div class="md:w-2/3">
                <h2 class="text-3xl font-bold text-gray-800 mb-4">${eventTitle}</h2>
                
                <!-- Event Details -->
                <div class="space-y-4 mb-6">
                  <div class="flex items-center gap-3">
                    <i class="fa-solid fa-calendar-days text-blue-500 w-5"></i>
                    <div>
                      <p class="font-semibold text-gray-800">Date</p>
                      <p class="text-gray-600">${eventDate}</p>
                    </div>
                  </div>
                  
                  <div class="flex items-center gap-3">
                    <i class="fa-solid fa-clock text-blue-500 w-5"></i>
                    <div>
                      <p class="font-semibold text-gray-800">Time</p>
                      <p class="text-gray-600">${eventTime}</p>
                    </div>
                  </div>
                  
                  <div class="flex items-center gap-3">
                    <i class="fa-solid fa-location-dot text-blue-500 w-5"></i>
                    <div>
                      <p class="font-semibold text-gray-800">Location</p>
                      <p class="text-gray-600">${eventLocation}</p>
                    </div>
                  </div>
                </div>
                
                <div class="mb-6">
                  <h3 class="text-xl font-bold text-gray-800 mb-3">About This Event</h3>
                  <p class="text-gray-600 leading-relaxed">${eventDescription}</p>
                </div>

                <!-- Event Features -->
                <div class="mb-6">
                  <h3 class="text-xl font-bold text-gray-800 mb-3">What to Expect</h3>
                  <ul class="list-disc list-inside space-y-2 text-gray-600">
                    <li>Expert presentations and discussions</li>
                    <li>Interactive sessions and Q&A</li>
                    <li>Networking opportunities</li>
                    <li>Refreshments and light snacks</li>
                    <li>Certificate of participation</li>
                  </ul>
                </div>

              </div>
            </div>
          `;
        } else {
          document.getElementById("eventDetail").innerHTML = '<p class="text-red-500 font-semibold">Event not found. The event with ID ' + eventId + ' does not exist.</p>';
        }
      }

      function renderRelatedEvents() {
        const eventContainer = document.getElementById("eventContainer");
        if (!eventContainer) return;

        // Filter out current event
        const relatedEvents = events.filter((e) => 
          parseInt(e.id) !== parseInt(currentEvent?.id || 0)
        );

        if (relatedEvents.length === 0) {
          eventContainer.innerHTML = '<p class="text-center text-gray-500 col-span-full">No other events available.</p>';
          return;
        }

        // Show only first 4 related events
        const displayEvents = relatedEvents.slice(0, 4);

        eventContainer.innerHTML = displayEvents
          .map((event) => {
            let eventImage = event.image_path || "../public/assets/eyecare.jpg";
            if (event.image_path && !event.image_path.startsWith('http') && !event.image_path.startsWith('/')) {
              eventImage = window.buildUploadUrl ? window.buildUploadUrl(`events/${event.image_path}`) : `/doctor-appoinment/uploads/events/${event.image_path}`;
            } else if (event.image_path && event.image_path.startsWith('/')) {
              eventImage = event.image_path;
            }

            const eventDate = event.event_date ? new Date(event.event_date).toLocaleDateString() : "TBA";

            return `
              <div class="bg-white border border-gray-200 overflow-hidden shadow-sm hover:shadow-lg transition flex flex-col">
                <a href="event-details.html?id=${event.id}">
                  <div class="relative h-56 w-full overflow-hidden group">
                    <img src="${eventImage}" alt="${event.title}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                  </div>
                </a>

                <div class="p-6 flex flex-col justify-between flex-grow">
                  <h3 class="text-xl font-semibold text-blue-800 mb-2 text-start">${event.title}</h3>
                  <div class="flex items-center gap-1 mb-2">
                    <i class="fa-solid fa-calendar-days text-gray-300 text-sm"></i>
                    <h4 class="text-sm font-semibold text-gray-300 mb-2 text-start">${eventDate}</h4>
                  </div>
                  <p class="text-gray-600 text-md mb-4 clamp-4 text-start leading-relaxed">${event.description || "Join us for this special event."}</p>
                </div>
              </div>
            `;
          })
          .join("");
      }


      // Initialize when page loads
      document.addEventListener('DOMContentLoaded', function() {
        fetchEvents();
      });
    </script>

    <style>
      /* Simple fade-in animation */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-fadeIn {
        animation: fadeIn 0.5s ease forwards;
      }
    </style>

    <!-- Footer -->
    <div id="footer"></div>
    <script>
      // Safari-compatible footer loading
      function loadFooter() {
        var footerEl = document.getElementById("footer");
        if (!footerEl) {
          console.error('Footer element not found');
          return;
        }
        
        fetch("footer.html?v=" + Date.now(), {
          method: 'GET',
          cache: 'no-cache',
          headers: {
            'Accept': 'text/html',
            'Cache-Control': 'no-cache, no-store, must-revalidate'
          }
        })
        .then(function(res) {
          if (!res.ok) {
            throw new Error('HTTP error! status: ' + res.status);
          }
          return res.text();
        })
        .then(function(data) {
          footerEl.innerHTML = data;
          // Add proper styling to footer without affecting body layout
          var footer = footerEl.querySelector('footer');
          if (footer) {
            footer.style.marginTop = 'auto';
            footer.style.flexShrink = '0';
          }
        })
        .catch(function(error) {
          console.warn('Failed to load footer:', error.message);
          // Minimal fallback footer with proper styling
          footerEl.innerHTML = '<footer class="bg-gray-700 text-white py-6" style="margin-top: auto; flex-shrink: 0;"><div class="container mx-auto px-4 text-center"><p>&copy; 2025 SPC Hospital. All rights reserved.</p></div></footer>';
        });
      }
      
      // Load footer immediately on DOM ready to prevent layout issues
      loadFooter();
    </script>

    <!-- Placeholder for spinner -->
    <div id="spinner"></div>

    <script>
      // Load spinner markup
      fetch("spinner.html")
        .then(res => res.text())
        .then(data => {
          document.getElementById("spinner").innerHTML = data;

          // Now spinner is in DOM -> attach JS logic
          const spinner = document.getElementById("spinner-overlay");

          function showSpinner() {
            spinner.classList.remove("hidden");
          }
          function hideSpinner() {
            spinner.classList.add("hidden");
          }

          // Show on links
          document.querySelectorAll("a").forEach(link => {
            link.addEventListener("click", () => {
              if (link.getAttribute("href") !== "#" && !link.getAttribute("href")?.startsWith("javascript")) {
                showSpinner();
                setTimeout(hideSpinner, 10000);
              }
            });
          });

          // Show on .show-spinner buttons
          document.querySelectorAll("button.show-spinner").forEach(btn => {
            btn.addEventListener("click", () => {
              showSpinner();
              setTimeout(hideSpinner, 10000);
            });
          });

          // Show on form submit
          document.querySelectorAll("form").forEach(form => {
            form.addEventListener("submit", () => {
              showSpinner();
              setTimeout(hideSpinner, 10000);
            });
          });

          // Optional: hide spinner after page load (auto)
          setTimeout(() => hideSpinner(), 10000);
        });
    </script>

  <script src="../public/js/config.js"></script>
  <script src="../public/js/script.js"></script>
    <script src="shared-nav.js"></script>
  </body>
</html>
