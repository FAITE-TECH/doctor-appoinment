<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Department Details</title>
    <link rel="icon" type="image/png" href="../public/assets/logo.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    
    <!-- Safari and Cross-browser compatibility -->
    <script src="../public/js/browser-compat.js"></script>
    <script src="../public/js/cross-platform-utils.js"></script>
  </head>
  <body class="bg-white" style="min-height: 100vh; display: flex; flex-direction: column;">


    <!--  Import Header -->

    <div id="header"></div>
    <script>
      // Safari-compatible navigation loading
      function loadNavigation() {
        var headerEl = document.getElementById("header");
        if (!headerEl) {
          console.error('Header element not found');
          return;
        }
        
        fetch("shared-nav.html?v=" + Date.now(), {
          method: 'GET',
          cache: 'no-cache',
          headers: {
            'Accept': 'text/html',
            'Cache-Control': 'no-cache, no-store, must-revalidate'
          }
        })
        .then(function(res) {
          if (!res.ok) {
            throw new Error('HTTP error! status: ' + res.status);
          }
          return res.text();
        })
        .then(function(data) {
          headerEl.innerHTML = data;
          // Small delay to ensure DOM is ready
          setTimeout(function() {
            if (window.initNavigationAfterLoad) {
              window.initNavigationAfterLoad();
            }
          }, 100);
        })
        .catch(function(error) {
          console.warn('Failed to load navigation:', error.message);
          // Minimal fallback nav
          headerEl.innerHTML = '<header class="bg-white shadow-md w-full"><div class="max-w-6xl mx-auto flex items-center justify-between px-4 py-3"><a href="./index.html" class="flex items-center space-x-2"><img src="../public/assets/logo.png" alt="SPC Hospital Logo" class="h-8 w-auto" /><span class="font-bold text-blue-600">SPC Hospital</span></a><nav class="hidden md:flex items-center space-x-6 text-gray-600"><a href="./home.html">Home</a><a href="./doctors.html">Doctors</a><a href="./departments.html">Departments</a><a href="./services.html">Services</a><a href="./gallery.html">Gallery</a><a href="./events.html">Events</a><a href="./contact.html">Contact</a></nav></div></header>';
        });
      }
      
      // Safari-compatible DOM ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadNavigation);
      } else {
        loadNavigation();
      }
    </script>
    </script>

    <main style="flex: 1 0 auto;">
      <div class="container mx-auto p-6">
        <div
          id="departmentDetail"
          class="flex flex-col mt-6 justify-center items-center"
        ></div>
      </div>

      <!-- Related Departments -->
      <section id="departments">
        <div class="text-center my-10 container mx-auto max-w-6xl px-4">
          <h2 class="text-3xl font-bold text-gray-800 mb-8">Other Departments</h2>
          
          <!-- Cards Grid -->
          <div
            id="departmentContainer"
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-6 lg:gap-8 transition-all duration-500"
          >
            <!-- Cards will be injected by JS -->
          </div>
        </div>
      </section>
    </main>

    <script>
      // Global variables
      let departments = [];
      let currentDepartment = null;

      // Fetch departments from API
      async function fetchDepartments() {
        try {
          const response = await fetch((window.buildApiUrl ? window.buildApiUrl('departments.php?action=public') : (window.APP_API_FOLDER ? window.APP_API_FOLDER + 'departments.php?action=public' : window.location.origin + '/doctor-appoinment/Backend/api/departments.php?action=public')));
          const data = await response.json();
          
          if (data.status === 'success') {
            departments = data.data;
            loadDepartmentDetails();
            renderRelatedDepartments();
          } else {
            console.error('Failed to fetch departments:', data.message);
            document.getElementById("departmentDetail").innerHTML = '<p class="text-center text-red-500">Failed to load department data: ' + (data.message || 'Unknown error') + '</p>';
          }
        } catch (error) {
          console.error('Error fetching departments:', error);
          document.getElementById("departmentDetail").innerHTML = '<p class="text-center text-gray-500">Unable to load department details. Please try again later.</p>';
        }
      }

      function loadDepartmentDetails() {
        // Get department id from URL
        const params = new URLSearchParams(window.location.search);
        const departmentId = parseInt(params.get("id"));

        if (!departmentId || isNaN(departmentId)) {
          document.getElementById("departmentDetail").innerHTML = '<p class="text-center text-red-500 font-semibold">Invalid department ID. Please select a department from the departments page.</p>';
          return;
        }

        // Check if departments data is loaded
        if (!departments || departments.length === 0) {
          document.getElementById("departmentDetail").innerHTML = '<p class="text-center text-yellow-500">Loading department data...</p>';
          return;
        }

        // Find department by id
        currentDepartment = departments.find((d) => parseInt(d.id) === departmentId);

        if (currentDepartment) {
          // Use the image from database or fallback to default
          let departmentImage = currentDepartment.image_path || "../public/assets/nephrology.jpg";
          // Handle image path properly
          if (currentDepartment.image_path && !currentDepartment.image_path.startsWith('http') && !currentDepartment.image_path.startsWith('/')) {
            departmentImage = window.buildUploadUrl ? window.buildUploadUrl(`departments/${currentDepartment.image_path}`) : `/doctor-appoinment/uploads/departments/${currentDepartment.image_path}`;
          } else if (currentDepartment.image_path && currentDepartment.image_path.startsWith('/')) {
            departmentImage = currentDepartment.image_path;
          }
          
          const departmentName = currentDepartment.name || "Department";
          const departmentDescription = currentDepartment.description || "Specialized medical department providing quality healthcare services.";

          document.getElementById("departmentDetail").innerHTML = `
            <div class="flex text-gray-600 my-10 leading-relaxed space-x-1 text-sm justify-center max-w-6xl">
                <a href="home.html#departments" class="text-blue-600 hover:underline">Home</a>
                <span>&gt;</span>
                <a href="departments.html" class="text-blue-600 hover:underline">Departments</a>
                <span>&gt;</span>
                <span class="text-gray-800 font-medium">${departmentName}</span>
            </div>

            <div class="bg-white p-6 flex flex-col justify-between max-w-6xl mx-auto md:flex-row gap-6 shadow-sm rounded-lg border border-gray-100">
              <img src="${departmentImage}" alt="${departmentName}" class="w-60 h-60 object-cover rounded-lg shadow-md">
              
              <div class="md:w-2/3">
                <h2 class="text-3xl font-bold text-gray-800 mb-2">${departmentName}</h2>
                <p class="text-gray-600 leading-relaxed mb-4">${departmentDescription}</p>
                
                <div class="mt-6">
                  <h3 class="text-xl font-bold text-gray-800 mb-4">Department Services</h3>
                  <ul class="list-disc list-inside space-y-2 text-gray-600">
                    <li>Comprehensive medical consultations</li>
                    <li>Advanced diagnostic procedures</li>
                    <li>Specialized treatment protocols</li>
                    <li>Follow-up care and monitoring</li>
                    <li>Emergency care services</li>
                  </ul>
                </div>

              </div>
            </div>
          `;
        } else {
          document.getElementById("departmentDetail").innerHTML = '<p class="text-red-500 font-semibold">Department not found. The department with ID ' + departmentId + ' does not exist.</p>';
        }
      }

      function renderRelatedDepartments() {
        const departmentContainer = document.getElementById("departmentContainer");
        if (!departmentContainer) return;

        // Filter out current department
        const relatedDepartments = departments.filter((d) => 
          parseInt(d.id) !== parseInt(currentDepartment?.id || 0)
        );

        if (relatedDepartments.length === 0) {
          departmentContainer.innerHTML = '<p class="text-center text-gray-500 col-span-full">No other departments available.</p>';
          return;
        }

        // Show only first 4 related departments
        const displayDepartments = relatedDepartments.slice(0, 4);

        departmentContainer.innerHTML = displayDepartments
          .map((department) => {
            let departmentImage = department.image_path || "../public/assets/nephrology.jpg";
            if (department.image_path && !department.image_path.startsWith('http') && !department.image_path.startsWith('/')) {
              departmentImage = window.buildUploadUrl ? window.buildUploadUrl(`departments/${department.image_path}`) : `/doctor-appoinment/uploads/departments/${department.image_path}`;
            } else if (department.image_path && department.image_path.startsWith('/')) {
              departmentImage = department.image_path;
            }

            return `
              <div class="bg-white border border-gray-200 overflow-hidden shadow-sm hover:shadow-lg transition flex flex-col">
                <a href="department-details.html?id=${department.id}">
                  <div class="relative h-56 w-full overflow-hidden group">
                    <img src="${departmentImage}" alt="${department.name}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                  </div>
                </a>

                <div class="p-6 flex flex-col justify-between flex-grow">
                  <h3 class="text-xl font-semibold text-blue-800 mb-2 text-start">${department.name}</h3>
                  <p class="text-gray-600 text-md mb-4 clamp-4 text-start leading-relaxed">${department.description || "Specialized medical department providing quality healthcare services."}</p>
                </div>
              </div>
            `;
          })
          .join("");
      }

      // Initialize when page loads
      document.addEventListener('DOMContentLoaded', function() {
        fetchDepartments();
      });
    </script>

    <style>
      /* Simple fade-in animation */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-fadeIn {
        animation: fadeIn 0.5s ease forwards;
      }
    </style>

    <!-- Footer -->
    <div id="footer"></div>
    <script>
      // Safari-compatible footer loading
      function loadFooter() {
        var footerEl = document.getElementById("footer");
        if (!footerEl) {
          console.error('Footer element not found');
          return;
        }
        
        fetch("footer.html?v=" + Date.now(), {
          method: 'GET',
          cache: 'no-cache',
          headers: {
            'Accept': 'text/html',
            'Cache-Control': 'no-cache, no-store, must-revalidate'
          }
        })
        .then(function(res) {
          if (!res.ok) {
            throw new Error('HTTP error! status: ' + res.status);
          }
          return res.text();
        })
        .then(function(data) {
          footerEl.innerHTML = data;
          // Add proper styling to footer without affecting body layout
          var footer = footerEl.querySelector('footer');
          if (footer) {
            footer.style.marginTop = 'auto';
            footer.style.flexShrink = '0';
          }
        })
        .catch(function(error) {
          console.warn('Failed to load footer:', error.message);
          // Minimal fallback footer with proper styling
          footerEl.innerHTML = '<footer class="bg-gray-700 text-white py-6" style="margin-top: auto; flex-shrink: 0;"><div class="container mx-auto px-4 text-center"><p>&copy; 2025 SPC Hospital. All rights reserved.</p></div></footer>';
        });
      }
      
      // Load footer immediately on DOM ready to prevent layout issues
      loadFooter();
    </script>

    <!-- Placeholder for spinner -->
    <div id="spinner"></div>

    <script>
      // Load spinner markup
      fetch("spinner.html")
        .then(res => res.text())
        .then(data => {
          document.getElementById("spinner").innerHTML = data;

          // Now spinner is in DOM -> attach JS logic
          const spinner = document.getElementById("spinner-overlay");

          function showSpinner() {
            spinner.classList.remove("hidden");
          }
          function hideSpinner() {
            spinner.classList.add("hidden");
          }

          // Show on links
          document.querySelectorAll("a").forEach(link => {
            link.addEventListener("click", () => {
              if (link.getAttribute("href") !== "#" && !link.getAttribute("href")?.startsWith("javascript")) {
                showSpinner();
                setTimeout(hideSpinner, 10000);
              }
            });
          });

          // Show on .show-spinner buttons
          document.querySelectorAll("button.show-spinner").forEach(btn => {
            btn.addEventListener("click", () => {
              showSpinner();
              setTimeout(hideSpinner, 10000);
            });
          });

          // Show on form submit
          document.querySelectorAll("form").forEach(form => {
            form.addEventListener("submit", () => {
              showSpinner();
              setTimeout(hideSpinner, 10000);
            });
          });

          // Optional: hide spinner after page load (auto)
          setTimeout(() => hideSpinner(), 10000);
        });
    </script>

  <script src="../public/js/config.js"></script>
  <script src="../public/js/script.js"></script>
    <script src="shared-nav.js"></script>
  </body>
</html>
