<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="icon" type="image/png" href="../public/assets/logo.png" />

    <title>Gallery</title>
  </head>
  <body>
    <!-- Header -->
    <div id="header"></div>
    <script>
      fetch("shared-nav.html?v=" + Date.now())
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("header").innerHTML = data;
          // Initialize navigation after it's loaded
          if (window.initNavigationAfterLoad) {
            window.initNavigationAfterLoad();
          }
        });
    </script>

    <!-- Hero -->
    <div class="relative w-full h-40 mx-auto">
      <img
        src="../public/assets/doctor1.jpg"
        alt="doctor"
        class="w-full h-full object-cover rounded-lg"
      />
      <h1
        class="absolute bottom-5 left-20 text-xl font-bold text-white bg-black/50 px-2 py-1 rounded"
      >
        Gallery
      </h1>
    </div>

    <!-- Navigation -->

    <div
      class="flex text-gray-600 my-10 leading-relaxed space-x-1 text-sm mx-auto justify-center max-w-6xl"
    >
      <a href="home.html" class="text-blue-600 hover:underline">Home</a>
      <span>&gt;</span>
      <a href="gallery.html" class="text-blue-600 hover:underline">Gallery</a>
      <span>&gt;</span>
    </div>

    <section id="gallery">
      <div class="text-center my-10 container mx-auto max-w-6xl px-4">
        <h2 class="text-3xl font-bold text-gray-800 mb-8">Our Gallery</h2>
        <p class="text-gray-600 mb-10 max-w-2xl mx-auto">
          Explore our collection of images showcasing our facilities, team, and services.
        </p>

        <!-- Gallery Grid -->
        <div
          id="galleryContainer"
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 transition-all duration-500"
        >
          <!-- Loading message -->
          <div id="loadingMessage" class="col-span-full text-center py-8">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
            <p class="mt-2 text-gray-600">Loading gallery...</p>
          </div>
        </div>
      </div>
    </section>

  <script>
  document.addEventListener("DOMContentLoaded", async () => {
    const galleryContainer = document.getElementById("galleryContainer");
    const loadingMessage = document.getElementById("loadingMessage");

    // Helper: animate cards in
    function animateIn(card) {
      card.classList.add("opacity-0", "translate-y-10", "scale-95");
      requestAnimationFrame(() => {
        card.classList.remove("opacity-0", "translate-y-10", "scale-95");
      });
    }

    // Load gallery images from API
    async function loadGallery() {
      try {
        const response = await fetch('/doctor-appoinment/Backend/api/public_gallery.php');
        
        if (!response.ok) {
          throw new Error('Failed to load gallery');
        }
        
        const data = await response.json();
        const images = data.gallery || [];
        
        // Hide loading message
        loadingMessage.style.display = 'none';
        
        if (images.length === 0) {
          galleryContainer.innerHTML = `
            <div class="col-span-full text-center py-12">
              <div class="text-gray-500 text-lg">No images in gallery yet</div>
              <p class="text-gray-400 mt-2">Check back later for updates!</p>
            </div>
          `;
          return;
        }

        // Render gallery images
        images.forEach((image, index) => {
          const card = document.createElement("div");
          card.className = "bg-white rounded-lg shadow-lg overflow-hidden hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 cursor-pointer";

          card.innerHTML = `
            <div class="relative group" onclick="viewImage('${image.id}')">
              <img src="../uploads/gallery/${image.image_path}" 
                   alt="${image.title}" 
                   class="w-full h-64 object-cover transition-transform duration-300 group-hover:scale-105">
              <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-20 transition-all duration-300"></div>
              <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all duration-300">
                <div class="bg-white bg-opacity-90 rounded-full p-3">
                  <i class="fa-solid fa-expand text-gray-700 text-xl"></i>
                </div>
              </div>
            </div>
            <div class="p-4 gallery-card-content">
              <h3 class="text-lg font-semibold text-blue-800 text-start">${image.title}</h3>
              <p class="text-gray-600 text-sm mb-3 text-start gallery-description">${image.description || 'No description available'}</p>
              <p class="text-gray-500 text-xs text-start">${new Date(image.created_at).toLocaleDateString()}</p>
            </div>
          `;

          galleryContainer.appendChild(card);

          // Stagger animation for nice effect
          setTimeout(() => animateIn(card), index * 100);
        });
        
      } catch (error) {
        console.error('Error loading gallery:', error);
        loadingMessage.style.display = 'none';
        galleryContainer.innerHTML = `
          <div class="col-span-full text-center py-12">
            <div class="text-red-500 text-lg">Failed to load gallery</div>
            <p class="text-gray-400 mt-2">Please try refreshing the page</p>
          </div>
        `;
      }
    }

    // Load gallery on page load
    loadGallery();
  });

  // Function to view image in detail page
  function viewImage(imageId) {
    window.location.href = `gallery-details.html?id=${imageId}`;
  }
</script>



    <!-- Footer -->
    <div id="footer"></div>
    <script>
      fetch("footer.html?v=" + Date.now())
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("footer").innerHTML = data;
        });
    </script>

    <!--  Spinner -->
    <div id="spinner"></div>

    <script>
      // Load spinner markup
      fetch("spinner.html")
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("spinner").innerHTML = data;

          // Now spinner is in DOM -> attach JS logic
          const spinner = document.getElementById("spinner-overlay");

          function showSpinner() {
            spinner.classList.remove("hidden");
          }
          function hideSpinner() {
            spinner.classList.add("hidden");
          }

          // Show on links
          document.querySelectorAll("a").forEach((link) => {
            link.addEventListener("click", () => {
              if (
                link.getAttribute("href") !== "#" &&
                !link.getAttribute("href")?.startsWith("javascript")
              ) {
                showSpinner();
                setTimeout(hideSpinner, 10000); // works now
              }
            });
          });

          // Show on .show-spinner buttons
          document.querySelectorAll("button.show-spinner").forEach((btn) => {
            btn.addEventListener("click", () => {
              showSpinner();
              setTimeout(hideSpinner, 10000); // works now
            });
          });

          // Show on form submit
          document.querySelectorAll("form").forEach((form) => {
            form.addEventListener("submit", () => {
              showSpinner();
              setTimeout(hideSpinner, 10000); // works now
            });
          });

          // Optional: hide spinner after page load (auto)
          setTimeout(() => hideSpinner(), 10000);
        });
    </script>

    <script src="../public/js/script.js"></script>
    <script src="shared-nav.js"></script>
  </body>
</html>
